name: Account deletion Admin vs PostgREST offline contracts

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/account-deletion-finalizer.js'
      - 'apps/web/scripts/test-account-deletion-finalizer.mjs'
      - 'apps/web/scripts/test-account-deletion-finalizer-batch-bound.mjs'
      - 'apps/web/scripts/test-lifecycle-qa-route.mjs'
      - '.github/workflows/account-deletion-auth-rest-boundary-qa.yml'

permissions:
  contents: read

jobs:
  deletion-protocol-and-recovery-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout reviewed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Offline deletion and protected lifecycle QA invariants
        run: |
          test -z "${SUPABASE_SECRET_KEY:-}"
          test -z "${CRON_SECRET:-}"
          test -z "${RESEND_API_KEY:-}"
          node --check src/lib/account-deletion-finalizer.js
          node --check scripts/test-account-deletion-finalizer.mjs
          node scripts/test-account-deletion-finalizer.mjs
          node scripts/test-account-deletion-finalizer-batch-bound.mjs
          node scripts/test-account-deletion-scheduler-contract.mjs
          node scripts/test-lifecycle-qa-route.mjs
