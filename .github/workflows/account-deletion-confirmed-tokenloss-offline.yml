name: Account deletion confirmed-only DBA recovery - offline

on:
  pull_request:
    paths:
      - 'docs/operations/candidates/account-deletion-confirmed-tokenloss-recovery.review.sql'
      - 'docs/operations/candidates/account-deletion-transactional-completion-escrow.review.sql'
      - 'docs/operations/candidates/account-deletion-atomic-claim.review.sql'
      - 'apps/web/scripts/test-account-deletion-confirmed-tokenloss-manual.mjs'
      - '.github/workflows/account-deletion-confirmed-tokenloss-offline.yml'

permissions:
  contents: read

jobs:
  private-manual-recovery-and-rollback:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact pinned dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Test PostgreSQL-only manual gate without secrets
        run: |
          test -z "${SUPABASE_SECRET_KEY:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${CRON_SECRET:-}"
          test -z "${RESEND_API_KEY:-}"
          node --check scripts/test-account-deletion-confirmed-tokenloss-manual.mjs
          node scripts/test-account-deletion-confirmed-tokenloss-manual.mjs
