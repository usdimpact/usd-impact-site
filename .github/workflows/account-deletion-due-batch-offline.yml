name: Account deletion due-batch coordinator - offline only

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/account-deletion-due-batch-candidate.js'
      - 'apps/web/scripts/test-account-deletion-due-batch-candidate.mjs'
      - '.github/workflows/account-deletion-due-batch-offline.yml'

permissions:
  contents: read

jobs:
  synthetic-bounded-batch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: No secret/no network batch contract
        working-directory: apps/web
        run: |
          test -z "${SUPABASE_SECRET_KEY:-}"
          test -z "${CRON_SECRET:-}"
          test -z "${RESEND_API_KEY:-}"
          node --check src/lib/account-deletion-due-batch-candidate.js
          node --check scripts/test-account-deletion-due-batch-candidate.mjs
          node scripts/test-account-deletion-due-batch-candidate.mjs
