name: Issue950 GoTrue Auth Admin soft-delete wire - injected offline

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/account-deletion-gotrue-admin-wire.review.js'
      - 'apps/web/scripts/test-account-deletion-gotrue-admin-wire.review.mjs'
      - 'apps/web/scripts/test-account-deletion-review-only-activation.mjs'
      - '.github/workflows/account-deletion-gotrue-admin-wire-offline.yml'

permissions:
  contents: read

jobs:
  confirm-only-synthetic-admin-wire:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: No provider keys or production activation
        run: |
          test -z "${SUPABASE_SECRET_KEY:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${RESEND_API_KEY:-}"
          test -z "${CRON_SECRET:-}"
          test -z "${ACCOUNT_DELETION_FINALIZER_ENABLED:-}"
      - name: Exercise actual wire and approved no-live-activation boundary
        run: |
          node --check src/lib/account-deletion-gotrue-admin-wire.review.js
          node --check scripts/test-account-deletion-gotrue-admin-wire.review.mjs
          node scripts/test-account-deletion-gotrue-admin-wire.review.mjs
          node scripts/test-account-deletion-review-only-activation.mjs
