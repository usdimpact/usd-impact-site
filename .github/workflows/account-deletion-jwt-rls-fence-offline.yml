name: Account deletion stale JWT RLS fence - offline

on:
  pull_request:
    paths:
      - 'docs/operations/candidates/account-deletion-jwt-rls-fence.review.sql'
      - 'apps/web/scripts/test-account-deletion-jwt-rls-fence.mjs'
      - '.github/workflows/account-deletion-jwt-rls-fence-offline.yml'

permissions:
  contents: read

jobs:
  synthetic-rls-link-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install existing pinned dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Synthetic stale JWT access denial
        run: |
          test -z "${SUPABASE_SECRET_KEY:-}"
          test -z "${CRON_SECRET:-}"
          test -z "${RESEND_API_KEY:-}"
          node --check scripts/test-account-deletion-jwt-rls-fence.mjs
          node scripts/test-account-deletion-jwt-rls-fence.mjs
