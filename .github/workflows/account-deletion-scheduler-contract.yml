name: Account deletion scheduler contract

on:
  pull_request:
    paths:
      - 'apps/web/vercel.json'
      - 'apps/web/scripts/test-account-deletion-scheduler-contract.mjs'
      - '.github/workflows/account-deletion-scheduler-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/vercel.json'
      - 'apps/web/scripts/test-account-deletion-scheduler-contract.mjs'
      - '.github/workflows/account-deletion-scheduler-contract.yml'

permissions:
  contents: read

jobs:
  scheduler-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Verify bounded scheduler configuration
        run: node apps/web/scripts/test-account-deletion-scheduler-contract.mjs
