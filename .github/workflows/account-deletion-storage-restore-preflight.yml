name: Issue950 private Storage restore preflight - no credentials or copy

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/account-deletion-private-storage-restore-plan.review.js'
      - 'apps/web/scripts/test-account-deletion-private-storage-restore-plan.mjs'
      - 'apps/web/src/lib/account-deletion-private-storage-checksum-evidence.review.js'
      - 'apps/web/scripts/test-account-deletion-private-storage-checksum-evidence.mjs'
      - 'apps/web/scripts/test-account-deletion-review-only-activation.mjs'
      - '.github/workflows/account-deletion-storage-restore-preflight.yml'

permissions:
  contents: read

jobs:
  fail-closed-storage-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Require no connected provider credentials
        run: |
          test -z "${SUPABASE_SECRET_KEY:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${RCLONE_CONFIG_ISSUE950_SOURCE_ACCESS_KEY_ID:-}"
          test -z "${RCLONE_CONFIG_ISSUE950_RESTORE_ACCESS_KEY_ID:-}"
          test -z "${RESEND_API_KEY:-}"
          test -z "${CRON_SECRET:-}"
      - name: Test standalone no-network preflight and runtime exclusion
        run: |
          node --check src/lib/account-deletion-private-storage-restore-plan.review.js
          node --check scripts/test-account-deletion-private-storage-restore-plan.mjs
          node scripts/test-account-deletion-private-storage-restore-plan.mjs
          node --check src/lib/account-deletion-private-storage-checksum-evidence.review.js
          node --check scripts/test-account-deletion-private-storage-checksum-evidence.mjs
          node scripts/test-account-deletion-private-storage-checksum-evidence.mjs
          node scripts/test-account-deletion-review-only-activation.mjs
