name: Adaptive learning contract

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/adaptive-learning.js'
      - 'apps/web/scripts/test-adaptive-learning.mjs'
      - '.github/workflows/adaptive-learning-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/adaptive-learning.js'
      - 'apps/web/scripts/test-adaptive-learning.mjs'
      - '.github/workflows/adaptive-learning-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
      - name: Verify deterministic spaced repetition
        run: node scripts/test-adaptive-learning.mjs
