name: Agent action supply-chain hardening

on:
  push:
    branches: [agent/action-supply-chain-hardening-2026-08-25]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-verified-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/action-supply-chain-hardening-2026-08-25
      - name: Generate pinned workflow tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          checkout = '3d3c42e5aac5ba805825da76410c181273ba90b1'
          setup_node = '820762786026740c76f36085b0efc47a31fe5020'
          upload_artifact = 'ea165f8d65b6e75b540449e92b4886f43607fa02'
          helper = Path('.github/workflows/agent-action-ref-inventory.yml')
          workflows = sorted(Path('.github/workflows').glob('*.y*ml'))
          action_re = re.compile(r'(?m)^(\s*-?\s*uses:\s*)([^\s#]+)(\s*(?:#.*)?)$')

          allowed = {
              'actions/checkout@v7', f'actions/checkout@{checkout}',
              'actions/setup-node@v7', f'actions/setup-node@{setup_node}',
              'actions/upload-artifact@v4', f'actions/upload-artifact@{upload_artifact}',
          }
          refs = {
              match.group(2)
              for path in workflows
              for match in action_re.finditer(path.read_text())
          }
          unexpected = sorted(refs - allowed)
          if unexpected:
              raise SystemExit(f'Unexpected action references: {unexpected}')

          replacements = {
              'actions/checkout@v7': f'actions/checkout@{checkout} # v7',
              'actions/setup-node@v7': f'actions/setup-node@{setup_node} # v7',
              'actions/upload-artifact@v4': f'actions/upload-artifact@{upload_artifact} # v4',
          }
          for path in workflows:
              if path == helper:
                  continue
              source = path.read_text()
              for old, new in replacements.items():
                  source = source.replace(old, new)
              source = re.sub(
                  r'(?m)^(\s*node-version:\s*)(?:[\'\"])?22\.16\.0(?:[\'\"])?\s*$',
                  r'\g<1>24.x',
                  source,
              )
              path.write_text(source)

          post_refs = {
              match.group(2)
              for path in workflows if path != helper
              for match in action_re.finditer(path.read_text())
          }
          node_versions = {
              value.strip("'\"")
              for path in workflows if path != helper
              for value in re.findall(r'(?m)^\s*node-version:\s*([^\s#]+)', path.read_text())
          }
          floating = sorted(ref for ref in post_refs if not re.search(r'@[0-9a-f]{40}$', ref))
          if floating:
              raise SystemExit(f'Floating action references remain: {floating}')
          if node_versions - {'24.x'}:
              raise SystemExit(f'Non-Node-24 workflow runtime remains: {sorted(node_versions)}')

          helper.unlink()
          print(f'Verified {len(workflows)-1} workflows; action refs={sorted(post_refs)}; Node versions={sorted(node_versions)}')
          PY

      - name: Upload verified workflow tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-action-hardening-tree
          path: .github/workflows
          if-no-files-found: error
          retention-days: 1
