name: Agent Astro CSP hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/astro-csp-hardening-2026-08-25
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Generate CSP-safe source tree
        run: python3 .github/scripts/generate-csp-hardening.py
      - name: Validate application and CSP build
        working-directory: apps/web
        run: |
          npm run validate
          npm run build
      - name: Create verified commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github apps/web
          git commit -m "Enable native Astro CSP hardening"
          git push origin HEAD:agent/astro-csp-hardening-2026-08-25
