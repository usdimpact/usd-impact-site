name: Agent strict install hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-verified-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/supply-chain-evidence-2026-08-25
      - name: Enforce strict dependency install policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          helper = Path('.github/workflows/agent-strict-install-hardening.yml')
          workflows = sorted(Path('.github/workflows').glob('*.y*ml'))
          protected = 0

          for path in workflows:
              if path == helper:
                  continue
              source = path.read_text()
              source = source.replace(
                  'npm ci --no-audit --no-fund',
                  'npm ci --no-audit --no-fund --strict-allow-scripts',
              )
              unprotected = [
                  line.strip()
                  for line in source.splitlines()
                  if 'npm ci' in line and '--strict-allow-scripts' not in line
              ]
              if unprotected:
                  raise SystemExit(f'{path}: unprotected npm ci commands: {unprotected}')
              protected += sum('npm ci' in line for line in source.splitlines())
              path.write_text(source)

          vercel_path = Path('apps/web/vercel.json')
          vercel = json.loads(vercel_path.read_text())
          vercel['installCommand'] = 'npm ci --no-audit --no-fund --strict-allow-scripts'
          vercel_path.write_text(json.dumps(vercel, indent=2) + '\n')

          helper.unlink()
          print(f'Verified strict install policy across {len(workflows)-1} workflows and {protected} npm ci commands.')
          PY

      - name: Create verified commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows apps/web/vercel.json
          git commit -m "Enforce strict dependency install scripts"
          git push origin HEAD:agent/supply-chain-evidence-2026-08-25
