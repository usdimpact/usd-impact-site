name: USD Impact AI Control Center

on:
  workflow_dispatch:
    inputs:
      command:
        description: Control command
        required: true
        default: status
        type: choice
        options:
          - status
          - next
          - daily
          - sync
  issue_comment:
    types: [created]
  schedule:
    - cron: '41 6 * * 1-5'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: usd-impact-ai-control-center
  cancel-in-progress: false

jobs:
  control:
    if: >-
      github.event_name != 'issue_comment' ||
      ((github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR') &&
       (github.event.comment.body == '/status' ||
        github.event.comment.body == '/next' ||
        github.event.comment.body == '/daily' ||
        github.event.comment.body == '/sync'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Resolve control command
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_COMMAND: ${{ inputs.command }}
          COMMENT_COMMAND: ${{ github.event.comment.body }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            command="sync"
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            command="${COMMENT_COMMAND#/}"
          else
            command="$DISPATCH_COMMAND"
          fi
          case "$command" in
            status|next|daily|sync) ;;
            *) echo "Unsupported command: $command"; exit 1 ;;
          esac
          echo "command=$command" >> "$GITHUB_OUTPUT"

      - name: Refresh project state and priority queue
        id: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/control-center.mjs "${{ steps.resolve.outputs.command }}"

      - name: Reply to slash command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ steps.control.outputs.response }}
        run: gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body="$BODY"

      - name: Dispatch authoritative daily publication workflow
        if: steps.resolve.outputs.command == 'daily' && steps.control.outputs.daily_allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily-news.yml --ref main

      - name: Confirm daily dispatch
        if: github.event_name == 'issue_comment' && steps.resolve.outputs.command == 'daily' && steps.control.outputs.daily_allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh api --method POST "repos/$REPO/issues/$ISSUE_NUMBER/comments" -f body='Daily publication workflow dispatched. Existing generation, validation, exact-head quality, protected review, and merge gates remain authoritative.'

      - name: Prepare automatic state snapshot branch
        if: github.event_name == 'schedule' || steps.resolve.outputs.command == 'sync'
        id: snapshot
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          # B2.3 Stage 1 push isolation: checkout keeps no credential. PUSH_TOKEN
          # is set only for this step, is un-exported before any child process
          # starts, and is handed to one git push as process-only Git config.
          usd_push_token="${PUSH_TOKEN-}"
          unset PUSH_TOKEN
          usd_guard_branch() {
            local allowed='^automation/control-center-state$'
            if [ -z "${1-}" ] || ! [[ "$1" =~ $allowed ]] || ! git check-ref-format "refs/heads/$1"; then
              echo "::error::Unapproved automation branch name; push held."
              return 1
            fi
          }
          usd_prepare_push_auth() {
            usd_push_auth=""
            if [ -z "$usd_push_token" ]; then
              echo "::error::Missing job push token; push held."
              return 1
            fi
            usd_push_auth="$(printf 'x-access-token:%s' "$usd_push_token" | base64 | tr -d '\n')"
            if [ -z "$usd_push_auth" ]; then
              echo "::error::Push credential could not be prepared; push held."
              return 1
            fi
            printf '::add-mask::%s\n' "$usd_push_auth"
          }
          if git diff --quiet -- docs/operations/ai-control-center/PROJECT_STATE.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="automation/control-center-state"
          usd_guard_branch "$branch" || exit 1
          git config user.name "usd-impact-control-center"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$branch"
          git add docs/operations/ai-control-center/PROJECT_STATE.json
          git commit -m "Refresh USD Impact control-center state"
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::Remote-tracking refs unavailable; lease not established; push held."
            exit 1
          fi
          # Explicit lease from the full-history checkout fetch: an existing state
          # branch must still be at lease_sha; an empty lease_sha means it must not exist.
          lease_sha="$(git rev-parse --verify --quiet "refs/remotes/origin/$branch" || true)"
          usd_prepare_push_auth || exit 1
          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${usd_push_auth}" \
            git push --force-with-lease="refs/heads/$branch:$lease_sha" origin "$branch"
          unset usd_push_auth usd_push_token
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or refresh state snapshot pull request
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.snapshot.outputs.branch }}
        run: |
          existing="$(gh pr list --state open --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            cat > "$RUNNER_TEMP/control-center-pr.md" <<'EOF'
          ## Automated USD Impact control-center state refresh

          This PR updates only the generated `PROJECT_STATE.json` snapshot from live GitHub repository, issue, and workflow evidence.

          The snapshot is informational and does not override canonical governance, deployment configuration, or production state. Vercel production verification remains a separate release step.
          EOF
            gh pr create --base main --head "$BRANCH" --title "Refresh USD Impact control-center state" --body-file "$RUNNER_TEMP/control-center-pr.md"
          else
            echo "Updated existing control-center state PR #$existing."
          fi
