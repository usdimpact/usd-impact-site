# LOCAL PROPOSAL ONLY. Do not commit without separate owner approval.
name: Catalyst parser dependency preflight
on:
  push:
    branches: [preflight/catalyst-parser-dependency-20260917]
    paths: [.github/workflows/catalyst-parser-dependency-preflight.yml]
permissions:
  contents: read
concurrency:
  group: catalyst-parser-dependency-preflight-20260917
  cancel-in-progress: false
jobs:
  inspect-dependency:
    if: github.repository == 'usdimpact/usd-impact-site' && github.event.deleted == false && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing reviewed v7 pin
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # existing reviewed v7 pin
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Generate bounded dependency receipt in ephemeral storage
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'PREFLIGHT_NODE'
          // Proposal only: executed by the bounded GitHub job only after separate approval.
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { copyFileSync, mkdirSync, readFileSync, statSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          
          const REPOSITORY = 'usdimpact/usd-impact-site';
          const HEAD = 'a70271bc11bd15d73fd102d619e3bbc1b0269ff0';
          const MAIN = '9b143b7bd5619145403270fec036fbe201aa70d5';
          const SOURCE_BRANCH = 'publishing/catalyst-lifecycle-diagnostic-20260917';
          const TEMP_BRANCH = 'preflight/catalyst-parser-dependency-20260917';
          const WORKFLOW = '.github/workflows/catalyst-parser-dependency-preflight.yml';
          const REGISTRY = 'https://registry.npmjs.org/';
          const sha256 = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const gitBlob = (bytes) => createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          let stage = 'scope';
          const fail = (code) => { throw new Error(code); };
          
          function command(executable, args, cwd, env, accepted = [0]) {
            const result = spawnSync(executable, args, {
              cwd, env, shell: false, encoding: 'utf8', timeout: 90000,
              maxBuffer: 2 * 1024 * 1024,
            });
            if (result.error || result.signal || !accepted.includes(result.status)) fail('PREFLIGHT_COMMAND_FAILED');
            return result.stdout;
          }
          
          function validateDelta(beforeManifest, afterManifest, beforeLock, afterLock) {
            assert.equal(afterManifest.devDependencies?.parse5, '8.0.1');
            const manifestCopy = structuredClone(afterManifest);
            delete manifestCopy.devDependencies.parse5;
            assert.deepEqual(manifestCopy, beforeManifest, 'UNRELATED_MANIFEST_CHANGE');
            assert.equal(afterLock.lockfileVersion, 3);
            const oldRoot = beforeLock.packages[''];
            const newRoot = structuredClone(afterLock.packages['']);
            assert.equal(newRoot.devDependencies?.parse5, '8.0.1');
            delete newRoot.devDependencies.parse5;
            assert.deepEqual(newRoot, oldRoot, 'UNRELATED_LOCK_ROOT_CHANGE');
            const oldShell = { ...beforeLock }; delete oldShell.packages;
            const newShell = { ...afterLock }; delete newShell.packages;
            assert.deepEqual(newShell, oldShell, 'UNRELATED_LOCK_HEADER_CHANGE');
            for (const [key, value] of Object.entries(beforeLock.packages)) {
              if (key) assert.deepEqual(afterLock.packages[key], value, `EXISTING_PACKAGE_DRIFT:${key}`);
            }
            const added = Object.keys(afterLock.packages).filter((key) => !Object.hasOwn(beforeLock.packages, key));
            assert.ok(added.length >= 1 && added.length <= 2, 'UNEXPECTED_ADDED_PACKAGE_COUNT');
            assert.ok(added.includes('node_modules/parse5'));
            const permitted = new Set(['node_modules/parse5', 'node_modules/entities', 'node_modules/parse5/node_modules/entities']);
            assert.ok(added.every(key => permitted.has(key)), 'UNRELATED_NEW_PACKAGE');
            const entitiesKey = Object.hasOwn(afterLock.packages, 'node_modules/parse5/node_modules/entities')
              ? 'node_modules/parse5/node_modules/entities' : 'node_modules/entities';
            const selected = ['node_modules/parse5', entitiesKey];
            for (const key of selected) {
              assert.ok(afterLock.packages[key], 'MISSING_RESOLVED_DEPENDENCY');
              const item = afterLock.packages[key];
              const name = key.endsWith('/parse5') ? 'parse5' : 'entities';
              assert.match(item.version, name === 'parse5' ? /^8\.0\.1$/ : /^8\.\d+\.\d+$/);
              assert.equal(item.resolved, `${REGISTRY}${name}/-/${name}-${item.version}.tgz`);
              assert.match(item.integrity, /^sha512-[A-Za-z0-9+/]+={0,2}$/);
              if (added.includes(key)) assert.equal(item.dev, true);
              assert.notEqual(item.hasInstallScript, true);
              assert.equal(item.license, name === 'parse5' ? 'MIT' : 'BSD-2-Clause');
              assert.deepEqual(item.dependencies || {}, name === 'parse5' ? { entities: '^8.0.0' } : {});
              assert.ok(!item.optionalDependencies && !item.peerDependencies, 'UNREVIEWED_DEPENDENCY_EDGE');
            }
            return selected;
          }
          
          async function publicRef(branch) {
            const response = await fetch(`https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${branch}`, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'usd-impact-parser-preflight' },
            });
            if (response.status !== 200) fail('PUBLIC_REF_READ_FAILED');
            const text = await response.text();
            if (Buffer.byteLength(text) > 32768) fail('REF_RESPONSE_TOO_LARGE');
            const data = JSON.parse(text);
            if (data.ref !== `refs/heads/${branch}` || data.object?.type !== 'commit') fail('INVALID_REF_RESPONSE');
            return data.object.sha;
          }
          
          async function main() {
            assert.equal(process.env.GITHUB_REPOSITORY, REPOSITORY);
            assert.equal(process.env.GITHUB_REF, `refs/heads/${TEMP_BRANCH}`);
            assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
            assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'NO_RERUN_AUTHORIZED');
            assert.match(process.env.GITHUB_SHA || '', /^[0-9a-f]{40}$/);
            const workspace = process.env.GITHUB_WORKSPACE;
            const temp = process.env.RUNNER_TEMP;
            if (!workspace || !temp) fail('RUNNER_CONTEXT_REQUIRED');
            const root = path.join(temp, 'usd-impact-parser-preflight');
            const home = path.join(root, 'home');
            const work = path.join(root, 'work');
            const original = path.join(root, 'original');
            const packs = path.join(root, 'packs');
            const smoke = path.join(root, 'smoke');
            for (const directory of [home, work, original, packs, smoke]) mkdirSync(directory, { recursive: true });
            const userConfig = path.join(root, 'user.npmrc');
            const globalConfig = path.join(root, 'global.npmrc');
            writeFileSync(userConfig, ''); writeFileSync(globalConfig, '');
            // Deliberately do not forward the runner's secret/token environment to npm or package code.
            const env = {
              PATH: process.env.PATH, HOME: home, TMPDIR: temp, CI: 'true', LANG: 'C.UTF-8',
              NPM_CONFIG_USERCONFIG: userConfig, NPM_CONFIG_GLOBALCONFIG: globalConfig,
              NPM_CONFIG_CACHE: path.join(root, 'cache'), NPM_CONFIG_REGISTRY: REGISTRY,
              NPM_CONFIG_FETCH_RETRIES: '0', NPM_CONFIG_FETCH_TIMEOUT: '20000',
              NPM_CONFIG_IGNORE_SCRIPTS: 'true', NPM_CONFIG_AUDIT: 'false', NPM_CONFIG_FUND: 'false',
            };
            const git = (...args) => command('git', args, workspace, { PATH: env.PATH, HOME: home });
            assert.equal(git('rev-parse', 'HEAD').trim(), process.env.GITHUB_SHA);
            assert.equal(git('rev-parse', 'HEAD^').trim(), HEAD);
            assert.equal(git('diff', '--name-only', 'HEAD^', 'HEAD').trim(), WORKFLOW);
            assert.equal(await publicRef('main'), MAIN, 'MAIN_DRIFT');
            assert.equal(await publicRef(SOURCE_BRANCH), HEAD, 'PR637_HEAD_DRIFT');
          
            const inputs = [
              ['package.json', '69c070c48b1924e30af70cdf60476da76581522c'],
              ['package-lock.json', '36fb10be631e07fb145b2373147ea6c12e43623a'],
            ];
            for (const [name, blob] of inputs) {
              const file = path.join(workspace, 'apps/web', name);
              assert.equal(gitBlob(readFileSync(file)), blob, `INPUT_BLOB_MISMATCH:${name}`);
              copyFileSync(file, path.join(work, name)); copyFileSync(file, path.join(original, name));
            }
            const npm = (...args) => command('npm', args, work, env);
            stage = 'generate-lockfile';
            npm('install', '--package-lock-only', '--save-dev', '--save-exact', '--ignore-scripts', '--no-audit', '--no-fund', 'parse5@8.0.1');
            const beforeManifest = JSON.parse(readFileSync(path.join(original, 'package.json'), 'utf8'));
            const manifest = JSON.parse(readFileSync(path.join(work, 'package.json'), 'utf8'));
            const beforeLock = JSON.parse(readFileSync(path.join(original, 'package-lock.json'), 'utf8'));
            const lock = JSON.parse(readFileSync(path.join(work, 'package-lock.json'), 'utf8'));
            stage = 'validate-dependency-delta';
            const added = validateDelta(beforeManifest, manifest, beforeLock, lock);
          
            stage = 'verify-package-tarballs';
            const packageEvidence = [];
            const tarballs = [];
            for (const key of added) {
              const item = lock.packages[key];
              const name = key.endsWith('/parse5') ? 'parse5' : 'entities';
              const spec = `${name}@${item.version}`;
              const metadata = JSON.parse(npm('view', spec, '--json'));
              assert.equal(metadata.name, name); assert.equal(metadata.version, item.version);
              assert.equal(metadata.dist?.integrity, item.integrity);
              assert.equal(metadata.dist?.tarball, item.resolved);
              assert.deepEqual(metadata.dependencies || {}, item.dependencies || {});
              for (const hook of ['preinstall', 'install', 'postinstall', 'prepare']) {
                assert.ok(!metadata.scripts?.[hook], 'UNREVIEWED_PACKAGE_HOOK');
              }
              const packed = JSON.parse(npm('pack', spec, '--ignore-scripts', '--json', '--pack-destination', packs));
              assert.equal(packed.length, 1);
              assert.equal(packed[0].filename, `${name}-${item.version}.tgz`);
              const filename = path.join(packs, packed[0].filename);
              assert.ok(statSync(filename).isFile() && statSync(filename).size <= 2000000);
              const bytes = readFileSync(filename);
              const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
              assert.equal(integrity, item.integrity, 'TARBALL_INTEGRITY_MISMATCH');
              tarballs.push(filename);
              packageEvidence.push({ name, version: item.version, resolved: item.resolved, integrity, bytes: bytes.length, license: item.license });
            }
          
            stage = 'audit-advisories';
            const audit = JSON.parse(npm('audit', '--package-lock-only', '--json'));
            assert.ok(audit.metadata?.vulnerabilities && !audit.error, 'INCOMPLETE_AUDIT');
            assert.equal(audit.metadata.vulnerabilities.total, 0, 'DEPENDENCY_ADVISORY_HOLD');
            stage = 'isolated-parser-smoke';
            writeFileSync(path.join(smoke, 'package.json'), '{"name":"usd-impact-parser-smoke","private":true,"type":"module"}\n');
            command('npm', ['install', '--offline', '--ignore-scripts', '--no-audit', '--no-fund', ...tarballs], smoke, env);
            const smokeScript = `import assert from 'node:assert/strict';
              import { parse } from 'parse5';
              const errors = [];
              const document = parse('<!doctype html><html><head><title>Probe</title></head><body><p>A &amp; B</p></body></html>', { sourceCodeLocationInfo: true, onParseError: e => errors.push(e.code) });
              assert.equal(errors.length, 0);
              const html = document.childNodes.find(n => n.tagName === 'html');
              const body = html.childNodes.find(n => n.tagName === 'body');
              const p = body.childNodes.find(n => n.tagName === 'p');
              assert.equal(p.childNodes[0].value, 'A & B');
              assert.ok(p.sourceCodeLocation?.startTag && p.sourceCodeLocation?.endTag);
              parse('<!doctype html><html><head></head><body><p id="a" id="b">x</p></body></html>', { onParseError: e => errors.push(e.code) });
              assert.ok(errors.includes('duplicate-attribute'));
              console.log('PARSER_SMOKE_PASS_NOT_ASTRO_VALIDATION');`;
            command(process.execPath, ['--input-type=module', '-e', smokeScript], smoke, env);
          
            stage = 'final-reference-and-output-validation';
            assert.equal(await publicRef('main'), MAIN, 'MAIN_DRIFT_AT_END');
            assert.equal(await publicRef(SOURCE_BRANCH), HEAD, 'PR637_HEAD_DRIFT_AT_END');
            assert.equal(git('status', '--porcelain').trim(), '', 'CHECKOUT_WAS_MODIFIED');
            const patches = inputs.map(([name, originalBlob]) => {
              const before = path.join(original, name), after = path.join(work, name);
              const patch = command('diff', ['-u', '--label', `a/apps/web/${name}`, '--label', `b/apps/web/${name}`, before, after], work, env, [1]);
              assert.ok(Buffer.byteLength(patch) <= 24000, 'UNEXPECTED_PATCH_SIZE');
              const bytes = readFileSync(after);
              return { path: `apps/web/${name}`, originalBlob, generatedBlob: gitBlob(bytes), generatedSha256: sha256(bytes), patchBase64: Buffer.from(patch).toString('base64') };
            });
            const receipt = {
              result: 'DEPENDENCY_PREFLIGHT_ONLY_NOT_PROJECTION_VALIDATION',
              repository: REPOSITORY, sourceHead: HEAD, expectedMain: MAIN,
              runCommit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
              node: process.version, npm: npm('--version').trim(),
              packages: packageEvidence, auditVulnerabilities: audit.metadata.vulnerabilities,
              smoke: 'PASS', patches, npmLifecycleScriptsExecuted: false,
              repositoryFilesModifiedByJob: false, projectionTested: false,
              astroBuildPerformed: false, publicationAuthorized: false,
            };
            console.log('USDIMPACT_DEPENDENCY_RECEIPT_BEGIN');
            console.log(JSON.stringify(receipt));
            console.log('USDIMPACT_DEPENDENCY_RECEIPT_END');
          }
          
          main().catch(() => {
            // Do not print raw npm responses, environment contents, headers or arbitrary errors.
            console.error(`DEPENDENCY_PREFLIGHT_STOPPED at ${stage}; no generated patch is accepted.`);
            process.exitCode = 1;
          });
          PREFLIGHT_NODE
