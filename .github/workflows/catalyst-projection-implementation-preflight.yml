# PROPOSAL ONLY: requires separate workflow and job-permission approval.
name: Catalyst projection isolated implementation verification
on:
  push:
    branches: [preflight/catalyst-projection-implementation-20260917]
    paths: [.github/workflows/catalyst-projection-implementation-preflight.yml]
permissions: {}
jobs:
  verify:
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tested_files: ${{ steps.verify.outputs.tested_files }}
      files_digest: ${{ steps.verify.outputs.files_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Assemble exact seven files and verify genuine parser and locked build
        id: verify
        env:
          INPUT_PART_0: ""
          INPUT_PART_1: ""
          INPUT_PART_2: ""
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'VERIFY_NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync, gzipSync } from 'node:zlib';
          const REPOSITORY = 'usdimpact/usd-impact-site';
          const SOURCE_HEAD = 'a70271bc11bd15d73fd102d619e3bbc1b0269ff0';
          const MAIN = '9b143b7bd5619145403270fec036fbe201aa70d5';
          const SOURCE_BRANCH = 'publishing/catalyst-lifecycle-diagnostic-20260917';
          const TEMP_BRANCH = 'preflight/catalyst-projection-implementation-20260917';
          const WORKFLOW = '.github/workflows/catalyst-projection-implementation-preflight.yml';
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const gitBlob = bytes => createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          const fail = code => { throw new Error(code); };
          function context() {
            assert.equal(process.env.GITHUB_REPOSITORY, REPOSITORY);
            assert.equal(process.env.GITHUB_REF, `refs/heads/${TEMP_BRANCH}`);
            assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
            assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'RERUN_NOT_AUTHORIZED');
            assert.match(process.env.GITHUB_SHA || '', /^[a-f0-9]{40}$/);
          }
          async function ref(branch) {
            const response = await fetch(`https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${branch}`, {
              redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'usd-impact-isolated-build' },
            });
            assert.equal(response.status, 200, 'REF_READ_FAILED');
            const text = await response.text();
            assert.ok(Buffer.byteLength(text) < 32768, 'REF_TOO_LARGE');
            const data = JSON.parse(text);
            assert.equal(data.ref, `refs/heads/${branch}`);
            assert.equal(data.object?.type, 'commit');
            return data.object.sha;
          }
          async function frozenRefs() {
            assert.equal(await ref('main'), MAIN, 'MAIN_DRIFT');
            assert.equal(await ref(SOURCE_BRANCH), SOURCE_HEAD, 'SOURCE_DRIFT');
            assert.equal(await ref(TEMP_BRANCH), process.env.GITHUB_SHA, 'TEMP_BRANCH_DRIFT');
          }

          import { appendFileSync, copyFileSync, lstatSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const INPUT_BUNDLE_SHA256 = "a4361da9112129a5bce00be68204909b08276915e18744eda7c5264e6cc796db";
          const INPUT_BUNDLE_BASE64 = [process.env.INPUT_PART_0, process.env.INPUT_PART_1, process.env.INPUT_PART_2].join('');
          const ALLOWED_INPUTS = ["assemble-approved-seven-files.py", "candidate/apps/web/scripts/lib/catalyst-rendered-projection.mjs", "candidate/apps/web/scripts/test-catalyst-rendered-projection.mjs", "candidate/apps/web/scripts/verify-catalyst-rendered-projection.mjs", "candidate/docs/operations/catalyst-rendered-projection.md", "dependency-receipt.json", "patches/package-lock.json.patch", "patches/package.json.patch", "post-build-append.txt"];
          const PATHS = ["apps/web/package-lock.json", "apps/web/package.json", "apps/web/scripts/lib/catalyst-rendered-projection.mjs", "apps/web/scripts/test-catalyst-rendered-projection.mjs", "apps/web/scripts/verify-catalyst-rendered-projection.mjs", "apps/web/scripts/verify-production-build.mjs", "docs/operations/catalyst-rendered-projection.md"];

          let stage = 'scope';
          function command(executable, args, cwd, env, timeout = 120000) {
            const result = spawnSync(executable, args, { cwd, env, shell: false, encoding: 'utf8', timeout, maxBuffer: 8 * 1024 * 1024 });
            if (result.error || result.signal || result.status !== 0) {
              // The supplied environment has no custom secrets. Retain test/build diagnostics.
              if (result.stdout) console.log(result.stdout.slice(-20000));
              if (result.stderr) console.log(result.stderr.slice(-5000));
              fail('CHILD_FAILED');
            }
            return result.stdout;
          }
          function passedTests(output, expected = null) {
            const summary = {};
            for (const line of output.split(/\r?\n/)) {
              const m = /^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$/.exec(line.trim());
              if (m) { assert.ok(!Object.hasOwn(summary, m[1]), 'DUPLICATE_TEST_SUMMARY'); summary[m[1]] = Number(m[2]); }
            }
            assert.ok(summary.tests > 0 && summary.pass === summary.tests, 'INCOMPLETE_TEST_SUMMARY');
            for (const key of ['fail', 'cancelled', 'skipped', 'todo']) assert.equal(summary[key], 0, 'TESTS_NOT_ALL_PASSED');
            if (expected !== null) assert.equal(summary.tests, expected);
            return summary.tests;
          }
          async function main() {
            context();
            const workspace = process.env.GITHUB_WORKSPACE;
            const temp = process.env.RUNNER_TEMP;
            assert.ok(workspace && temp);
            const root = path.join(temp, 'usd-impact-projection-implementation');
            const bundleRoot = path.join(root, 'inputs');
            const output = path.join(root, 'assembled');
            const home = path.join(root, 'home');
            for (const p of [bundleRoot, home]) mkdirSync(p, { recursive: true });
            const userConfig = path.join(root, 'user.npmrc');
            const globalConfig = path.join(root, 'global.npmrc');
            writeFileSync(userConfig, ''); writeFileSync(globalConfig, '');
            // Never forward runner token/secret variables to npm, project code or dependencies.
            const env = { PATH: process.env.PATH, HOME: home, TMPDIR: temp, CI: 'true', LANG: 'C.UTF-8',
              ASTRO_TELEMETRY_DISABLED: '1', NPM_CONFIG_USERCONFIG: userConfig, NPM_CONFIG_GLOBALCONFIG: globalConfig,
              NPM_CONFIG_CACHE: path.join(root, 'cache'), NPM_CONFIG_REGISTRY: 'https://registry.npmjs.org/',
              NPM_CONFIG_FETCH_RETRIES: '0', NPM_CONFIG_FETCH_TIMEOUT: '20000', NPM_CONFIG_AUDIT: 'false', NPM_CONFIG_FUND: 'false' };
            const git = (...args) => command('git', args, workspace, { PATH: env.PATH, HOME: home });
            assert.equal(git('rev-parse', 'HEAD').trim(), process.env.GITHUB_SHA);
            assert.equal(git('diff', '--name-only', SOURCE_HEAD, 'HEAD').trim(), WORKFLOW, 'NOT_WORKFLOW_ONLY');
            const attemptSequence = Number(git('rev-list', '--count', `${SOURCE_HEAD}..HEAD`).trim());
            assert.ok(Number.isInteger(attemptSequence) && attemptSequence >= 1 && attemptSequence <= 3, 'ATTEMPT_LIMIT');
            assert.equal(git('rev-list', '--min-parents=2', `${SOURCE_HEAD}..HEAD`).trim(), '', 'MERGE_NOT_ALLOWED');
            for (const commit of git('rev-list', `${SOURCE_HEAD}..HEAD`).trim().split('\n')) {
              assert.match(commit, /^[a-f0-9]{40}$/);
              assert.equal(git('diff', '--name-only', `${commit}^`, commit).trim(), WORKFLOW, 'INTERMEDIATE_SCOPE_DRIFT');
            }
            assert.equal(git('status', '--porcelain').trim(), '', 'CHECKOUT_NOT_CLEAN');
            await frozenRefs();
            stage = 'assemble-exact-source';
            const packed = Buffer.from(INPUT_BUNDLE_BASE64, 'base64');
            assert.equal(sha256(packed), INPUT_BUNDLE_SHA256);
            const bundle = JSON.parse(gunzipSync(packed, { maxOutputLength: 1024 * 1024 }).toString('utf8'));
            assert.deepEqual(Object.keys(bundle).sort(), ALLOWED_INPUTS);
            for (const relative of ALLOWED_INPUTS) {
              const file = path.join(bundleRoot, relative);
              assert.ok(file.startsWith(bundleRoot + path.sep));
              const bytes = Buffer.from(bundle[relative], 'base64');
              assert.equal(bytes.toString('base64'), bundle[relative]);
              mkdirSync(path.dirname(file), { recursive: true });
              writeFileSync(file, bytes, { flag: 'wx' });
            }
            const assembly = JSON.parse(command('python3', [path.join(bundleRoot, 'assemble-approved-seven-files.py'),
              '--checkout', workspace, '--output', output], workspace, env));
            assert.deepEqual(assembly.files.map(f => f.path).sort(), PATHS);
            for (const item of assembly.files) {
              const bytes = readFileSync(path.join(output, item.path));
              assert.equal(gitBlob(bytes), item.gitBlob); assert.equal(sha256(bytes), item.sha256);
              const target = path.join(workspace, item.path);
              mkdirSync(path.dirname(target), { recursive: true });
              copyFileSync(path.join(output, item.path), target);
            }
            const web = path.join(workspace, 'apps/web');
            stage = 'locked-dependency-install';
            console.log(command('npm', ['ci', '--no-audit', '--no-fund', '--strict-allow-scripts'], web, env));
            stage = 'current-advisory-audit';
            const audit = JSON.parse(command('npm', ['audit', '--package-lock-only', '--json'], web, env));
            assert.equal(audit.metadata?.vulnerabilities?.total, 0, 'ADVISORY_HOLD');
            stage = 'genuine-parser-tests';
            const parserLog = command(process.execPath, ['--test', 'scripts/test-catalyst-rendered-projection.mjs'], web, env);
            console.log(parserLog);
            const parserTests = passedTests(parserLog);
            stage = 'unchanged-lifecycle-tests';
            const lifecycleLog = command(process.execPath, ['--test', 'scripts/test-catalyst-lifecycle-diagnostic.mjs'], workspace, env);
            console.log(lifecycleLog);
            const lifecycleTests = passedTests(lifecycleLog, 165);
            stage = 'locked-astro-build';
            const buildLog = command('npm', ['run', 'build'], web, env, 240000);
            console.log(buildLog);
            assert.ok(buildLog.includes('production build verification pass'), 'MISSING_BASELINE_BUILD_RESULT');
            stage = 'generated-output-inspection';
            const generated = JSON.parse(command(process.execPath, ['scripts/verify-catalyst-rendered-projection.mjs'], web, env));
            assert.equal(generated.status, 'GENERATED_CATALYST_STRUCTURE_CHECKED_NOT_PUBLICATION_VERIFIED');
            assert.ok(generated.inspectedPageCount > 0);
            assert.equal(generated.publicationAuthorized, false);
            stage = 'scope-and-output';
            const tracked = git('diff', '--name-only', '-z', 'HEAD').split('\0').filter(Boolean);
            const untracked = git('ls-files', '--others', '--exclude-standard', '-z').split('\0').filter(Boolean);
            assert.deepEqual([...tracked, ...untracked].sort(), PATHS, 'UNAPPROVED_OUTPUT_PATH');
            const files = assembly.files.map(item => {
              const file = path.join(workspace, item.path);
              assert.ok(lstatSync(file).isFile() && !lstatSync(file).isSymbolicLink());
              const bytes = readFileSync(file);
              assert.equal(gitBlob(bytes), item.gitBlob, 'SOURCE_CHANGED_DURING_TESTS');
              assert.equal(sha256(bytes), item.sha256);
              return { ...item, base64: bytes.toString('base64') };
            });
            await frozenRefs();
            const payload = { status: 'TESTED_SEVEN_FILE_SOURCE_NOT_RELEASED', repository: REPOSITORY,
              sourceHead: SOURCE_HEAD, main: MAIN, runCommit: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
              node: process.version, attemptSequence, parserTests, lifecycleTests, auditVulnerabilities: audit.metadata.vulnerabilities,
              generated, files, publicationAuthorized: false, branchWritten: false };
            const packedOutput = gzipSync(Buffer.from(JSON.stringify(payload)), { level: 9 });
            const encoded = packedOutput.toString('base64');
            assert.ok(encoded.length < 120000, 'HANDOFF_TOO_LARGE');
            assert.ok(process.env.GITHUB_OUTPUT);
            appendFileSync(process.env.GITHUB_OUTPUT, `tested_files=${encoded}\nfiles_digest=${sha256(packedOutput)}\n`);
            console.log(JSON.stringify({ ...payload, files: files.map(({ base64, ...item }) => item),
              handoffBytes: packedOutput.length, handoffSha256: sha256(packedOutput) }));
          }
          main().catch(() => { console.error(`IMPLEMENTATION_VERIFY_STOPPED:${stage}; no blob upload or branch update is accepted.`); process.exitCode = 1; });

          VERIFY_NODE
  preserve-tested-blobs:
    needs: verify
    if: needs.verify.result == 'success' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Upload only the seven verified immutable Git blobs
        env:
          TESTED_FILES: ${{ needs.verify.outputs.tested_files }}
          FILES_DIGEST: ${{ needs.verify.outputs.files_digest }}
          BLOB_UPLOAD_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'UPLOAD_NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { gunzipSync, gzipSync } from 'node:zlib';
          const REPOSITORY = 'usdimpact/usd-impact-site';
          const SOURCE_HEAD = 'a70271bc11bd15d73fd102d619e3bbc1b0269ff0';
          const MAIN = '9b143b7bd5619145403270fec036fbe201aa70d5';
          const SOURCE_BRANCH = 'publishing/catalyst-lifecycle-diagnostic-20260917';
          const TEMP_BRANCH = 'preflight/catalyst-projection-implementation-20260917';
          const WORKFLOW = '.github/workflows/catalyst-projection-implementation-preflight.yml';
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const gitBlob = bytes => createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          const fail = code => { throw new Error(code); };
          function context() {
            assert.equal(process.env.GITHUB_REPOSITORY, REPOSITORY);
            assert.equal(process.env.GITHUB_REF, `refs/heads/${TEMP_BRANCH}`);
            assert.equal(process.env.GITHUB_EVENT_NAME, 'push');
            assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'RERUN_NOT_AUTHORIZED');
            assert.match(process.env.GITHUB_SHA || '', /^[a-f0-9]{40}$/);
          }
          async function ref(branch) {
            const response = await fetch(`https://api.github.com/repos/${REPOSITORY}/git/ref/heads/${branch}`, {
              redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'usd-impact-isolated-build' },
            });
            assert.equal(response.status, 200, 'REF_READ_FAILED');
            const text = await response.text();
            assert.ok(Buffer.byteLength(text) < 32768, 'REF_TOO_LARGE');
            const data = JSON.parse(text);
            assert.equal(data.ref, `refs/heads/${branch}`);
            assert.equal(data.object?.type, 'commit');
            return data.object.sha;
          }
          async function frozenRefs() {
            assert.equal(await ref('main'), MAIN, 'MAIN_DRIFT');
            assert.equal(await ref(SOURCE_BRANCH), SOURCE_HEAD, 'SOURCE_DRIFT');
            assert.equal(await ref(TEMP_BRANCH), process.env.GITHUB_SHA, 'TEMP_BRANCH_DRIFT');
          }

          const PATHS = ["apps/web/package-lock.json", "apps/web/package.json", "apps/web/scripts/lib/catalyst-rendered-projection.mjs", "apps/web/scripts/test-catalyst-rendered-projection.mjs", "apps/web/scripts/verify-catalyst-rendered-projection.mjs", "apps/web/scripts/verify-production-build.mjs", "docs/operations/catalyst-rendered-projection.md"];
          const NEW_SHA256 = {"apps/web/scripts/lib/catalyst-rendered-projection.mjs": "fc5ecbe59eb4be9dc4d168b30a72b60b5ac5d8ec2e1c51f76ac6411954f8f9b7", "apps/web/scripts/test-catalyst-rendered-projection.mjs": "b3141408afb625e2fdd01151c346b768dd436b9ba5012561cbdab5f08e3f38d9", "apps/web/scripts/verify-catalyst-rendered-projection.mjs": "53b9e47c6471ccf06d1685610bbc1111eec07f27b9151f2eb18ed01e26eaeda6", "docs/operations/catalyst-rendered-projection.md": "e1d9f7b92ac186f628f297cdd838eb4b63c43bdfaa34f6f5e4e0cb53d6919394"};
          const DEPENDENCY_BLOBS = {"apps/web/package.json": "ad748f0c247ff5023b155cdf33892d87696593f4", "apps/web/package-lock.json": "16055d8fcaa651a5dc59624649708cf3377e6a56"};

          let stage = 'bound-payload';
          async function main() {
            context();
            const encoded = process.env.TESTED_FILES;
            assert.ok(typeof encoded === 'string' && encoded.length > 0 && encoded.length < 120000, 'MISSING_TESTED_OUTPUT');
            const zipped = Buffer.from(encoded, 'base64');
            assert.equal(zipped.toString('base64'), encoded);
            assert.equal(sha256(zipped), process.env.FILES_DIGEST);
            const payload = JSON.parse(gunzipSync(zipped, { maxOutputLength: 1024 * 1024 }).toString('utf8'));
            assert.equal(payload.repository, REPOSITORY);
            assert.equal(payload.status, 'TESTED_SEVEN_FILE_SOURCE_NOT_RELEASED');
            assert.equal(payload.sourceHead, SOURCE_HEAD); assert.equal(payload.main, MAIN);
            assert.equal(payload.runId, process.env.GITHUB_RUN_ID); assert.equal(payload.runCommit, process.env.GITHUB_SHA);
            assert.equal(payload.publicationAuthorized, false); assert.equal(payload.branchWritten, false);
            assert.ok(Number.isInteger(payload.attemptSequence) && payload.attemptSequence >= 1 && payload.attemptSequence <= 3);
            assert.equal(payload.lifecycleTests, 165); assert.ok(Number.isSafeInteger(payload.parserTests) && payload.parserTests > 0);
            assert.equal(payload.auditVulnerabilities?.total, 0);
            assert.equal(payload.generated?.publicationAuthorized, false);
            assert.equal(payload.generated?.status, 'GENERATED_CATALYST_STRUCTURE_CHECKED_NOT_PUBLICATION_VERIFIED');
            assert.deepEqual(payload.files.map(f => f.path).sort(), PATHS);
            assert.equal(new Set(payload.files.map(f => f.path)).size, 7);
            const prepared = payload.files.map(item => {
              const bytes = Buffer.from(item.base64, 'base64');
              assert.ok(bytes.length > 0 && bytes.length <= 512000);
              assert.equal(bytes.toString('base64'), item.base64);
              assert.equal(bytes.length, item.bytes);
              assert.equal(gitBlob(bytes), item.gitBlob); assert.equal(sha256(bytes), item.sha256);
              if (Object.hasOwn(NEW_SHA256, item.path)) assert.equal(item.sha256, NEW_SHA256[item.path], 'UNREVIEWED_CANDIDATE');
              if (Object.hasOwn(DEPENDENCY_BLOBS, item.path)) assert.equal(item.gitBlob, DEPENDENCY_BLOBS[item.path], 'UNREVIEWED_DEPENDENCY');
              return item;
            });
            await frozenRefs();
            stage = 'upload-immutable-blobs-only';
            const token = process.env.BLOB_UPLOAD_TOKEN;
            assert.ok(token, 'MISSING_EPHEMERAL_TOKEN');
            const persisted = [];
            // Exactly seven POSTs to one fixed Git blob endpoint. No ref/tree/commit APIs.
            for (const item of prepared) {
              const response = await fetch(`https://api.github.com/repos/${REPOSITORY}/git/blobs`, {
                method: 'POST', redirect: 'error', signal: AbortSignal.timeout(15000),
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json',
                  'Content-Type': 'application/json', 'User-Agent': 'usd-impact-tested-blob-transfer' },
                body: JSON.stringify({ content: item.base64, encoding: 'base64' }),
              });
              assert.equal(response.status, 201, 'BLOB_UPLOAD_FAILED');
              const text = await response.text(); assert.ok(Buffer.byteLength(text) < 32768);
              const result = JSON.parse(text);
              assert.equal(result.sha, item.gitBlob, 'RETURNED_BLOB_MISMATCH');
              persisted.push({ path: item.path, gitBlob: item.gitBlob, sha256: item.sha256, bytes: item.bytes });
            }
            stage = 'final-reference-read';
            await frozenRefs();
            console.log('USDIMPACT_TESTED_BLOBS_BEGIN');
            console.log(JSON.stringify({ ...payload, files: persisted,
              status: 'TESTED_BLOBS_STORED_NO_BRANCH_WRITTEN', blobsStored: 7,
              sourceBranchUpdated: false, mainUpdated: false, publicationAuthorized: false }));
            console.log('USDIMPACT_TESTED_BLOBS_END');
          }
          main().catch(() => { console.error(`TESTED_BLOB_TRANSFER_STOPPED:${stage}; partial objects are not a branch update.`); process.exitCode = 1; });

          UPLOAD_NODE
