# Authorized continuation: pin the original approved scripts; require TAP explicitly.
# Attempt 2 of at most 3. No source changes, guard relaxation, or permission expansion.
name: Catalyst projection isolated implementation verification
on:
  push:
    branches: [preflight/catalyst-projection-implementation-20260917]
    paths: [.github/workflows/catalyst-projection-implementation-preflight.yml]
permissions: {}
jobs:
  verify:
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tested_files: ${{ steps.verify.outputs.tested_files }}
      files_digest: ${{ steps.verify.outputs.files_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Verify pinned original inputs with explicit TAP reporter
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'VERIFY_LOADER'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const digest = value => createHash('sha256').update(value).digest('hex');
          const ORIGINAL_HASH = 'bd61ac94974b4e9e604a0724d14232d7cf2a1621780d75dd8a0706feec099466';
          function extract(bytes, label, expectedHash) {
            assert.equal(bytes.length, 66985, 'ORIGINAL_WORKFLOW_SIZE');
            assert.equal(digest(bytes), ORIGINAL_HASH, 'ORIGINAL_WORKFLOW_HASH');
            const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            const marker = `          node --input-type=module <<'${label}'\n`;
            assert.equal(text.split(marker).length, 2, 'SCRIPT_START_COUNT');
            const tail = text.split(marker)[1];
            const end = `          ${label}`;
            assert.equal(tail.split(end).length, 2, 'SCRIPT_END_COUNT');
            const lines = tail.split(end)[0].split('\n');
            assert.ok(lines.every(line => line === '' || line.startsWith('          ')), 'SCRIPT_INDENT');
            const source = lines.map(line => line.slice(10)).join('\n').trimEnd() + '\n';
            assert.equal(digest(Buffer.from(source)), expectedHash, 'SCRIPT_HASH');
            return { text, source };
          }
          function execute(source, env, timeout) {
            const result = spawnSync(process.execPath, ['--input-type=module'], {
              input: source, encoding: 'utf8', env, shell: false, timeout,
              stdio: ['pipe', 'inherit', 'inherit'],
            });
            assert.ok(!result.error && !result.signal && result.status === 0, 'PINNED_SCRIPT_FAILED');
          }
          const original = spawnSync('git', ['show', '4fb6b54e5cea6f0f34c2889abf1a9abfc1e6e0a2:.github/workflows/catalyst-projection-implementation-preflight.yml'], {
            cwd: process.env.GITHUB_WORKSPACE, shell: false, timeout: 15000, maxBuffer: 100000,
          });
          assert.ok(!original.error && !original.signal && original.status === 0, 'ORIGINAL_GIT_READ_FAILED');
          let { text, source } = extract(original.stdout, 'VERIFY_NODE', '999a5e436f61d0c7a35343b456c7771c0545d4a34854118a1a849ff2733f67fd');
          const before = "['--test', 'scripts/test-";
          assert.equal(source.split(before).length, 3, 'REPORTER_INVOCATION_COUNT');
          source = source.replaceAll(before, "['--test', '--test-reporter=tap', 'scripts/test-");
          assert.equal(digest(Buffer.from(source)), 'f87755006e6f51ba993a2d30f14c5abc3ffda2123dcd28e142674d8b20e46a00', 'CORRECTED_SCRIPT_HASH');
          const env = { ...process.env };
          for (let i = 0; i < 3; ++i) {
            const prefix = `          INPUT_PART_${i}: `;
            const lines = text.split('\n').filter(line => line.startsWith(prefix));
            assert.equal(lines.length, 1, 'INPUT_PART_COUNT');
            const value = JSON.parse(lines[0].slice(prefix.length));
            assert.equal(typeof value, 'string');
            assert.match(value, /^[A-Za-z0-9+/=]+$/);
            assert.ok(value.length <= 16000);
            env[`INPUT_PART_${i}`] = value;
          }
          execute(source, env, 780000);
          VERIFY_LOADER
  preserve-tested-blobs:
    needs: verify
    if: needs.verify.result == 'success' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Execute unchanged hash-pinned seven-blob uploader without project checkout
        env:
          TESTED_FILES: ${{ needs.verify.outputs.tested_files }}
          FILES_DIGEST: ${{ needs.verify.outputs.files_digest }}
          BLOB_UPLOAD_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'UPLOAD_LOADER'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          const digest = value => createHash('sha256').update(value).digest('hex');
          const ORIGINAL_HASH = 'bd61ac94974b4e9e604a0724d14232d7cf2a1621780d75dd8a0706feec099466';
          function extract(bytes, label, expectedHash) {
            assert.equal(bytes.length, 66985, 'ORIGINAL_WORKFLOW_SIZE');
            assert.equal(digest(bytes), ORIGINAL_HASH, 'ORIGINAL_WORKFLOW_HASH');
            const text = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
            const marker = `          node --input-type=module <<'${label}'\n`;
            assert.equal(text.split(marker).length, 2, 'SCRIPT_START_COUNT');
            const tail = text.split(marker)[1];
            const end = `          ${label}`;
            assert.equal(tail.split(end).length, 2, 'SCRIPT_END_COUNT');
            const lines = tail.split(end)[0].split('\n');
            assert.ok(lines.every(line => line === '' || line.startsWith('          ')), 'SCRIPT_INDENT');
            const source = lines.map(line => line.slice(10)).join('\n').trimEnd() + '\n';
            assert.equal(digest(Buffer.from(source)), expectedHash, 'SCRIPT_HASH');
            return { text, source };
          }
          function execute(source, env, timeout) {
            const result = spawnSync(process.execPath, ['--input-type=module'], {
              input: source, encoding: 'utf8', env, shell: false, timeout,
              stdio: ['pipe', 'inherit', 'inherit'],
            });
            assert.ok(!result.error && !result.signal && result.status === 0, 'PINNED_SCRIPT_FAILED');
          }
          const response = await fetch('https://api.github.com/repos/usdimpact/usd-impact-site/git/blobs/62b2d709de00f4409dd837a210c1b4c7f052fc4e', {
            method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
            headers: { Accept: 'application/vnd.github+json', 'User-Agent': 'usd-impact-pinned-workflow-reader' },
          });
          assert.equal(response.status, 200, 'ORIGINAL_BLOB_READ_FAILED');
          const raw = await response.text();
          assert.ok(Buffer.byteLength(raw) < 150000, 'ORIGINAL_BLOB_RESPONSE_SIZE');
          const data = JSON.parse(raw);
          assert.equal(data.sha, '62b2d709de00f4409dd837a210c1b4c7f052fc4e');
          assert.equal(data.encoding, 'base64');
          assert.equal(data.size, 66985);
          const bytes = Buffer.from(data.content, 'base64');
          const { source } = extract(bytes, 'UPLOAD_NODE', '8dd1f4c5410e66debfd0792bb49709e6a53ca0975f06487efbda10265e781f13');
          execute(source, process.env, 140000);
          UPLOAD_LOADER
