name: Daily Card content queue

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-queue:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate canonical cards and inventory plan
        run: |
          node scripts/validate-daily-cards.mjs
          node scripts/test-daily-card-inventory-plan.mjs
          node scripts/test-daily-card-glossary-resolutions.mjs

      - name: Generate inventory coverage
        run: node scripts/generate-daily-card-inventory-report.mjs

      - name: Generate review candidates from video inventory
        run: node scripts/generate-daily-card-candidates.mjs

      - name: Generate glossary review and resolution artifacts
        run: node scripts/generate-daily-card-glossary-candidates.mjs

      - name: Generate Book lesson review candidates
        run: node scripts/generate-daily-card-book-candidates.mjs

      - name: Rank Book lesson shortlist
        run: node scripts/rank-daily-card-book-candidates.mjs

      - name: Generate Framework review candidates
        run: node scripts/generate-daily-card-framework-candidates.mjs

      - name: Generate Quiz review candidates
        run: node scripts/generate-daily-card-quiz-candidates.mjs

      - name: Rank Framework and Quiz deficit shortlist
        run: node scripts/rank-daily-card-framework-quiz-candidates.mjs

      - name: Generate Funding Stack decomposition review queue
        run: node scripts/generate-daily-card-funding-decomposition-candidates.mjs

      - name: Upload review queue
        uses: actions/upload-artifact@v4
        with:
          name: daily-card-review-queue
          path: |
            apps/web/artifacts/daily-card-candidates/candidates.json
            apps/web/artifacts/daily-card-glossary-candidates/candidates.json
            apps/web/artifacts/daily-card-glossary-candidates/resolved.json
            apps/web/artifacts/daily-card-glossary-candidates/review.md
            apps/web/artifacts/daily-card-book-candidates/candidates.json
            apps/web/artifacts/daily-card-book-candidates/review.md
            apps/web/artifacts/daily-card-book-shortlist/shortlist.json
            apps/web/artifacts/daily-card-book-shortlist/shortlist.md
            apps/web/artifacts/daily-card-framework-candidates/candidates.json
            apps/web/artifacts/daily-card-framework-candidates/review.md
            apps/web/artifacts/daily-card-quiz-candidates/candidates.json
            apps/web/artifacts/daily-card-quiz-candidates/review.md
            apps/web/artifacts/daily-card-framework-quiz-shortlist/shortlist.json
            apps/web/artifacts/daily-card-framework-quiz-shortlist/shortlist.md
            apps/web/artifacts/daily-card-funding-decomposition/candidates.json
            apps/web/artifacts/daily-card-funding-decomposition/resolved.json
            apps/web/artifacts/daily-card-funding-decomposition/review.md
            apps/web/artifacts/daily-card-inventory/coverage.json
            apps/web/artifacts/daily-card-inventory/coverage.md
          if-no-files-found: error
          retention-days: 30
