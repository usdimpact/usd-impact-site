name: Daily Card History manuscript contract

on:
  pull_request:
    paths:
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/src/data/daily-card-history-manuscript-candidates.js'
      - 'apps/web/scripts/generate-daily-card-history-manuscript-candidates.mjs'
      - '.github/workflows/daily-card-history-manuscript-contract.yml'
      - '.github/workflows/daily-card-content-queue.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/src/data/daily-card-history-manuscript-candidates.js'
      - 'apps/web/scripts/generate-daily-card-history-manuscript-candidates.mjs'
      - '.github/workflows/daily-card-history-manuscript-contract.yml'
      - '.github/workflows/daily-card-content-queue.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/data/daily-card-history-manuscript-candidates.js
          node --check scripts/generate-daily-card-history-manuscript-candidates.mjs
      - name: Generate History manuscript review queue
        run: node scripts/generate-daily-card-history-manuscript-candidates.mjs
      - name: Verify History manuscript contract
        run: |
          test -s artifacts/daily-card-history-manuscript/candidates.json
          test -s artifacts/daily-card-history-manuscript/review.md
          node --input-type=module -e "import fs from 'node:fs'; import { dailyCards } from './src/data/daily-card-catalog.js'; const p=JSON.parse(fs.readFileSync('artifacts/daily-card-history-manuscript/candidates.json','utf8')); if(p.sourceHierarchyRank!==3 || p.sourceType!=='certified-book-manuscript' || p.targetCollectionId!=='history-institutions' || p.targetCount!==10 || p.currentCanonicalCount!==3 || p.candidateCount!==7 || p.candidates.length!==7) process.exit(1); if(p.source.driveFileId!=='1vpdg9zMAl86mya1BVJKHYy5_kZ9VNmdi' || !p.source.driveTitle.includes('Session15A_Certified') || !p.source.chapter.includes('Bretton Woods to Fiat Discipline')) process.exit(1); const history=dailyCards.filter(c=>c.collectionId==='history-institutions'&&c.status==='ready-for-build'); if(history.length!==3) process.exit(1); const ids=new Set(), titles=new Set(); for(const c of p.candidates){if(c.status!=='review'||c.lastReviewed!==null||c.reviewDisposition!=='primary-source-verification-required'||c.suggestedCollectionId!=='history-institutions'||c.suggestedAccess!=='open'||c.sourceHierarchyRank!==3||c.sourceType!=='certified-book-manuscript'||c.sourceDriveFileId!==p.source.driveFileId||!c.sourceSection||!c.sourceSummary||c.sourceSummary.length<40) process.exit(1); if(ids.has(c.id)) process.exit(1); ids.add(c.id); const t=c.title.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); if(titles.has(t)) process.exit(1); titles.add(t);}"
