name: Daily Card inventory contract

on:
  pull_request:
    paths:
      - 'apps/web/src/content/glossary/**'
      - 'apps/web/src/content/pages/**'
      - 'apps/web/src/data/daily-card-inventory-plan.js'
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/src/data/daily-card-video-batch-*.js'
      - 'apps/web/src/data/daily-card-glossary-batch-*.js'
      - 'apps/web/src/data/daily-card-book-batch-*.js'
      - 'apps/web/src/data/daily-card-rates-primary-batch-*.js'
      - 'apps/web/src/data/daily-card-core-primary-batch-*.js'
      - 'apps/web/src/data/daily-card-glossary-resolutions.js'
      - 'apps/web/src/data/daily-cards.js'
      - 'apps/web/src/data/video-library.js'
      - 'apps/web/scripts/generate-daily-card-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-glossary-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-book-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-inventory-report.mjs'
      - 'apps/web/scripts/test-daily-card-inventory-plan.mjs'
      - 'apps/web/scripts/test-daily-card-video-batches.mjs'
      - 'apps/web/scripts/test-daily-card-glossary-batches.mjs'
      - 'apps/web/scripts/test-daily-card-book-batches.mjs'
      - 'apps/web/scripts/test-daily-card-rates-primary-batches.mjs'
      - 'apps/web/scripts/test-daily-card-core-primary-batches.mjs'
      - 'apps/web/scripts/test-daily-card-glossary-resolutions.mjs'
      - 'apps/web/scripts/validate-daily-cards.mjs'
      - '.github/workflows/daily-card-content-queue.yml'
      - '.github/workflows/daily-card-inventory-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/content/glossary/**'
      - 'apps/web/src/content/pages/**'
      - 'apps/web/src/data/daily-card-inventory-plan.js'
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/src/data/daily-card-video-batch-*.js'
      - 'apps/web/src/data/daily-card-glossary-batch-*.js'
      - 'apps/web/src/data/daily-card-book-batch-*.js'
      - 'apps/web/src/data/daily-card-rates-primary-batch-*.js'
      - 'apps/web/src/data/daily-card-core-primary-batch-*.js'
      - 'apps/web/src/data/daily-card-glossary-resolutions.js'
      - 'apps/web/src/data/daily-cards.js'
      - 'apps/web/src/data/video-library.js'
      - 'apps/web/scripts/generate-daily-card-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-glossary-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-book-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-inventory-report.mjs'
      - 'apps/web/scripts/test-daily-card-inventory-plan.mjs'
      - 'apps/web/scripts/test-daily-card-video-batches.mjs'
      - 'apps/web/scripts/test-daily-card-glossary-batches.mjs'
      - 'apps/web/scripts/test-daily-card-book-batches.mjs'
      - 'apps/web/scripts/test-daily-card-rates-primary-batches.mjs'
      - 'apps/web/scripts/test-daily-card-core-primary-batches.mjs'
      - 'apps/web/scripts/test-daily-card-glossary-resolutions.mjs'
      - 'apps/web/scripts/validate-daily-cards.mjs'
      - '.github/workflows/daily-card-content-queue.yml'
      - '.github/workflows/daily-card-inventory-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/data/daily-card-inventory-plan.js
          node --check src/data/daily-card-catalog.js
          node --check src/data/daily-card-video-batch-01.js
          node --check src/data/daily-card-video-batch-02.js
          node --check src/data/daily-card-video-batch-03.js
          node --check src/data/daily-card-video-batch-04.js
          node --check src/data/daily-card-glossary-batch-01.js
          node --check src/data/daily-card-book-batch-01.js
          node --check src/data/daily-card-book-batch-02.js
          node --check src/data/daily-card-book-batch-03.js
          node --check src/data/daily-card-rates-primary-batch-01.js
          node --check src/data/daily-card-core-primary-batch-01.js
          node --check src/data/daily-card-glossary-resolutions.js
          node --check scripts/generate-daily-card-inventory-report.mjs
          node --check scripts/generate-daily-card-glossary-candidates.mjs
          node --check scripts/generate-daily-card-book-candidates.mjs
          node --check scripts/test-daily-card-inventory-plan.mjs
          node --check scripts/test-daily-card-video-batches.mjs
          node --check scripts/test-daily-card-glossary-batches.mjs
          node --check scripts/test-daily-card-book-batches.mjs
          node --check scripts/test-daily-card-rates-primary-batches.mjs
          node --check scripts/test-daily-card-core-primary-batches.mjs
          node --check scripts/test-daily-card-glossary-resolutions.mjs
      - name: Validate canonical inventory
        run: |
          node scripts/test-daily-card-video-batches.mjs
          node scripts/test-daily-card-glossary-batches.mjs
          node scripts/test-daily-card-book-batches.mjs
          node scripts/test-daily-card-rates-primary-batches.mjs
          node scripts/test-daily-card-core-primary-batches.mjs
          node scripts/test-daily-card-glossary-resolutions.mjs
          node scripts/test-daily-card-inventory-plan.mjs
          node scripts/validate-daily-cards.mjs
      - name: Generate coverage and review queues
        run: |
          node scripts/generate-daily-card-inventory-report.mjs
          node scripts/generate-daily-card-candidates.mjs
          node scripts/generate-daily-card-glossary-candidates.mjs
          node scripts/generate-daily-card-book-candidates.mjs
      - name: Verify artifacts
        run: |
          test -s artifacts/daily-card-inventory/coverage.json
          test -s artifacts/daily-card-inventory/coverage.md
          test -s artifacts/daily-card-candidates/candidates.json
          test -s artifacts/daily-card-glossary-candidates/candidates.json
          test -s artifacts/daily-card-glossary-candidates/resolved.json
          test -s artifacts/daily-card-glossary-candidates/review.md
          test -s artifacts/daily-card-book-candidates/candidates.json
          test -s artifacts/daily-card-book-candidates/review.md
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/daily-card-candidates/candidates.json','utf8')); if(!p.candidates.every(c=>c.status==='review' && c.lastReviewed===null)) process.exit(1);"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/daily-card-glossary-candidates/candidates.json','utf8')); if(p.count!==0 || p.likelyNetNewCount!==0 || p.overlapCount!==0 || p.promotedSourceCount!==9 || p.resolvedSourceCount!==9) process.exit(1);"
          node --input-type=module -e "import fs from 'node:fs'; import { dailyCards } from './src/data/daily-card-catalog.js'; import { dailyCardGlossaryResolutions } from './src/data/daily-card-glossary-resolutions.js'; const p=JSON.parse(fs.readFileSync('artifacts/daily-card-glossary-candidates/candidates.json','utf8')); const promoted=new Set(dailyCards.filter(c=>c.status==='ready-for-build' && typeof c.sourcePath==='string' && c.sourcePath.startsWith('src/content/glossary/')).map(c=>c.sourcePath)); const resolved=new Set(dailyCardGlossaryResolutions.map(r=>r.sourcePath)); if(p.promotedSourceCount!==promoted.size || p.resolvedSourceCount!==resolved.size || p.candidates.some(c=>promoted.has(c.sourcePath)||resolved.has(c.sourcePath))) process.exit(1);"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/daily-card-glossary-candidates/resolved.json','utf8')); if(p.count!==9 || !p.resolutions.every(r=>r.primaryCard && r.relatedCards.every(c=>c.title && c.access))) process.exit(1);"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/daily-card-book-candidates/candidates.json','utf8')); if(p.sourceHierarchyRank!==3 || p.promotedSectionCount!==30 || p.lessonCount<1 || p.candidateCount<1 || p.likelyNetNewCount+p.overlapCount!==p.candidateCount || !p.candidates.every(c=>c.status==='review' && c.lastReviewed===null && c.sourceHierarchyRank===3 && c.sourceType==='published-book-lesson' && c.sourceStatus==='published' && c.sourcePath.startsWith('src/content/pages/') && c.sourceExcerpt && ['likely-net-new','resolve-overlap'].includes(c.reviewDisposition))) process.exit(1);"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/daily-card-book-candidates/candidates.json','utf8')); const ids=p.candidates.map(c=>c.id); if(new Set(ids).size!==ids.length || p.lessons.some(l=>l.candidateCount<1 || !l.sourcePath.startsWith('src/content/pages/'))) process.exit(1);"
          node --input-type=module -e "import fs from 'node:fs'; import { dailyCards } from './src/data/daily-card-catalog.js'; const p=JSON.parse(fs.readFileSync('artifacts/daily-card-book-candidates/candidates.json','utf8')); const promoted=new Set(dailyCards.filter(c=>c.status==='ready-for-build' && typeof c.sourcePath==='string' && c.sourcePath.startsWith('src/content/pages/') && typeof c.sourceHeading==='string').map(c=>c.sourcePath+'::'+c.sourceHeading)); if(promoted.size!==30 || p.promotedSectionCount!==promoted.size || p.candidates.some(c=>promoted.has(c.sourcePath+'::'+c.title))) process.exit(1);"
