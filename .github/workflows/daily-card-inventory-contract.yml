name: Daily Card inventory contract

on:
  pull_request:
    paths:
      - 'apps/web/src/content/glossary/**'
      - 'apps/web/src/data/daily-card-inventory-plan.js'
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/src/data/daily-card-video-batch-*.js'
      - 'apps/web/src/data/daily-card-glossary-batch-*.js'
      - 'apps/web/src/data/daily-cards.js'
      - 'apps/web/src/data/video-library.js'
      - 'apps/web/scripts/generate-daily-card-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-glossary-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-inventory-report.mjs'
      - 'apps/web/scripts/test-daily-card-inventory-plan.mjs'
      - 'apps/web/scripts/test-daily-card-video-batches.mjs'
      - 'apps/web/scripts/test-daily-card-glossary-batches.mjs'
      - 'apps/web/scripts/validate-daily-cards.mjs'
      - '.github/workflows/daily-card-content-queue.yml'
      - '.github/workflows/daily-card-inventory-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/content/glossary/**'
      - 'apps/web/src/data/daily-card-inventory-plan.js'
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/src/data/daily-card-video-batch-*.js'
      - 'apps/web/src/data/daily-card-glossary-batch-*.js'
      - 'apps/web/src/data/daily-cards.js'
      - 'apps/web/src/data/video-library.js'
      - 'apps/web/scripts/generate-daily-card-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-glossary-candidates.mjs'
      - 'apps/web/scripts/generate-daily-card-inventory-report.mjs'
      - 'apps/web/scripts/test-daily-card-inventory-plan.mjs'
      - 'apps/web/scripts/test-daily-card-video-batches.mjs'
      - 'apps/web/scripts/test-daily-card-glossary-batches.mjs'
      - 'apps/web/scripts/validate-daily-cards.mjs'
      - '.github/workflows/daily-card-content-queue.yml'
      - '.github/workflows/daily-card-inventory-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Syntax
        run: |
          node --check src/data/daily-card-inventory-plan.js
          node --check src/data/daily-card-catalog.js
          node --check src/data/daily-card-video-batch-01.js
          node --check src/data/daily-card-video-batch-02.js
          node --check src/data/daily-card-video-batch-03.js
          node --check src/data/daily-card-video-batch-04.js
          node --check src/data/daily-card-glossary-batch-01.js
          node --check scripts/generate-daily-card-inventory-report.mjs
          node --check scripts/generate-daily-card-glossary-candidates.mjs
          node --check scripts/test-daily-card-inventory-plan.mjs
          node --check scripts/test-daily-card-video-batches.mjs
          node --check scripts/test-daily-card-glossary-batches.mjs
      - name: Validate canonical inventory
        run: |
          node scripts/test-daily-card-video-batches.mjs
          node scripts/test-daily-card-glossary-batches.mjs
          node scripts/test-daily-card-inventory-plan.mjs
          node scripts/validate-daily-cards.mjs
      - name: Generate coverage and review queues
        run: |
          node scripts/generate-daily-card-inventory-report.mjs
          node scripts/generate-daily-card-candidates.mjs
          node scripts/generate-daily-card-glossary-candidates.mjs
      - name: Verify artifacts
        run: |
          test -s artifacts/daily-card-inventory/coverage.json
          test -s artifacts/daily-card-inventory/coverage.md
          test -s artifacts/daily-card-candidates/candidates.json
          test -s artifacts/daily-card-glossary-candidates/candidates.json
          test -s artifacts/daily-card-glossary-candidates/review.md
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/daily-card-candidates/candidates.json','utf8')); if(!p.candidates.every(c=>c.status==='review' && c.lastReviewed===null)) process.exit(1);"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('artifacts/daily-card-glossary-candidates/candidates.json','utf8')); if(p.likelyNetNewCount + p.overlapCount !== p.count || !p.candidates.every(c=>c.status==='review' && c.lastReviewed===null && ['likely-net-new','resolve-overlap'].includes(c.reviewDisposition) && c.sourceNames.includes('USD Impact Glossary') && c.sourcePath.startsWith('src/content/glossary/'))) process.exit(1);"
          node --input-type=module -e "import fs from 'node:fs'; import { dailyCards } from './src/data/daily-card-catalog.js'; const p=JSON.parse(fs.readFileSync('artifacts/daily-card-glossary-candidates/candidates.json','utf8')); const promoted=new Set(dailyCards.filter(c=>c.status==='ready-for-build' && typeof c.sourcePath==='string' && c.sourcePath.startsWith('src/content/glossary/')).map(c=>c.sourcePath)); if(p.promotedSourceCount!==promoted.size || p.candidates.some(c=>promoted.has(c.sourcePath))) process.exit(1);"
