name: Daily Card Market Application contract

on:
  pull_request:
    paths:
      - 'apps/web/src/data/daily-card-market-application-batch-*.js'
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/scripts/test-daily-card-market-application-batches.mjs'
      - '.github/workflows/daily-card-market-application-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/data/daily-card-market-application-batch-*.js'
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/scripts/test-daily-card-market-application-batches.mjs'
      - '.github/workflows/daily-card-market-application-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Syntax check Market Application batch
        run: |
          node --check src/data/daily-card-market-application-batch-01.js
          node --check scripts/test-daily-card-market-application-batches.mjs
      - name: Verify Market Application Batch 01
        run: node scripts/test-daily-card-market-application-batches.mjs
      - name: Validate canonical Daily Cards
        run: node scripts/validate-daily-cards.mjs
