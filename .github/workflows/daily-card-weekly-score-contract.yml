name: Daily Card Weekly Score contract

on:
  pull_request:
    paths:
      - 'apps/web/src/content/weekly-reports/**'
      - 'apps/web/src/pages/score.astro'
      - 'apps/web/src/data/daily-card-catalog.js'
      - 'apps/web/src/data/daily-card-inventory-plan.js'
      - 'apps/web/src/data/daily-card-weekly-score-batch-01.js'
      - 'apps/web/src/data/daily-card-weekly-score-resolutions.js'
      - 'apps/web/scripts/generate-daily-card-weekly-score-candidates.mjs'
      - 'apps/web/scripts/test-daily-card-weekly-score-candidates.mjs'
      - '.github/workflows/daily-card-content-queue.yml'
      - '.github/workflows/daily-card-weekly-score-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax check Weekly Score editorial tooling
        run: |
          node --check src/data/daily-card-weekly-score-batch-01.js
          node --check src/data/daily-card-weekly-score-resolutions.js
          node --check scripts/generate-daily-card-weekly-score-candidates.mjs
          node --check scripts/test-daily-card-weekly-score-candidates.mjs

      - name: Verify Weekly Score editorial contract
        run: node scripts/test-daily-card-weekly-score-candidates.mjs

      - name: Validate canonical Daily Cards
        run: node scripts/validate-daily-cards.mjs
