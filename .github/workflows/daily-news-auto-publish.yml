name: Daily USD Impact bounded auto-publication

on:
  workflow_run:
    workflows: ["Daily USD Impact publication"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Original completed Daily generator run ID (hint only; independently verified)'
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: daily-usd-impact-auto-publication
  cancel-in-progress: false

jobs:
  publish-verified-daily:
    if: ${{ vars.DAILY_NEWS_AUTO_PUBLISH_DISABLED != 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # This privileged workflow only checks out trusted default-branch code.
      # It never executes or imports code from the untrusted Daily PR branch.
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use reviewed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.x'
      - name: Check exact source workflow, PR, source and required checks; publish only before US data cutover
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/web/scripts/daily-news-auto-publish.mjs
