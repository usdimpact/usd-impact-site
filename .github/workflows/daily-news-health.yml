name: Daily USD Impact Health

on:
  schedule:
    # Run after the primary and both bounded backstop observation windows.
    - cron: '45 18 * * 1-5'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: daily-usd-impact-health
  cancel-in-progress: false

jobs:
  verify-daily-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inspect latest daily workflow run
        id: health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: daily-news.yml
          MAX_AGE_HOURS: '12'
          MAX_ACTIVE_MINUTES: '130'
        run: |
          set -euo pipefail

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$WORKFLOW_NAME" \
            --branch main \
            --limit 1 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,event)"

          if [ "$(jq length <<< "$run_json")" -ne 1 ]; then
            echo "No recent Daily USD Impact workflow run was found." > daily-health-report.md
            exit 1
          fi

          run_id="$(jq -r '.[0].databaseId' <<< "$run_json")"
          status="$(jq -r '.[0].status' <<< "$run_json")"
          conclusion="$(jq -r '.[0].conclusion // "unknown"' <<< "$run_json")"
          created_at="$(jq -r '.[0].createdAt' <<< "$run_json")"
          updated_at="$(jq -r '.[0].updatedAt // .[0].createdAt' <<< "$run_json")"
          run_url="$(jq -r '.[0].url' <<< "$run_json")"
          event="$(jq -r '.[0].event' <<< "$run_json")"
          expected_date="${created_at:0:10}"

          now_epoch="$(date -u +%s)"
          created_epoch="$(date -u -d "$created_at" +%s)"
          updated_epoch="$(date -u -d "$updated_at" +%s)"
          active_age_seconds="$((now_epoch - created_epoch))"
          age_seconds="$((now_epoch - updated_epoch))"
          max_age_seconds="$((MAX_AGE_HOURS * 3600))"
          max_active_seconds="$((MAX_ACTIVE_MINUTES * 60))"
          operational_conclusion="$conclusion"
          failure_stage='none'

          {
            echo "# Daily USD Impact automation health report"
            echo
            echo "- Workflow run: $run_url"
            echo "- Run ID: \`$run_id\`"
            echo "- Trigger: \`$event\`"
            echo "- Status: \`$status\`"
            echo "- Raw conclusion: \`$conclusion\`"
            echo "- Started: \`$created_at\`"
            echo "- Last updated: \`$updated_at\`"
            echo "- Recovery age: $((age_seconds / 60)) minutes"
          } > daily-health-report.md

          if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            failed_step="$(jq -r '[.jobs[].steps[]? | select(.conclusion == "failure")][0].name // ""' <<< "$jobs_json")"
            case "$failed_step" in
              'Start background news generation') failure_stage='generation' ;;
              'Poll background news generation') failure_stage='generation-or-repair' ;;
              'Import as published content') failure_stage='import' ;;
              'Validate and build') failure_stage='validation' ;;
              'Open and validate publication pull request') failure_stage='publication' ;;
              'Report Daily failure gate') failure_stage='failure-reporting' ;;
              *) failure_stage='workflow' ;;
            esac
            {
              echo "<!-- usd-impact-daily-failure-stage: $failure_stage -->"
              echo "- Failure stage: \`$failure_stage\`"
              echo "- Failed step: \`${failed_step:-unknown}\`"
            } >> daily-health-report.md
          fi

          if [ "$status" != "completed" ]; then
            if [ "$active_age_seconds" -ge 0 ] && [ "$active_age_seconds" -le "$max_active_seconds" ]; then
              echo "- Operational conclusion: generation_pending" >> daily-health-report.md
              echo "- Result: the latest run is active within its ${MAX_ACTIVE_MINUTES}-minute execution allowance." >> daily-health-report.md
              echo "state=pending" >> "$GITHUB_OUTPUT"
              cat daily-health-report.md
              exit 0
            fi
            echo "- Failure: the latest run has remained active beyond ${MAX_ACTIVE_MINUTES} minutes." >> daily-health-report.md
            exit 1
          fi

          # A generation/import/validation/workflow failure remains fatal. The only recoverable
          # raw failure is the publication stage, and only when the exact scheduled edition later
          # completed the reviewed PR path into main without changing its single Daily content file.
          if [ "$conclusion" != "success" ] && [ "$failure_stage" = "publication" ]; then
            expected_title="Publish Daily USD Impact — $expected_date"
            expected_file="apps/web/src/content/news/$expected_date.md"
            expected_head_prefix="automation/daily-usd-impact-$expected_date-"
            pulls_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")"
            recovery_json="$(jq -c --arg title "$expected_title" --arg prefix "$expected_head_prefix" '
              [.[] | select(
                .merged_at != null
                and .title == $title
                and (.head.ref | startswith($prefix))
              )][0] // empty
            ' <<< "$pulls_json")"

            if [ -n "$recovery_json" ]; then
              recovery_number="$(jq -r '.number' <<< "$recovery_json")"
              recovery_url="$(jq -r '.html_url' <<< "$recovery_json")"
              recovery_merged_at="$(jq -r '.merged_at' <<< "$recovery_json")"
              recovery_merge_sha="$(jq -r '.merge_commit_sha // ""' <<< "$recovery_json")"
              recovery_merged_epoch="$(date -u -d "$recovery_merged_at" +%s)"
              recovery_files_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$recovery_number/files?per_page=100")"
              recovery_file_count="$(jq length <<< "$recovery_files_json")"
              recovery_file="$(jq -r '.[0].filename // ""' <<< "$recovery_files_json")"

              if [ "$recovery_merged_epoch" -gt "$updated_epoch" ] \
                && [ "$recovery_file_count" -eq 1 ] \
                && [ "$recovery_file" = "$expected_file" ]; then
                operational_conclusion='recovered_after_review'
                {
                  echo "- Operational conclusion: \`recovered_after_review\`"
                  echo "- Reviewed recovery PR: [#$recovery_number]($recovery_url)"
                  echo "- Recovery merged: \`$recovery_merged_at\`"
                  echo "- Recovery merge SHA: \`$recovery_merge_sha\`"
                  echo "- Recovery file: \`$recovery_file\`"
                } >> daily-health-report.md
              fi
            fi
          fi

          if [ "$operational_conclusion" != "success" ] \
            && [ "$operational_conclusion" != "recovered_after_review" ]; then
            echo "- Failure: the latest run did not succeed and no bounded reviewed publication recovery was proven." >> daily-health-report.md
            exit 1
          fi

          if [ "$age_seconds" -lt 0 ] || [ "$age_seconds" -gt "$max_age_seconds" ]; then
            echo "- Failure: the latest run is older than ${MAX_AGE_HOURS} hours." >> daily-health-report.md
            exit 1
          fi

          expected_title="Publish Daily USD Impact — $expected_date"
          expected_file="apps/web/src/content/news/$expected_date.md"
          expected_head_prefix="automation/daily-usd-impact-$expected_date-"
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/$expected_file?ref=main" >/dev/null 2>&1; then
            editorial_pr="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --limit 100 \
              --json number,title,headRefName,url \
              --jq ".[] | select(.title == \"$expected_title\" and (.headRefName | startswith(\"$expected_head_prefix\"))) | [.number, .url] | @tsv" \
              | head -n 1)"
            if [ -n "$editorial_pr" ]; then
              echo "- Operational conclusion: awaiting_editorial_review" >> daily-health-report.md
              echo "- Publication PR: $(printf '%s' "$editorial_pr" | cut -f2)" >> daily-health-report.md
              echo "- Result: generation and publication handoff succeeded; protected editorial review is pending." >> daily-health-report.md
              echo "state=pending" >> "$GITHUB_OUTPUT"
              cat daily-health-report.md
              exit 0
            fi
            echo "- Failure: the workflow succeeded but neither the expected main file nor an open exact publication PR exists." >> daily-health-report.md
            exit 1
          fi

          node apps/web/scripts/check-daily-news-deployment-health.mjs \
            --expected-date "$expected_date" \
            --base-url "https://www.usd-impact.com" \
            --report daily-health-report.md

          echo "- Result: healthy." >> daily-health-report.md
          echo "state=healthy" >> "$GITHUB_OUTPUT"
          cat daily-health-report.md

      - name: Open or update daily health issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: P1 — Daily USD Impact automation requires attention
        run: |
          set -euo pipefail

          if [ ! -s daily-health-report.md ]; then
            echo "# Daily USD Impact automation health report" > daily-health-report.md
            echo >> daily-health-report.md
            echo "<!-- usd-impact-daily-failure-stage: workflow -->" >> daily-health-report.md
            echo "- Failure stage: \`workflow\`" >> daily-health-report.md
            echo "The health check failed before a detailed report could be generated." >> daily-health-report.md
          fi

          if gh issue view 184 --json state --jq '.state' 2>/dev/null | grep -q '^OPEN$'; then
            gh issue comment 184 \
              --repo "$GITHUB_REPOSITORY" \
              --body-file daily-health-report.md
            echo "Updated hardening issue #184"
            exit 0
          fi

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ISSUE_TITLE" \
            --json number,title \
            --jq ".[] | select(.title == env.ISSUE_TITLE) | .number" \
            | head -n 1)"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file daily-health-report.md
            echo "Refreshed issue #$issue_number"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file daily-health-report.md
          fi

      - name: Close recovered daily health issue
        if: steps.health.outcome == 'success' && steps.health.outputs.state == 'healthy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: P1 — Daily USD Impact automation requires attention
        run: |
          set -euo pipefail

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ISSUE_TITLE" \
            --json number,title \
            --jq ".[] | select(.title == env.ISSUE_TITLE) | .number" \
            | head -n 1)"

          if [ -n "$issue_number" ]; then
            {
              echo "## Recovery confirmed"
              echo
              cat daily-health-report.md
            } > daily-health-recovery.md
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file daily-health-recovery.md
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
            echo "Closed recovered issue #$issue_number"
          else
            echo "No open daily health issue to close"
          fi

      - name: Fail when daily health checks fail
        if: steps.health.outcome == 'failure'
        run: |
          echo "Daily USD Impact health checks failed. Review the generated issue and report."
          exit 1
