name: Daily USD Impact Health

on:
  schedule:
    # Run after the primary and both bounded backstop observation windows.
    - cron: '45 18 * * 1-5'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: daily-usd-impact-health
  cancel-in-progress: false

jobs:
  verify-daily-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Inspect latest daily workflow run
        id: health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_NAME: daily-news.yml
          HEALTH_WORKFLOW_EVENT: ${{ github.event_name }}
          MAX_AGE_HOURS: '12'
          MAX_ACTIVE_MINUTES: '130'
        run: |
          set -euo pipefail

          # Evaluate both the latest fallback/manual run and the latest native
          # scheduled run. A later successful workflow_dispatch (often a
          # deliberate publication no-op) must not conceal a genuine schedule.
          # Conversely, a newer failed or still-active fallback must never
          # allow the scheduled generator to receive a false HEALTHY verdict.
          latest_run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$WORKFLOW_NAME" \
            --branch main \
            --limit 1 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,event)"

          run_json="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$WORKFLOW_NAME" \
            --branch main \
            --event schedule \
            --limit 1 \
            --json databaseId,status,conclusion,createdAt,updatedAt,url,event)"

          if [ "$(jq length <<< "$run_json")" -ne 1 ]; then
            echo "No native scheduled Daily USD Impact workflow run was found." > daily-health-report.md
            exit 1
          fi

          run_id="$(jq -r '.[0].databaseId' <<< "$run_json")"
          status="$(jq -r '.[0].status' <<< "$run_json")"
          conclusion="$(jq -r '.[0].conclusion // "unknown"' <<< "$run_json")"
          created_at="$(jq -r '.[0].createdAt' <<< "$run_json")"
          updated_at="$(jq -r '.[0].updatedAt // .[0].createdAt' <<< "$run_json")"
          run_url="$(jq -r '.[0].url' <<< "$run_json")"
          event="$(jq -r '.[0].event' <<< "$run_json")"
          expected_date="${created_at:0:10}"

          now_epoch="$(date -u +%s)"
          created_epoch="$(date -u -d "$created_at" +%s)"
          updated_epoch="$(date -u -d "$updated_at" +%s)"
          active_age_seconds="$((now_epoch - created_epoch))"
          age_seconds="$((now_epoch - updated_epoch))"
          max_age_seconds="$((MAX_AGE_HOURS * 3600))"
          max_active_seconds="$((MAX_ACTIVE_MINUTES * 60))"
          operational_conclusion="$conclusion"
          failure_stage='none'

          {
            echo "# Daily USD Impact automation health report"
            echo
            echo "- Workflow run: $run_url"
            echo "- Run ID: \`$run_id\`"
            echo "- Trigger: \`$event\`"
            echo "- Status: \`$status\`"
            echo "- Raw conclusion: \`$conclusion\`"
            echo "- Started: \`$created_at\`"
            echo "- Last updated: \`$updated_at\`"
            echo "- Recovery age: $((age_seconds / 60)) minutes"
          } > daily-health-report.md

          # Newer external wake/manual runs are separate operational evidence.
          # Never ignore their failures or claim native HEALTHY while a newer
          # fallback is still running. A completed SUCCESS/no-op fallback,
          # however, must not replace the latest real scheduled run.
          if [ "$(jq length <<< "$latest_run_json")" -ne 1 ]; then
            echo "- Failure: latest Daily workflow run could not be identified." >> daily-health-report.md
            exit 1
          fi

          latest_id="$(jq -r '.[0].databaseId' <<< "$latest_run_json")"
          latest_event="$(jq -r '.[0].event' <<< "$latest_run_json")"
          latest_status="$(jq -r '.[0].status' <<< "$latest_run_json")"
          latest_conclusion="$(jq -r '.[0].conclusion // "unknown"' <<< "$latest_run_json")"
          latest_created="$(jq -r '.[0].createdAt' <<< "$latest_run_json")"
          latest_url="$(jq -r '.[0].url' <<< "$latest_run_json")"
          latest_created_epoch="$(date -u -d "$latest_created" +%s)"

          if [ "$latest_id" != "$run_id" ] \
            && [ "$latest_event" != "schedule" ] \
            && [ "$latest_created_epoch" -gt "$created_epoch" ]; then
            {
              echo "- Newer non-scheduled run: $latest_url"
              echo "- Newer run event: \`$latest_event\`"
              echo "- Newer run status: \`$latest_status\`"
              echo "- Newer run conclusion: \`$latest_conclusion\`"
            } >> daily-health-report.md

            if [ "$latest_status" != "completed" ]; then
              latest_active_seconds="$((now_epoch - latest_created_epoch))"
              if [ "$latest_active_seconds" -ge 0 ] \
                && [ "$latest_active_seconds" -le "$max_active_seconds" ]; then
                echo "- Operational conclusion: newer_fallback_pending" >> daily-health-report.md
                echo "state=pending" >> "$GITHUB_OUTPUT"
                cat daily-health-report.md
                exit 0
              fi
              echo "- Failure: newer non-scheduled run exceeded its active allowance." >> daily-health-report.md
              exit 1
            fi
            if [ "$latest_conclusion" != "success" ]; then
              echo "- Failure: a newer non-scheduled Daily run ended unsuccessfully; native recovery cannot be certified." >> daily-health-report.md
              exit 1
            fi
            echo "- Newer non-scheduled run succeeded; assessing the independently identified native schedule below." >> daily-health-report.md
          fi

          if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            failed_step="$(jq -r '[.jobs[].steps[]? | select(.conclusion == "failure")][0].name // ""' <<< "$jobs_json")"
            case "$failed_step" in
              'Start background news generation') failure_stage='generation' ;;
              'Poll background news generation') failure_stage='generation-or-repair' ;;
              'Import as published content') failure_stage='import' ;;
              'Validate publication content preflight') failure_stage='validation' ;;
              'Open and validate publication pull request') failure_stage='publication' ;;
              'Report Daily failure gate') failure_stage='failure-reporting' ;;
              *) failure_stage='workflow' ;;
            esac
            {
              echo "<!-- usd-impact-daily-failure-stage: $failure_stage -->"
              echo "- Failure stage: \`$failure_stage\`"
              echo "- Failed step: \`${failed_step:-unknown}\`"
            } >> daily-health-report.md
          fi

          if [ "$status" != "completed" ]; then
            if [ "$active_age_seconds" -ge 0 ] && [ "$active_age_seconds" -le "$max_active_seconds" ]; then
              echo "- Operational conclusion: generation_pending" >> daily-health-report.md
              echo "- Result: the latest run is active within its ${MAX_ACTIVE_MINUTES}-minute execution allowance." >> daily-health-report.md
              echo "state=pending" >> "$GITHUB_OUTPUT"
              cat daily-health-report.md
              exit 0
            fi
            echo "- Failure: the latest run has remained active beyond ${MAX_ACTIVE_MINUTES} minutes." >> daily-health-report.md
            exit 1
          fi

          # A generation/import/validation/workflow failure remains fatal. The only recoverable
          # raw failure is the publication stage, and only when the exact scheduled edition later
          # completed the reviewed PR path into main without changing its single Daily content file.
          if [ "$conclusion" != "success" ] && [ "$failure_stage" = "publication" ]; then
            expected_title="Publish Daily USD Impact — $expected_date"
            expected_file="apps/web/src/content/news/$expected_date.md"
            expected_head_prefix="automation/daily-usd-impact-$expected_date-"
            pulls_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")"
            recovery_json="$(jq -c --arg title "$expected_title" --arg prefix "$expected_head_prefix" '
              [.[] | select(
                .merged_at != null
                and .title == $title
                and (.head.ref | startswith($prefix))
              )][0] // empty
            ' <<< "$pulls_json")"

            if [ -n "$recovery_json" ]; then
              recovery_number="$(jq -r '.number' <<< "$recovery_json")"
              recovery_url="$(jq -r '.html_url' <<< "$recovery_json")"
              recovery_merged_at="$(jq -r '.merged_at' <<< "$recovery_json")"
              recovery_merge_sha="$(jq -r '.merge_commit_sha // ""' <<< "$recovery_json")"
              recovery_merged_epoch="$(date -u -d "$recovery_merged_at" +%s)"
              recovery_files_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$recovery_number/files?per_page=100")"
              recovery_file_count="$(jq length <<< "$recovery_files_json")"
              recovery_file="$(jq -r '.[0].filename // ""' <<< "$recovery_files_json")"

              if [ "$recovery_merged_epoch" -gt "$updated_epoch" ] \
                && [ "$recovery_file_count" -eq 1 ] \
                && [ "$recovery_file" = "$expected_file" ]; then
                operational_conclusion='recovered_after_review'
                {
                  echo "- Operational conclusion: \`recovered_after_review\`"
                  echo "- Reviewed recovery PR: [#$recovery_number]($recovery_url)"
                  echo "- Recovery merged: \`$recovery_merged_at\`"
                  echo "- Recovery merge SHA: \`$recovery_merge_sha\`"
                  echo "- Recovery file: \`$recovery_file\`"
                } >> daily-health-report.md
              fi
            fi
          fi

          if [ "$operational_conclusion" != "success" ] \
            && [ "$operational_conclusion" != "recovered_after_review" ]; then
            echo "- Failure: the latest run did not succeed and no bounded reviewed publication recovery was proven." >> daily-health-report.md
            exit 1
          fi

          if [ "$age_seconds" -lt 0 ] || [ "$age_seconds" -gt "$max_age_seconds" ]; then
            echo "- Failure: the latest run is older than ${MAX_AGE_HOURS} hours." >> daily-health-report.md
            exit 1
          fi

          # A successful no-op after an earlier human publication is not a
          # successful scheduled generator run. Check the actual job steps
          # before using a deployment's presence as recovery evidence.
          if [ "$event" != "schedule" ]; then
            echo "- Operational conclusion: non_scheduled_handoff" >> daily-health-report.md
            echo "- Result: the latest workflow was not triggered by the native Daily schedule; unattended scheduled recovery is not proven." >> daily-health-report.md
            echo "state=pending" >> "$GITHUB_OUTPUT"
            cat daily-health-report.md
            exit 0
          fi

          if [ "$operational_conclusion" = "success" ]; then
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
            required_steps=(
              "Start background news generation"
              "Poll background news generation"
              "Import as published content"
              "Validate publication content preflight"
              "Open and validate publication pull request"
            )
            for step_name in "${required_steps[@]}"; do
              step_conclusion="$(jq -r --arg name "$step_name" '[.jobs[].steps[]? | select(.name == $name) | .conclusion][0] // "missing"' <<< "$jobs_json")"
              if [ "$step_conclusion" != "success" ]; then
                echo "- Operational conclusion: scheduled_generation_not_proven" >> daily-health-report.md
                echo "- Required generator step not successful: \`$step_name\` (observed: \`$step_conclusion\`)." >> daily-health-report.md
                echo "- Result: a pre-existing article, open PR or skipped generator is not unattended recovery." >> daily-health-report.md
                echo "state=pending" >> "$GITHUB_OUTPUT"
                cat daily-health-report.md
                exit 0
              fi
            done
          fi

          expected_title="Publish Daily USD Impact — $expected_date"
          expected_file="apps/web/src/content/news/$expected_date.md"
          expected_head_prefix="automation/daily-usd-impact-$expected_date-"
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/$expected_file?ref=main" >/dev/null 2>&1; then
            editorial_pr="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --limit 100 \
              --json number,title,headRefName,url \
              --jq ".[] | select(.title == \"$expected_title\" and (.headRefName | startswith(\"$expected_head_prefix\"))) | [.number, .url] | @tsv" \
              | head -n 1)"
            if [ -n "$editorial_pr" ]; then
              echo "- Operational conclusion: awaiting_editorial_review" >> daily-health-report.md
              echo "- Publication PR: $(printf '%s' "$editorial_pr" | cut -f2)" >> daily-health-report.md
              echo "- Result: generation and publication handoff succeeded; protected editorial review is pending." >> daily-health-report.md
              echo "state=pending" >> "$GITHUB_OUTPUT"
              cat daily-health-report.md
              exit 0
            fi
            echo "- Failure: the workflow succeeded but neither the expected main file nor an open exact publication PR exists." >> daily-health-report.md
            exit 1
          fi

          node apps/web/scripts/check-daily-news-deployment-health.mjs \
            --expected-date "$expected_date" \
            --base-url "https://www.usd-impact.com" \
            --report daily-health-report.md

          # A manually dispatched Health check can inspect evidence, but only a
          # naturally scheduled Health run can certify unattended recovery.
          if [ "$HEALTH_WORKFLOW_EVENT" != "schedule" ]; then
            echo "- Operational conclusion: health_workflow_not_scheduled" >> daily-health-report.md
            echo "- Result: this Health run was manually triggered; it cannot certify or close the native scheduled-recovery incident." >> daily-health-report.md
            echo "state=pending" >> "$GITHUB_OUTPUT"
            cat daily-health-report.md
            exit 0
          fi

          echo "- Result: healthy." >> daily-health-report.md
          echo "source_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "edition_date=$expected_date" >> "$GITHUB_OUTPUT"
          echo "state=healthy" >> "$GITHUB_OUTPUT"
          cat daily-health-report.md

      - name: Open or update daily health issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: P1 — Daily USD Impact automation requires attention
        run: |
          set -euo pipefail

          if [ ! -s daily-health-report.md ]; then
            echo "# Daily USD Impact automation health report" > daily-health-report.md
            echo >> daily-health-report.md
            echo "<!-- usd-impact-daily-failure-stage: workflow -->" >> daily-health-report.md
            echo "- Failure stage: \`workflow\`" >> daily-health-report.md
            echo "The health check failed before a detailed report could be generated." >> daily-health-report.md
          fi

          if gh issue view 184 --json state --jq '.state' 2>/dev/null | grep -q '^OPEN$'; then
            gh issue comment 184 \
              --repo "$GITHUB_REPOSITORY" \
              --body-file daily-health-report.md
            echo "Updated hardening issue #184"
            exit 0
          fi

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ISSUE_TITLE" \
            --json number,title \
            --jq ".[] | select(.title == env.ISSUE_TITLE) | .number" \
            | head -n 1)"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file daily-health-report.md
            echo "Refreshed issue #$issue_number"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file daily-health-report.md
          fi

      - name: Close recovered daily health issue
        # A natural schedule plus checked receipts can propose recovery, but issue closure
        # requires a separately approved owner-controlled repository variable.
        # Default unset => no automatic closure of an unresolved incident.
        if: steps.health.outcome == 'success' && steps.health.outputs.state == 'healthy' && github.event_name == 'schedule' && vars.DAILY_NEWS_INCIDENT_AUTOCLOSE_APPROVED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: P1 — Daily USD Impact automation requires attention
          VERIFIED_SOURCE_RUN_ID: ${{ steps.health.outputs.source_run_id }}
          VERIFIED_EDITION_DATE: ${{ steps.health.outputs.edition_date }}
        run: |
          set -euo pipefail

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ISSUE_TITLE" \
            --json number,title \
            --jq ".[] | select(.title == env.ISSUE_TITLE) | .number" \
            | head -n 1)"

          if [ -n "$issue_number" ]; then
            # Source-run success plus a manually merged article is not proof of
            # end-to-end automatic delivery. Close only after an exact bot merge
            # from this genuine scheduled generator and a successful auto
            # publisher workflow. Unknown metadata always leaves the issue open.
            if [[ ! "$VERIFIED_SOURCE_RUN_ID" =~ ^[0-9]+$ ]] \
              || [[ ! "$VERIFIED_EDITION_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::notice::No verified source run/date; Health issue remains open."
              exit 0
            fi
            expected_title="Publish Daily USD Impact — $VERIFIED_EDITION_DATE"
            expected_branch="automation/daily-usd-impact-$VERIFIED_EDITION_DATE-$VERIFIED_SOURCE_RUN_ID"
            expected_file="apps/web/src/content/news/$VERIFIED_EDITION_DATE.md"

            # A complete source/PR run must match the unique original Daily run.
            pulls_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100")" || {
              echo "::notice::Closed PR evidence unavailable; issue remains open."
              exit 0
            }
            publication_pr="$(jq -r --arg title "$expected_title" --arg branch "$expected_branch" '
              [.[] | select(.merged_at != null and .title == $title
                and .head.ref == $branch and .base.ref == "main")]
              | if length == 1 then .[0].number else empty end
            ' <<< "$pulls_json")" || {
              echo "::notice::PR lineage cannot be parsed; issue remains open."
              exit 0
            }
            if [[ ! "$publication_pr" =~ ^[0-9]+$ ]]; then
              echo "::notice::No single merged PR from this exact scheduled generator; issue remains open."
              exit 0
            fi

            pr_detail="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$publication_pr")" || {
              echo "::notice::Publisher identity unavailable; issue remains open."
              exit 0
            }
            if ! jq -e --arg branch "$expected_branch" '
              .merged == true and .merged_at != null
              and .head.ref == $branch and .base.ref == "main"
              and .merged_by.login == "github-actions[bot]"
              and (.merge_commit_sha | type == "string" and test("^[a-f0-9]{40}$"))
            ' <<< "$pr_detail" >/dev/null; then
              echo "::notice::The edition was not proven merged by the automatic publisher; issue remains open."
              exit 0
            fi

            files_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$publication_pr/files?per_page=100")" || {
              echo "::notice::Daily file scope unavailable; issue remains open."
              exit 0
            }
            if ! jq -e --arg expected "$expected_file" '
              length == 1 and .[0].filename == $expected and .[0].status == "added"
            ' <<< "$files_json" >/dev/null; then
              echo "::notice::Automatic merge changed an unexpected file scope; issue remains open."
              exit 0
            fi

            auto_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-news-auto-publish.yml/runs?event=workflow_run&created=$VERIFIED_EDITION_DATE&per_page=100")" || {
              echo "::notice::Automatic publisher run evidence unavailable; issue remains open."
              exit 0
            }
            if ! jq -e --arg date "$VERIFIED_EDITION_DATE" '
              (.total_count | type) == "number"
              and .total_count <= 100
              and .total_count == (.workflow_runs | length)
              and ([.workflow_runs[] | select(
                .path == ".github/workflows/daily-news-auto-publish.yml"
                and .event == "workflow_run"
                and .head_branch == "main"
                and .status == "completed"
                and .conclusion == "success"
                and (.created_at | startswith($date))
              )] | length) >= 1
            ' <<< "$auto_runs" >/dev/null; then
              echo "::notice::No completed successful auto-publisher run for this date; issue remains open."
              exit 0
            fi

            {
              echo "## Recovery confirmed"
              echo
              cat daily-health-report.md
            } > daily-health-recovery.md
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file daily-health-recovery.md
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
            echo "Closed recovered issue #$issue_number"
          else
            echo "No open daily health issue to close"
          fi

      - name: Fail when daily health checks fail
        if: steps.health.outcome == 'failure'
        run: |
          echo "Daily USD Impact health checks failed. Review the generated issue and report."
          exit 1
