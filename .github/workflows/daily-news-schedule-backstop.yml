name: Daily USD Impact schedule backstop

on:
  schedule:
    - cron: '17 12 * * 1-5'
    - cron: '47 15 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: daily-usd-impact-schedule-backstop
  cancel-in-progress: false

jobs:
  recover-missed-daily-start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Check whether Daily recovery is needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A failed GitHub polling job is not a terminal provider response.
          # Complete, validated history must show a genuinely missed start.
          node apps/web/scripts/daily-news-recovery.mjs backstop
