name: Daily USD Impact draft

on:
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-usd-impact
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Check newsfeed configuration
        id: config
        env:
          NEWSFEED_ENDPOINT: ${{ secrets.NEWSFEED_ENDPOINT }}
          NEWSFEED_BEARER_TOKEN: ${{ secrets.NEWSFEED_BEARER_TOKEN }}
        run: |
          if [ -z "$NEWSFEED_ENDPOINT" ] || [ -z "$NEWSFEED_BEARER_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NEWSFEED_ENDPOINT or NEWSFEED_BEARER_TOKEN is not configured; no draft was generated."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Start background news generation
        if: steps.config.outputs.configured == 'true'
        env:
          NEWSFEED_ENDPOINT: ${{ secrets.NEWSFEED_ENDPOINT }}
          NEWSFEED_BEARER_TOKEN: ${{ secrets.NEWSFEED_BEARER_TOKEN }}
        run: |
          background_endpoint="$(node -e '
            const url = new URL(process.env.NEWSFEED_ENDPOINT);
            if (!/\/daily-news-source\/?$/.test(url.pathname)) {
              throw new Error("NEWSFEED_ENDPOINT must end with /daily-news-source");
            }
            url.pathname = url.pathname.replace(/\/daily-news-source\/?$/, "/daily-news-grounded-background");
            process.stdout.write(url.toString());
          ')"
          echo "BACKGROUND_ENDPOINT=$background_endpoint" >> "$GITHUB_ENV"

          curl --fail --silent --show-error --location \
            --request POST --max-time 60 \
            -H "Authorization: Bearer $NEWSFEED_BEARER_TOKEN" \
            "$background_endpoint" \
            --output "$RUNNER_TEMP/daily-usd-impact-start.json"

          response_id="$(node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/daily-usd-impact-start.json", "utf8"));
            if (!/^resp_[A-Za-z0-9_-]{8,200}$/.test(payload.id || "")) {
              throw new Error("Background endpoint did not return a valid response id");
            }
            process.stdout.write(payload.id);
          ')"
          echo "OPENAI_RESPONSE_ID=$response_id" >> "$GITHUB_ENV"
          echo "Started background response $response_id"

      - name: Poll background news generation
        if: steps.config.outputs.configured == 'true'
        env:
          NEWSFEED_BEARER_TOKEN: ${{ secrets.NEWSFEED_BEARER_TOKEN }}
        run: |
          for attempt in $(seq 1 36); do
            poll_url="${BACKGROUND_ENDPOINT}?response_id=${OPENAI_RESPONSE_ID}"
            http_code="$(curl --silent --show-error --location \
              --max-time 60 \
              -H "Authorization: Bearer $NEWSFEED_BEARER_TOKEN" \
              "$poll_url" \
              --output "$RUNNER_TEMP/daily-usd-impact-poll.json" \
              --write-out '%{http_code}')"

            if [ "$http_code" = "200" ]; then
              mv "$RUNNER_TEMP/daily-usd-impact-poll.json" "$RUNNER_TEMP/daily-usd-impact.json"
              echo "Background news generation completed on poll $attempt."
              exit 0
            fi

            if [ "$http_code" = "202" ]; then
              status="$(node -e '
                const fs = require("fs");
                const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/daily-usd-impact-poll.json", "utf8"));
                process.stdout.write(String(payload.status || "pending"));
              ')"
              echo "Poll $attempt: $status"
              sleep 20
              continue
            fi

            echo "Background endpoint returned HTTP $http_code"
            cat "$RUNNER_TEMP/daily-usd-impact-poll.json"
            exit 1
          done

          echo "Background news generation did not complete within 12 minutes."
          exit 1

      - name: Import as review content
        if: steps.config.outputs.configured == 'true'
        run: node scripts/import-daily-news.mjs "$RUNNER_TEMP/daily-usd-impact.json" --replace

      - name: Validate and build
        if: steps.config.outputs.configured == 'true'
        run: |
          npm run validate
          npm run build

      - name: Open draft pull request
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain src/content/news)" ]; then
            echo "No news changes to propose."
            exit 0
          fi

          edition_date="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/daily-usd-impact.json', 'utf8')).date")"
          branch="automation/daily-usd-impact-${edition_date}-${GITHUB_RUN_ID}"

          git config user.name "usd-impact-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/content/news
          git commit -m "Add Daily USD Impact edition for ${edition_date}"
          git push --set-upstream origin "$branch"

          cat > "$RUNNER_TEMP/daily-news-pr.md" <<EOF
          ## Daily USD Impact draft

          This automated pull request imports the source-backed edition for **${edition_date}** with status \`review\`.

          ### Required review
          - Verify every material fact against its linked source.
          - Confirm price timestamps and event dates.
          - Check that cross-asset interpretation is conditional and educational.
          - Update the edition to \`published\` only after editorial approval.
          - Merge only after the Web quality workflow passes.

          The automation does not publish directly to production.
          EOF

          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "Daily USD Impact — ${edition_date}" \
            --body-file "$RUNNER_TEMP/daily-news-pr.md"
