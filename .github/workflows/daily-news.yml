name: Daily USD Impact publication

on:
  schedule:
    - cron: '17 9 * * 1-5'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: daily-usd-impact
  cancel-in-progress: false

jobs:
  build-and-publish:
    # Temporary isolated PR-author smoke on this Draft ref must NEVER run the
    # news source generator or spend credits. Remove this guard after proof.
    if: ${{ github.ref != 'refs/heads/fix/daily-pr-app-author-draft-20261105' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check existing Daily publication state
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          today="$(date -u +%F)"
          expected_title="Publish Daily USD Impact — $today"
          expected_head_prefix="automation/daily-usd-impact-$today-"
          expected_file="apps/web/src/content/news/$today.md"

          # A delayed native Friday schedule must not silently generate a Saturday edition.
          # Explicit manual dispatch retains its separately authorized weekday override.
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" -gt 5 ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=outside-scheduled-weekday" >> "$GITHUB_OUTPUT"
            echo "::notice::A delayed Daily schedule arrived outside UTC weekdays; skipping paid generation."
            exit 0
          fi

          # Treat only a confirmed HTTP 404 as absence. GitHub auth, transport,
          # throttling and server errors must never authorize another paid draft.
          file_headers="$(gh api --include --silent "repos/$GITHUB_REPOSITORY/contents/$expected_file?ref=main" 2>/dev/null)" || true
          file_status="$(awk '/^HTTP\// {code=$2} END {gsub(/\r/, "", code); print code}' <<< "$file_headers")"
          if [ "$file_status" = "200" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=published" >> "$GITHUB_OUTPUT"
            echo "::notice::Daily USD Impact $today is already on main; skipping duplicate generation."
            exit 0
          fi
          if [ "$file_status" != "404" ]; then
            echo "::error::Daily publication lookup did not return confirmed 200/404; holding without paid generation."
            exit 1
          fi

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --base main \
            --limit 100 \
            --json number,title,headRefName,state,url \
            --jq ".[] | select(.title == \"$expected_title\" and (.headRefName | startswith(\"$expected_head_prefix\"))) | [.number, .state, .url] | @tsv" \
            | head -n 1)"

          if [ -n "$existing_pr" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=publication-pr-exists" >> "$GITHUB_OUTPUT"
            echo "::notice::A Daily USD Impact $today publication PR already exists; respecting that editorial state and skipping duplicate generation."
            exit 0
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "reason=missing" >> "$GITHUB_OUTPUT"

      - name: Check newsfeed configuration
        id: config
        env:
          PUBLICATION_NEEDED: ${{ steps.preflight.outputs.needed }}
          NEWSFEED_ENDPOINT: ${{ secrets.NEWSFEED_ENDPOINT }}
          NEWSFEED_BEARER_TOKEN: ${{ secrets.NEWSFEED_BEARER_TOKEN }}
          DAILY_PR_APP_CLIENT_ID: ${{ vars.DAILY_NEWS_PR_APP_CLIENT_ID }}
          DAILY_PR_APP_PRIVATE_KEY: ${{ secrets.DAILY_NEWS_PR_APP_PRIVATE_KEY }}
        run: |
          if [ "$PUBLICATION_NEEDED" != "true" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Daily publication preflight requires no new generation; downstream publication steps are skipped."
            exit 0
          fi

          if [ -z "$NEWSFEED_ENDPOINT" ] || [ -z "$NEWSFEED_BEARER_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NEWSFEED_ENDPOINT or NEWSFEED_BEARER_TOKEN is not configured; no edition was generated."
          elif [ -z "$DAILY_PR_APP_CLIENT_ID" ] || [ -z "$DAILY_PR_APP_PRIVATE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Daily PR-author GitHub App is not provisioned; no paid generation was started."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Validate App installation and scoped token permissions before any paid
      # source generation. A present but invalid/misinstalled private key must
      # never permit spending merely to fail on PR creation after generation.
      # This token is not passed to source generation or Git commands.
      - name: Verify PR-author App installation before paid news generation
        id: daily_pr_author_preflight
        if: steps.config.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DAILY_NEWS_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DAILY_NEWS_PR_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.config.outputs.configured == 'true'
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Start background news generation
        id: start
        if: steps.config.outputs.configured == 'true'
        env:
          NEWSFEED_ENDPOINT: ${{ secrets.NEWSFEED_ENDPOINT }}
          NEWSFEED_BEARER_TOKEN: ${{ secrets.NEWSFEED_BEARER_TOKEN }}
        run: |
          background_endpoint="$(node -e '
            const url = new URL(process.env.NEWSFEED_ENDPOINT);
            if (!/\/daily-news-source\/?$/.test(url.pathname)) {
              throw new Error("NEWSFEED_ENDPOINT must end with /daily-news-source");
            }
            url.pathname = url.pathname.replace(/\/daily-news-source\/?$/, "/daily-news-grounded-background");
            process.stdout.write(url.toString());
          ')"
          echo "BACKGROUND_ENDPOINT=$background_endpoint" >> "$GITHUB_ENV"
          edition_date="$(date -u +%F)"
          echo "EDITION_DATE=$edition_date" >> "$GITHUB_ENV"

          curl --fail --silent --show-error --location \
            --request POST --max-time 60 \
            -H "Authorization: Bearer $NEWSFEED_BEARER_TOKEN" \
            -H "X-USD-Impact-Edition-Date: $edition_date" \
            "$background_endpoint" \
            --output "$RUNNER_TEMP/daily-usd-impact-start.json"

          response_id="$(node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/daily-usd-impact-start.json", "utf8"));
            if (!/^resp_[A-Za-z0-9_-]{8,200}$/.test(payload.id || "")) {
              throw new Error("Background endpoint did not return a valid response id");
            }
            process.stdout.write(payload.id);
          ')"
          echo "OPENAI_RESPONSE_ID=$response_id" >> "$GITHUB_ENV"
          echo "Started background response $response_id"

      - name: Poll background news generation
        id: poll
        if: steps.config.outputs.configured == 'true'
        env:
          NEWSFEED_BEARER_TOKEN: ${{ secrets.NEWSFEED_BEARER_TOKEN }}
        run: |
          response_id="$OPENAI_RESPONSE_ID"
          poll_payload="$RUNNER_TEMP/daily-usd-impact-poll.json"
          max_active_seconds=2400
          generation_attempt=1
          regeneration_used=false

          while true; do
            poll_attempt=0
            active_started_at="$(date -u +%s)"
            retry_started=false
            saw_active_response=false

            while [ "$(date -u +%s)" -lt "$((active_started_at + max_active_seconds))" ]; do
              poll_attempt="$((poll_attempt + 1))"
              rm -f "$poll_payload"
              curl_exit=0
              http_code="$(curl --silent --show-error --location \
                --max-time 240 \
                -H "Authorization: Bearer $NEWSFEED_BEARER_TOKEN" \
                -H "X-USD-Impact-Edition-Date: $EDITION_DATE" \
                -H "X-USD-Impact-Response-Id: $response_id" \
                "$BACKGROUND_ENDPOINT" \
                --output "$poll_payload" \
                --write-out '%{http_code}')" || curl_exit=$?

              if [ "$curl_exit" -ne 0 ]; then
                rm -f "$poll_payload"
                case "$curl_exit" in
                  5|6|7|18|28|35|52|55|56|92)
                    echo "::warning::Transient background poll transport failure (curl exit $curl_exit) on generation attempt $generation_attempt, poll $poll_attempt; retrying the same response."
                    sleep 5
                    continue
                    ;;
                  *)
                    printf '{"code":"poll-transport-error","error":"Background poll transport failed with curl exit %s","status":"failed"}\n' "$curl_exit" > "$poll_payload"
                    echo "::error::Background poll transport failed with non-retryable curl exit $curl_exit."
                    exit 1
                    ;;
                esac
              fi

              if [ "$http_code" = "200" ]; then
                mv "$poll_payload" "$RUNNER_TEMP/daily-usd-impact.json"
                echo "Background news generation completed on generation attempt $generation_attempt, poll $poll_attempt."
                exit 0
              fi

              if [ "$http_code" = "202" ]; then
                status="$(node -e '
                  const fs = require("fs");
                  const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/daily-usd-impact-poll.json", "utf8"));
                  process.stdout.write(String(payload.status || "pending"));
                ')"
                if [ "$status" != "queued" ] && [ "$status" != "in_progress" ]; then
                  echo "::error::Background endpoint returned HTTP 202 with unknown status $status."
                  cat "$poll_payload"
                  exit 1
                fi
                saw_active_response=true
                echo "Generation attempt $generation_attempt, poll $poll_attempt: $status"
                sleep 20
                continue
              fi

              if [ "$regeneration_used" = "false" ] && node scripts/daily-news-retry-policy.mjs "$poll_payload"; then
                echo "Recoverable generation or bounded-repair failure detected; starting one bounded full regeneration attempt."
                curl --fail --silent --show-error --location \
                  --request POST --max-time 60 \
                  -H "Authorization: Bearer $NEWSFEED_BEARER_TOKEN" \
                  -H "X-USD-Impact-Edition-Date: $EDITION_DATE" \
                  "$BACKGROUND_ENDPOINT" \
                  --output "$RUNNER_TEMP/daily-usd-impact-retry-start.json"

                response_id="$(node -e '
                  const fs = require("fs");
                  const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/daily-usd-impact-retry-start.json", "utf8"));
                  if (!/^resp_[A-Za-z0-9_-]{8,200}$/.test(payload.id || "")) {
                    throw new Error("Retry endpoint did not return a valid response id");
                  }
                  process.stdout.write(payload.id);
                ')"
                regeneration_used=true
                generation_attempt=2
                retry_started=true
                echo "Started retry background response $response_id"
                break
              fi

              echo "Background endpoint returned HTTP $http_code"
              cat "$poll_payload"
              exit 1
            done

            if [ "$retry_started" = "true" ]; then
              continue
            fi

            if [ "$saw_active_response" = "true" ]; then
              printf '{"code":"poll-active-timeout","error":"Background response remained queued or in progress beyond its 40-minute polling lease","status":"%s","responseId":"%s","generationAttempt":%s}\n' \
                "$status" "$response_id" "$generation_attempt" > "$poll_payload"
              echo "::error::Background response $response_id remained $status beyond its 40-minute polling lease."
              if [ "$regeneration_used" = "false" ]; then
                echo "::error::No regeneration was started because the response never reached a retryable terminal state."
              else
                echo "::error::The single bounded full regeneration remained active beyond its polling lease."
              fi
            else
              printf '{"code":"poll-transport-retries-exhausted","error":"Background polling exhausted its bounded transport retry lease","status":"failed"}\n' > "$poll_payload"
              echo "::error::Background polling exhausted its 40-minute transport retry lease."
            fi
            exit 1
          done

      - name: Import as published content
        id: import_content
        if: steps.config.outputs.configured == 'true'
        run: node scripts/import-daily-news.mjs "$RUNNER_TEMP/daily-usd-impact.json" --replace --skip-published --publish

      - name: Validate publication content preflight
        id: validate_build
        if: steps.config.outputs.configured == 'true'
        run: node scripts/validate-publication-content.mjs --preflight

      # This installation token is minted only after source generation/validation,
      # avoiding 1-hour expiration during the bounded background generation lease.
      # Omitted owner/repositories inputs scope the token to this repository only.
      # The action revokes it at job exit. App must have Contents: read,
      # Pull requests: write; no merge, Actions, issues or admin permissions.
      - name: Mint short-lived Daily PR-author GitHub App token
        id: daily_pr_author_token
        if: steps.config.outputs.configured == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DAILY_NEWS_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DAILY_NEWS_PR_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Open and validate publication pull request
        id: publish_pr
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_PR_APP_TOKEN: ${{ steps.daily_pr_author_token.outputs.token }}
        run: |
          # Do not silently fall back to GITHUB_TOKEN for PR creation: a
          # GitHub Actions-authored PR suppresses the required PR check events.
          if [ -z "$DAILY_PR_APP_TOKEN" ]; then
            echo "::error::No scoped App PR-author token; automatic PR creation held."
            exit 1
          fi
          if [ -z "$(git status --porcelain src/content/news)" ]; then
            echo "No news changes to publish."
            exit 0
          fi

          edition_date="$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/daily-usd-impact.json', 'utf8')).date")"
          branch="automation/daily-usd-impact-${edition_date}-${GITHUB_RUN_ID}"

          existing_pr_url="$(gh pr list \
            --state open \
            --head "$branch" \
            --json url \
            --jq '.[0].url // empty')"

          if [ -n "$existing_pr_url" ]; then
            pr_url="$existing_pr_url"
            head_sha="$(gh pr view "$pr_url" --json headRefOid --jq '.headRefOid')"
            echo "Reusing existing publication pull request $pr_url at $head_sha."
          else
            git config user.name "usd-impact-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git checkout -b "$branch"
            git add src/content/news
            git commit -m "Publish Daily USD Impact edition for ${edition_date}"
            git push --set-upstream origin "$branch"
            head_sha="$(git rev-parse HEAD)"

            printf '%s\n\n%s\n\n%s\n' \
              '## Automated Daily USD Impact publication' \
              "This pull request contains the source-backed **${edition_date}** edition with status \`published\`." \
              'The generator validates this exact commit with Web quality and submits its PR to a separately gated automatic publisher. Any failing source, calendar, security, Preview or timing gate leaves the PR open for protected owner review; a failed validation or build never changes Production.' \
              > "$RUNNER_TEMP/daily-news-pr.md"

            pr_url="$(GH_TOKEN="$DAILY_PR_APP_TOKEN" gh pr create \
              --base main \
              --head "$branch" \
              --title "Publish Daily USD Impact — ${edition_date}" \
              --body-file "$RUNNER_TEMP/daily-news-pr.md")"
          fi

          publication_base_sha="$(gh pr view "$pr_url" --json baseRefOid --jq '.baseRefOid')"
          quality_requested_at="$(date -u +%FT%TZ)"
          gh workflow run quality.yml --ref "$branch" \
            -f publication_base_sha="$publication_base_sha" \
            -f publication_head_sha="$head_sha"

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow quality.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$head_sha\" and .createdAt >= \"$quality_requested_at\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Could not locate the dispatched Web quality run for $head_sha."
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          run_conclusion="$(gh run view "$run_id" --json conclusion --jq '.conclusion // empty')"
          if [ "$run_conclusion" != "success" ]; then
            echo "Web quality run $run_id concluded '${run_conclusion:-unknown}'; expected success."
            exit 1
          fi
          echo 'Required exact-head security checks, original-source validation and Preview remain separate from generator success; the bounded auto-publisher may merge eligible morning editions only after them.'
          echo "Daily USD Impact ${edition_date} passed Web quality and is ready for bounded automatic publication or protected owner review: $pr_url"


      # GITHUB_TOKEN-dispatched upstream runs can suppress a downstream workflow_run
      # event. Explicit workflow_dispatch is GitHub's supported exception; the
      # receiver must re-fetch and validate this immutable source run itself.
      - name: Explicitly dispatch trusted bounded publisher after source verification
        if: ${{ success() && github.event_name == 'workflow_dispatch' && steps.config.outputs.configured == 'true' && steps.publish_pr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          expected_branch="automation/daily-usd-impact-$(date -u +%F)-$GITHUB_RUN_ID"
          pr_count="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main \
            --head "$expected_branch" --json number --jq 'length')"
          if [ "$pr_count" != "1" ]; then
            echo "::error::No unique original Daily publication PR; not dispatching publisher."
            exit 1
          fi
          # Only the GitHub token-owned backstop generator can request a
          # privileged publisher. Do not extend this path to manual generators.
          if [ "$GITHUB_ACTOR" != "github-actions[bot]" ] \
            || [ "$SOURCE_TRIGGERING_ACTOR" != "github-actions[bot]" ] \
            || [ "$SOURCE_RUN_ATTEMPT" != "1" ]; then
            echo "::error::Generator must be a first-attempt bot-triggered source; no rerun handoff."
            exit 1
          fi
          # GitHub's run-name is derived from the requested source_run_id, so an
          # unrelated bot dispatch within the same minute cannot count as ours.
          expected_title="Daily USD Impact bounded auto-publication source $GITHUB_RUN_ID"
          requested_at="$(date -u +%s)"
          if ! gh workflow run daily-news-auto-publish.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f "source_run_id=$GITHUB_RUN_ID"; then
            echo "::error::Publisher dispatch acknowledgement not verified; never retry automatically."
            exit 1
          fi
          # An accepted dispatch command is not proof that the receiver exists.
          # Poll only for a fresh bot-originated run, without dispatch retry.
          receipt=""
          for poll in $(seq 1 12); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/daily-news-auto-publish.yml/runs?event=workflow_dispatch&created=$(date -u +%F)&per_page=100")"
            if ! jq -e '.total_count <= 100 and .total_count == (.workflow_runs | length)' <<< "$payload" >/dev/null; then
              echo "::error::Ambiguous or truncated publisher run evidence; hold."
              exit 1
            fi
            matches="$(jq -c --arg expected_title "$expected_title" --argjson timestamp "$requested_at" \
              '[.workflow_runs[] | select(
                .event == "workflow_dispatch" and .head_branch == "main"
                and .actor.login == "github-actions[bot]"
                and .display_title == $expected_title
                and ((.created_at | fromdateiso8601) >= ($timestamp - 15))
              )]' <<< "$payload")"
            count="$(jq 'length' <<< "$matches")"
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple new publisher runs; hold for provenance review."
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              receipt="$(jq -r '.[0].html_url' <<< "$matches")"
              break
            fi
            sleep 5
          done
          if [ -z "$receipt" ]; then
            echo "::error::Publisher run receipt not observed; no retry authorized."
            exit 1
          fi
          echo "Publisher workflow_dispatch observed: $receipt"
          echo "Source run $GITHUB_RUN_ID remains subject to exact success, cutoff, CI and editorial gates."

      - name: Report Daily failure gate
        if: failure() && (steps.preflight.outcome == 'failure' || steps.config.outputs.configured == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          START_OUTCOME: ${{ steps.start.outcome }}
          POLL_OUTCOME: ${{ steps.poll.outcome }}
          IMPORT_OUTCOME: ${{ steps.import_content.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_pr.outcome }}
        run: |
          payload_path="-"
          if [ -s "$RUNNER_TEMP/daily-usd-impact-poll.json" ]; then
            payload_path="$RUNNER_TEMP/daily-usd-impact-poll.json"
          fi

          if [ "$PREFLIGHT_OUTCOME" = "failure" ]; then
            stage='preflight'
            gate='publication-existence-lookup'
            detail='GitHub contents lookup did not confirm a safe publication decision; no generation was started.'
          else
            result="$(node scripts/daily-news-failure-stage.mjs \
              "$payload_path" \
              "$START_OUTCOME" \
              "$POLL_OUTCOME" \
              "$IMPORT_OUTCOME" \
              "$VALIDATE_OUTCOME" \
              "$PUBLISH_OUTCOME" \
              'publication-content-preflight')"
            stage="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.stage)' "$result")"
            gate="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.gate)' "$result")"
            detail="$(node -e 'const value=JSON.parse(process.argv[1]); process.stdout.write(value.detail || "not exposed")' "$result")"
          fi

          printf '%s\n\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n\n%s\n' \
            '## Daily USD Impact automation failure' \
            "<!-- usd-impact-daily-failure-stage: ${stage} -->" \
            "- Failure stage: \`${stage}\`" \
            "- Failing gate: \`${gate}\`" \
            "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- Commit: \`${GITHUB_SHA}\`" \
            "- Trigger: \`${GITHUB_EVENT_NAME}\`" \
            "- Step outcomes: preflight=${PREFLIGHT_OUTCOME}, start=${START_OUTCOME}, poll=${POLL_OUTCOME}, import=${IMPORT_OUTCOME}, validate=${VALIDATE_OUTCOME}, publish=${PUBLISH_OUTCOME}" \
            "- Bounded detail: ${detail}" \
            'The workflow remained fail-closed. No content was merged or deployed by this failed run.' \
            > "$RUNNER_TEMP/daily-failure-report.md"

          cat "$RUNNER_TEMP/daily-failure-report.md" >> "$GITHUB_STEP_SUMMARY"

          if gh issue view 184 --repo "$GITHUB_REPOSITORY" --json state --jq '.state' 2>/dev/null | grep -q '^OPEN$'; then
            gh issue comment 184 \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/daily-failure-report.md"
          else
            issue_title='P1 — Daily USD Impact automation requires attention'
            issue_number="$(gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$issue_title in:title" \
              --json number \
              --jq '.[0].number // empty')"
            if [ -n "$issue_number" ]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file "$RUNNER_TEMP/daily-failure-report.md"
            else
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$issue_title" \
                --body-file "$RUNNER_TEMP/daily-failure-report.md"
            fi
          fi

  # TEMPORARY DRAFT-ONLY PROOF. Remove this entire job and the above
  # build-and-publish branch guard before the owner approves the production
  # Daily App PR author change. It creates only one inert docs-only Draft PR.
  app-pr-event-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/fix/daily-pr-app-author-draft-20261105' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Verify isolated nonpublishing identity before reading the App key
        env:
          EXPECTED_REF: refs/heads/fix/daily-pr-app-author-draft-20261105
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "$EXPECTED_REF"
          test "$GITHUB_REPOSITORY" = usdimpact/usd-impact-site
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" != refs/heads/main
          echo 'Daily App PR-event smoke: approved Draft ref verified; no news generation or production publication.'

      - name: Mint GitHub App token for isolated PR-event proof
        id: smoke_app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DAILY_NEWS_PR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DAILY_NEWS_PR_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Create one inert Draft PR with GitHub App authorship
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_PR_APP_TOKEN: ${{ steps.smoke_app_token.outputs.token }}
        run: |
          set -euo pipefail
          test -n "$DAILY_PR_APP_TOKEN"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$main_sha" =~ ^[a-f0-9]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/fix/daily-pr-app-author-draft-20261105
          test "$GITHUB_RUN_ATTEMPT" = 1
          smoke_branch="verification/daily-pr-app-event-$GITHUB_RUN_ID"
          smoke_file="docs/operations/daily-pr-app-event-smoke-$GITHUB_RUN_ID.md"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/heads/$smoke_branch" -f "sha=$main_sha" > /dev/null
          fixture="$(printf '# Temporary GitHub App event proof\n\nInert one-file fixture for source run %s. No news generated. Never merge this PR.\n' "$GITHUB_RUN_ID" | base64 -w0)"
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$smoke_file" \
            -f "message=test(daily): nonpublishing GitHub App PR-event proof $GITHUB_RUN_ID" \
            -f "branch=$smoke_branch" -f "content=$fixture" > /dev/null
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/$smoke_branch" --jq '.commit.sha')"
          [[ "$head_sha" =~ ^[a-f0-9]{40}$ ]]
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$main_sha...$head_sha")"
          jq -e --arg expected "$smoke_file" \
            '.status == "ahead" and .ahead_by == 1 and .behind_by == 0 and (.files | length) == 1 and .files[0].filename == $expected and .files[0].status == "added"' \
            <<< "$comparison" > /dev/null
          printf '%s\n' 'Nonpublishing GitHub App pull-request event smoke.' \
            'This Draft adds only one inert docs fixture, no executable changes.' \
            'It exists solely to test whether native pull_request required checks start without action_required.' \
            'Do NOT merge or convert to ready. Close after collecting exact-head check evidence.' \
            > "$RUNNER_TEMP/daily-app-smoke-pr-body.md"
          pr_url="$(GH_TOKEN="$DAILY_PR_APP_TOKEN" gh pr create \
            --repo "$GITHUB_REPOSITORY" --base main --head "$smoke_branch" --draft \
            --title "TEST ONLY: Daily GitHub App required-check event $GITHUB_RUN_ID" \
            --body-file "$RUNNER_TEMP/daily-app-smoke-pr-body.md")"
          pr_number="${pr_url##*/}"
          [[ "$pr_number" =~ ^[1-9][0-9]{0,9}$ ]]
          pr_data="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number")"
          jq -e --arg source "$smoke_branch" --arg base "$main_sha" \
            '.state == "open" and .draft == true and .base.ref == "main" and .base.sha == $base and .head.ref == $source and .user.login == "usd-impact-daily-pr-author[bot]"' \
            <<< "$pr_data" > /dev/null
          echo "App-authored nonpublishing Draft PR: $pr_url"
          echo "Verified App author: usd-impact-daily-pr-author[bot]; exact original main: $main_sha"
          echo "## App-author event proof: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          echo 'No paid generation, publication, merge or change to protected main was requested.' >> "$GITHUB_STEP_SUMMARY"
