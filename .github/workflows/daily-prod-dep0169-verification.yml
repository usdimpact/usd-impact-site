name: Daily Production DEP0169 verification

on:
  push:
    branches:
      - diag/daily-prod-dep0169-20261002
    paths:
      - .github/workflows/daily-prod-dep0169-verification.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise released Production header-only poll path
        env:
          NEWSFEED_BEARER_TOKEN: ${{ secrets.NEWSFEED_BEARER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEWSFEED_BEARER_TOKEN"
          code="$(curl --silent --show-error --location             --max-time 60             -H "Authorization: Bearer $NEWSFEED_BEARER_TOKEN"             -H "X-USD-Impact-Edition-Date: 2026-10-05"             -H "X-USD-Impact-Response-Id: resp_12345678"             'https://www.usd-impact.com/api/daily-news-grounded-background'             --output /tmp/probe.json             --write-out '%{http_code}')"
          echo "HTTP_STATUS=$code"
          if [ "$code" != "502" ]; then
            echo "Unexpected status $code"
            cat /tmp/probe.json
            exit 1
          fi
