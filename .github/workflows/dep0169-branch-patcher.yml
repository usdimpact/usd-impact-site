name: DEP0169 branch-only patcher

on:
  push:
    branches:
      - fix/dep0169-request-query-20260917

permissions:
  contents: write

concurrency:
  group: dep0169-request-query-patcher
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'usdimpact/usd-impact-site'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Guard exact branch and base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/dep0169-request-query-20260917"
          git fetch origin main --depth=1
          test "$(git rev-parse origin/main)" = "ead2afb72fd98a00b3a57eb33cc451c226e85110"
          test "$(git rev-parse HEAD^)" = "ead2afb72fd98a00b3a57eb33cc451c226e85110"
          test "$(git diff --name-only HEAD^..HEAD)" = ".github/workflows/dep0169-branch-patcher.yml"

      - name: Apply exact two-file patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('apps/web/api/daily-news-background.js')
          source = source_path.read_text()
          old = """function queryParam(request, name) {
            const direct = request.query?.[name];
            if (Array.isArray(direct)) return String(direct[0] ?? '').trim();
            if (direct !== undefined && direct !== null) return String(direct).trim();
            try {
              const url = new URL(request.url ?? '/', 'https://usd-impact.com');
              return url.searchParams.get(name)?.trim() ?? '';
            } catch {
              return '';
            }
          }
          """
          new = """export function queryParam(request, name) {
            const direct = request.query?.[name];
            if (Array.isArray(direct)) return String(direct[0] ?? '').trim();
            if (direct !== undefined && direct !== null) return String(direct).trim();
            return '';
          }
          """
          if source.count(old) != 1:
              raise SystemExit(f'expected one queryParam block, found {source.count(old)}')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('apps/web/scripts/test-daily-news-editorial-validation.mjs')
          test = test_path.read_text()
          old_import = "import { buildRepairOutputSchema } from '../api/daily-news-background.js';"
          new_import = "import { buildRepairOutputSchema, queryParam } from '../api/daily-news-background.js';"
          if test.count(old_import) != 1:
              raise SystemExit(f'expected one background import, found {test.count(old_import)}')
          test = test.replace(old_import, new_import, 1)

          marker = "const treasuryBuybackTitle = 'Treasury Announces Increased Sizes of Nominal Long-End Liquidity Support Buybacks Beginning September 9';\n"
          assertions = """

          const queryOnlyRequest = {
            query: {
              date: ' 2026-09-17 ',
              response_id: [' resp_12345678 ', 'ignored'],
            },
            get url() {
              throw new Error('request.url must not be accessed by queryParam');
            },
          };
          assert.equal(queryParam(queryOnlyRequest, 'date'), '2026-09-17');
          assert.equal(queryParam(queryOnlyRequest, 'response_id'), 'resp_12345678');
          assert.equal(
            queryParam({ query: {}, get url() { throw new Error('request.url fallback is forbidden'); } }, 'date'),
            '',
          );
          """
          if test.count(marker) != 1:
              raise SystemExit(f'expected one insertion marker, found {test.count(marker)}')
          test_path.write_text(test.replace(marker, marker + assertions, 1))
          PY

      - name: Run focused regression checks
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          node --check api/daily-news-background.js
          node scripts/test-daily-news-editorial-validation.mjs

      - name: Verify exact intended diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('apps/web/api/daily-news-background.js').read_text()
          assert 'new URL(request.url' not in source
          assert 'export function queryParam(request, name)' in source
          test = Path('apps/web/scripts/test-daily-news-editorial-validation.mjs').read_text()
          assert "queryParam(queryOnlyRequest, 'date')" in test
          assert "request.url fallback is forbidden" in test
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'apps/web/api/daily-news-background.js' \
            'apps/web/scripts/test-daily-news-editorial-validation.mjs' | sort)"
          test "$changed" = "$expected"

      - name: Remove patcher and commit source-only result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/dep0169-branch-patcher.yml
          git config user.name "usdimpact"
          git config user.email "MIRCEA.MANAGEMENT@GMAIL.COM"
          git add apps/web/api/daily-news-background.js apps/web/scripts/test-daily-news-editorial-validation.mjs
          git diff --cached --check
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/dep0169-branch-patcher.yml' \
            'apps/web/api/daily-news-background.js' \
            'apps/web/scripts/test-daily-news-editorial-validation.mjs' | sort)"
          test "$staged" = "$expected"
          git commit -m "fix(publishing): avoid Vercel legacy request URL getter"
          git push origin "HEAD:$GITHUB_REF_NAME"
