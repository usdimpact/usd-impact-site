name: Dependency review

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publication_pr:
        description: Exact PR number from trusted Daily publication workflow
        required: true
        type: string
      publication_base_sha:
        description: Exact protected main SHA used to create the Daily PR
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fail closed unless dispatched for an exact one-file Daily PR
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.publication_pr }}
          EXPECTED_BASE: ${{ inputs.publication_base_sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_BASE" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$GITHUB_REF_NAME" =~ ^automation/daily-usd-impact-([0-9]{4}-[0-9]{2}-[0-9]{2})-([0-9]+)$ ]] || exit 1
          edition="${BASH_REMATCH[1]}"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg branch "$GITHUB_REF_NAME" --arg sha "$GITHUB_SHA" --arg base "$EXPECTED_BASE" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false
            and .head.ref == $branch and .head.sha == $sha and .head.repo.full_name == $repo
            and .base.ref == "main" and .base.sha == $base
          ' <<< "$pr" >/dev/null
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [ "$live_main" = "$EXPECTED_BASE" ] || exit 1
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"
          jq -e --arg expected "apps/web/src/content/news/${edition}.md" '
            length == 1 and .[0].filename == $expected and .[0].status == "added"
          ' <<< "$files" >/dev/null
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publication_base_sha || '' }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          fail-on-severity: high
          fail-on-scopes: runtime,development
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 60
          show-patched-versions: true