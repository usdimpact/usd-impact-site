name: Isolated devalue 5.9.3 preflight

on:
  push:
    branches: [agent/devalue-preflight-20260921]
    paths: ['.github/workflows/devalue-preflight-20260921.yml']

permissions:
  contents: read

concurrency:
  group: isolated-devalue-preflight-20260921
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'usdimpact/usd-impact-site'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.export.outputs.candidate }}
      blob: ${{ steps.export.outputs.blob }}
    env:
      CI: 'true'
      ASTRO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Checkout approved immutable base, not runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: f7850e7af232a30b58d764e73a4c0a0ae4d186cc
          persist-credentials: false
      - name: Setup required Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - name: Verify source and non-deployment boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = f7850e7af232a30b58d764e73a4c0a0ae4d186cc
          test "$(git hash-object apps/web/package-lock.json)" = 36fb10be631e07fb145b2373147ea6c12e43623a
          test "$(git hash-object apps/web/package.json)" = 3faf7c817eafc7fb822c2589049839e5ce3cdaa6
          test ! -e .github/workflows/devalue-preflight-20260921.yml
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          assert.match(process.version, /^v24\./);
          const r = await fetch('https://api.github.com/repos/usdimpact/usd-impact-site/git/ref/heads/main', {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          assert.equal(r.status, 200);
          assert.equal((await r.json()).object.sha, 'f7850e7af232a30b58d764e73a4c0a0ae4d186cc', 'Main drift: stop');
          const config = JSON.parse(fs.readFileSync('apps/web/vercel.json'));
          assert.equal(config.git.deploymentEnabled['agent/*'], false);
          fs.mkdirSync(`${process.env.RUNNER_TEMP}/devalue-evidence`);
          fs.copyFileSync('apps/web/package-lock.json', `${process.env.RUNNER_TEMP}/original-lock.json`);
          fs.copyFileSync('apps/web/package.json', `${process.env.RUNNER_TEMP}/original-package.json`);
          console.log('Approved base/blob, Node 24 and deployment-disabled runner branch verified.');
          NODE
          node --version
          npm --version
      - name: Resolve from npm and verify one-package scope and tarball integrity
        working-directory: apps/web
        run: |
          set -eu
          npm view devalue@5.9.3 --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/devalue-evidence/registry.json"
          npm update devalue --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm pack devalue@5.9.3 --ignore-scripts --json --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/devalue-evidence/pack.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const tmp = process.env.RUNNER_TEMP;
          const original = JSON.parse(fs.readFileSync(`${tmp}/original-lock.json`));
          const candidate = JSON.parse(fs.readFileSync('package-lock.json'));
          const metadata = JSON.parse(fs.readFileSync(`${tmp}/devalue-evidence/registry.json`));
          const packed = JSON.parse(fs.readFileSync(`${tmp}/devalue-evidence/pack.json`));
          assert.equal(metadata.name, 'devalue');
          assert.equal(metadata.version, '5.9.3');
          assert.equal(packed.length, 1);
          assert.equal(packed[0].filename, 'devalue-5.9.3.tgz');
          assert.equal(original.packages['node_modules/devalue'].version, '5.8.2');
          assert.equal(original.packages['node_modules/astro'].dependencies.devalue, '^5.8.1');
          const entry = candidate.packages['node_modules/devalue'];
          assert.equal(entry.version, '5.9.3', 'Approved exact version only');
          assert.equal(entry.resolved, 'https://registry.npmjs.org/devalue/-/devalue-5.9.3.tgz');
          assert.equal(entry.resolved, metadata.dist.tarball);
          assert.match(entry.integrity, /^sha512-[A-Za-z0-9+/]+=*$/);
          assert.equal(entry.integrity, metadata.dist.integrity);
          assert.equal(entry.integrity, packed[0].integrity);
          const tarball = fs.readFileSync(`${tmp}/devalue-5.9.3.tgz`);
          assert.equal(`sha512-${createHash('sha512').update(tarball).digest('base64')}`, entry.integrity);
          delete original.packages['node_modules/devalue'];
          delete candidate.packages['node_modules/devalue'];
          assert.deepEqual(candidate, original, 'Unrelated lockfile change: stop');
          assert.deepEqual(fs.readFileSync('package.json'), fs.readFileSync(`${tmp}/original-package.json`));
          assert.deepEqual(metadata.dependencies ?? {}, {});
          for (const key of ['preinstall', 'install', 'postinstall']) assert.equal(metadata.scripts?.[key], undefined);
          console.log(JSON.stringify({ approvedVersion: entry.version, integrity: entry.integrity, packagesChanged: ['node_modules/devalue'], manifestUnchanged: true, tarballVerified: true }));
          NODE
          test "$(git diff --name-only)" = apps/web/package-lock.json
          git diff --check
          git diff -- package-lock.json > "$RUNNER_TEMP/devalue-evidence/lockfile.diff"
          cat "$RUNNER_TEMP/devalue-evidence/lockfile.diff"
      - name: Strict install and complete audit
        working-directory: apps/web
        run: |
          set -eu
          npm ci --no-audit --no-fund --strict-allow-scripts
          npm ls devalue --all
          audit_exit=0
          npm audit --json --audit-level=low > "$RUNNER_TEMP/devalue-evidence/audit.json" || audit_exit=$?
          AUDIT_EXIT="$audit_exit" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/devalue-evidence/audit.json`));
          assert.equal(report.error, undefined, 'Audit unavailable');
          assert.equal(typeof report.metadata?.vulnerabilities?.total, 'number');
          console.log(JSON.stringify({ auditExit: process.env.AUDIT_EXIT, vulnerabilities: report.metadata.vulnerabilities }));
          assert.equal(report.metadata.vulnerabilities.total, 0, 'Any remaining finding requires separate review');
          assert.equal(process.env.AUDIT_EXIT, '0');
          assert.equal(JSON.parse(fs.readFileSync('node_modules/devalue/package.json')).version, '5.9.3');
          NODE
          npm audit signatures
      - name: Isolated application tests and full build
        working-directory: apps/web
        run: |
          set -eu
          cat > "$RUNNER_TEMP/no-external-network.cjs" <<'NODE'
          const net = require('node:net');
          const tls = require('node:tls');
          const { syncBuiltinESMExports } = require('node:module');
          function reject() { throw new Error('External network disabled during isolated dependency tests'); }
          function local(args) {
            const first = args[0];
            if (first && typeof first === 'object') {
              if (first.path) return true;
              return ['127.0.0.1', '::1', 'localhost'].includes(first.host ?? first.hostname ?? 'localhost');
            }
            if (typeof first === 'string' && !/^\d+$/.test(first)) return first.startsWith('/');
            return ['127.0.0.1', '::1', 'localhost'].includes(typeof args[1] === 'string' ? args[1] : 'localhost');
          }
          const connect = net.Socket.prototype.connect;
          net.Socket.prototype.connect = function(...args) { if (!local(args)) reject(); return connect.apply(this, args); };
          const tlsConnect = tls.connect;
          tls.connect = function(...args) { if (!local(args)) reject(); return tlsConnect.apply(this, args); };
          const fetchOriginal = globalThis.fetch;
          globalThis.fetch = function(input, options) {
            const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url);
            if (!['localhost', '127.0.0.1', '[::1]'].includes(url.hostname)) reject();
            return fetchOriginal(input, options);
          };
          syncBuiltinESMExports();
          NODE
          export NODE_OPTIONS="--require=$RUNNER_TEMP/no-external-network.cjs"
          node scripts/test-github-action-runtimes.mjs
          npm run validate
          npm run build
      - name: Export tested immutable candidate
        id: export
        working-directory: apps/web
        run: |
          set -eu
          test "$(git diff --name-only)" = apps/web/package-lock.json
          test "$(git hash-object package.json)" = 3faf7c817eafc7fb822c2589049839e5ce3cdaa6
          git diff --check
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          import { gzipSync } from 'node:zlib';
          const bytes = fs.readFileSync('package-lock.json');
          const blob = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          const candidate = gzipSync(bytes).toString('base64');
          assert.ok(candidate.length < 60000);
          const evidence = { base: 'f7850e7af232a30b58d764e73a4c0a0ae4d186cc', originalBlob: '36fb10be631e07fb145b2373147ea6c12e43623a', candidateBlob: blob, sha256: createHash('sha256').update(bytes).digest('hex'), node: process.version, tests: 'npm run validate AND npm run build PASS with external network guard', runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/devalue-evidence/evidence.json`, JSON.stringify(evidence, null, 2));
          fs.copyFileSync('package-lock.json', `${process.env.RUNNER_TEMP}/devalue-evidence/package-lock.json`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate=${candidate}\nblob=${blob}\n`);
          console.log(JSON.stringify(evidence));
          NODE
      - name: Retain evidence, including failure diagnostics when present
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: isolated-devalue-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/devalue-evidence/
          if-no-files-found: warn
          retention-days: 7

  store-blob:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Store validated data blob only, without checkout or ref mutation
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK_GZIP: ${{ needs.verify.outputs.candidate }}
          EXPECTED_BLOB: ${{ needs.verify.outputs.blob }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const api = 'https://api.github.com/repos/usdimpact/usd-impact-site';
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' };
          async function get(path) {
            const response = await fetch(`${api}${path}`, { headers, redirect: 'error', signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, 200);
            return response.json();
          }
          assert.equal(process.env.GITHUB_REPOSITORY, 'usdimpact/usd-impact-site');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/agent/devalue-preflight-20260921');
          assert.equal((await get('/git/ref/heads/main')).object.sha, 'f7850e7af232a30b58d764e73a4c0a0ae4d186cc', 'Main drift: do not store');
          assert.match(process.env.EXPECTED_BLOB, /^[a-f0-9]{40}$/);
          assert.ok(process.env.LOCK_GZIP.length < 60000);
          const bytes = gunzipSync(Buffer.from(process.env.LOCK_GZIP, 'base64'), { maxOutputLength: 1048576 });
          const sha = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
          assert.equal(sha, process.env.EXPECTED_BLOB);
          const originalBlob = await get('/git/blobs/36fb10be631e07fb145b2373147ea6c12e43623a');
          assert.equal(originalBlob.encoding, 'base64');
          const original = JSON.parse(Buffer.from(originalBlob.content, 'base64'));
          const candidate = JSON.parse(bytes);
          assert.equal(candidate.packages['node_modules/devalue'].version, '5.9.3');
          assert.equal(original.packages['node_modules/devalue'].version, '5.8.2');
          delete original.packages['node_modules/devalue'];
          delete candidate.packages['node_modules/devalue'];
          assert.deepEqual(candidate, original);
          const response = await fetch(`${api}/git/blobs`, {
            method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({ encoding: 'base64', content: bytes.toString('base64') }),
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          assert.equal(response.status, 201);
          const result = await response.json();
          assert.equal(result.sha, sha);
          console.log(JSON.stringify({ storedBlob: result.sha, bytes: bytes.length, sourceBase: 'f7850e7af232a30b58d764e73a4c0a0ae4d186cc', refsChanged: false, commitsCreated: false, pullRequestsCreated: false }));
          NODE
