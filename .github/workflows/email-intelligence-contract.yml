name: Email intelligence contract

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/weekly-newsletter-contract.js'
      - 'apps/web/src/lib/progress-email-contract.js'
      - 'apps/web/scripts/test-weekly-newsletter-contract.mjs'
      - 'apps/web/scripts/test-progress-email-contract.mjs'
      - 'apps/web/src/content.config.ts'
      - 'apps/web/src/content/weekly-reports/**'
      - 'apps/web/src/lib/learning-journey.js'
      - '.github/workflows/email-intelligence-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/weekly-newsletter-contract.js'
      - 'apps/web/src/lib/progress-email-contract.js'
      - 'apps/web/scripts/test-weekly-newsletter-contract.mjs'
      - 'apps/web/scripts/test-progress-email-contract.mjs'
      - 'apps/web/src/content.config.ts'
      - 'apps/web/src/content/weekly-reports/**'
      - 'apps/web/src/lib/learning-journey.js'
      - '.github/workflows/email-intelligence-contract.yml'

permissions:
  contents: read

jobs:
  email-intelligence-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Syntax checks
        run: |
          node --check src/lib/weekly-newsletter-contract.js
          node --check src/lib/progress-email-contract.js

      - name: Weekly newsletter contract
        run: node scripts/test-weekly-newsletter-contract.mjs

      - name: Progress email contract
        run: node scripts/test-progress-email-contract.mjs

      - name: Weekly report source validation
        run: npm run validate:reports
