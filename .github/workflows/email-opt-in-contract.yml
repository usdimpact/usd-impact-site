name: Email opt-in contract

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/marketing-opt-in-token.js'
      - 'apps/web/scripts/test-marketing-opt-in-token.mjs'
      - '.github/workflows/email-opt-in-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/marketing-opt-in-token.js'
      - 'apps/web/scripts/test-marketing-opt-in-token.mjs'
      - '.github/workflows/email-opt-in-contract.yml'

permissions:
  contents: read

jobs:
  email-opt-in-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Syntax check
        run: node --check src/lib/marketing-opt-in-token.js

      - name: Marketing opt-in token contract
        run: node scripts/test-marketing-opt-in-token.mjs
