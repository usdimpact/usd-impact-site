name: Governed email PostgREST opaque-key header contracts

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/weekly-newsletter-dispatch.js'
      - 'apps/web/src/lib/progress-email-dispatch.js'
      - 'apps/web/src/lib/marketing-email-preferences.js'
      - 'apps/web/scripts/test-weekly-newsletter-dispatch.mjs'
      - 'apps/web/scripts/test-progress-email-dispatch.mjs'
      - 'apps/web/scripts/test-marketing-email-preferences.mjs'
      - '.github/workflows/email-postgrest-opaque-headers.yml'

permissions:
  contents: read

jobs:
  offline-email-rest-header-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Offline source syntax and guarded dispatch contracts
        run: |
          node --check src/lib/weekly-newsletter-dispatch.js
          node --check src/lib/progress-email-dispatch.js
          node --check src/lib/marketing-email-preferences.js
          node --check scripts/test-weekly-newsletter-dispatch.mjs
          node --check scripts/test-progress-email-dispatch.mjs
          node --check scripts/test-marketing-email-preferences.mjs
          node scripts/test-weekly-newsletter-dispatch.mjs
          node scripts/test-progress-email-dispatch.mjs
          node scripts/test-marketing-email-preferences.mjs
