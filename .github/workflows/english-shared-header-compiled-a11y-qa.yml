name: English shared-header compiled accessibility QA (Draft only)

on:
  pull_request:
    paths:
      - '.github/workflows/english-shared-header-compiled-a11y-qa.yml'
      - 'apps/web/scripts/test-english-shared-nav-preview-qa.py'

permissions:
  contents: read

concurrency:
  group: english-header-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  english-header-qa:
    if: ${{ github.event.pull_request.draft == true && github.head_ref == 'agent/english-header-a11y-qa-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Draft source without persisted Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use repository-pinned Node major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact-lock dependencies
        working-directory: apps/web
        run: npm ci --strict-allow-scripts --no-audit --no-fund
      - name: Build actual Preview-only Astro HTML and CSS
        working-directory: apps/web
        env:
          VERCEL_ENV: preview
          PUBLIC_GA4_MEASUREMENT_ID: G-TEST1234
          CI: 'true'
        run: |
          set -euo pipefail
          npm run prepare:fonts
          npm run generate:quizzes
          npx --no-install astro build
      - name: Install pinned Python Playwright with system Chrome
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/english-header-qa-venv"
          "$RUNNER_TEMP/english-header-qa-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir playwright==1.57.0
          command -v google-chrome || command -v chromium
      - name: Test English navigation, Escape and skip focus at 320-1440px
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/english-header-qa-venv/bin/python" apps/web/scripts/test-english-shared-nav-preview-qa.py
      - name: Upload short-retention sanitized QA screenshots and JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: english-header-a11y-compiled-draft
          path: apps/web/english-header-a11y-evidence/
          if-no-files-found: warn
          retention-days: 2
