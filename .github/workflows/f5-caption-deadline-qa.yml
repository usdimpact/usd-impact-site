name: F5 optional caption deadline isolated QA

# Isolated owner-review branch only. Never deploys or touches live accounts.
on:
  push:
    branches:
      - agent/f5-caption-deadline-review-20261101

permissions:
  contents: read

jobs:
  synthetic-caption-deadline:
    name: F5 bounded caption and paid-video fallback (no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout source with no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7
        with:
          persist-credentials: false
      - name: Use pinned Node.js major
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pinned v7
        with:
          node-version: 24.x
      - name: Syntax check patched handler and test source
        run: |
          node --check src/lib/media-locale-handler.js
          node --check scripts/test-media-locale.mjs
          node --check scripts/test-video-library-function.mjs
      - name: Run actual code with fake identities and no provider secrets
        run: |
          node scripts/test-media-locale.mjs
          node scripts/test-video-library-function.mjs
