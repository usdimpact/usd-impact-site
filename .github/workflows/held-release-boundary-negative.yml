name: Held release-boundary negative checks

# Always report a single stable job on every PR. Avoid path-filter deadlocks
# before an owner separately decides whether to require this context on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fail-closed-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Plan exact-merge security validation route
        id: plan
        run: |
          node --check scripts/held-release-ci-plan.mjs
          node scripts/test-held-release-ci-plan.mjs
          node scripts/held-release-ci-plan.mjs
      - name: Always verify held sources and malicious release/rights fixtures
        run: |
          node --check scripts/held-release-boundary.mjs
          node --check scripts/test-held-release-boundary.mjs
          node scripts/test-held-release-boundary.mjs
          node scripts/held-release-boundary.mjs
          node --check scripts/score-held-report-source-guard.mjs
          node --check scripts/test-score-held-report-source-guard.mjs
          node scripts/test-score-held-report-source-guard.mjs
          node scripts/score-held-report-source-guard.mjs
          node --check scripts/score-held-build-closure.mjs
          node --check scripts/test-score-held-build-closure.mjs
          node scripts/test-score-held-build-closure.mjs
          node scripts/score-held-build-closure.mjs
      - name: Install existing locked dependencies for source-impacting PR
        if: steps.plan.outputs.build != 'false'
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Build and inspect Production classification (no remote deployment)
        if: steps.plan.outputs.build != 'false'
        env:
          VERCEL_ENV: production
        run: |
          rm -rf dist
          npm run build
          node scripts/held-release-boundary.mjs --built production
          node scripts/score-held-report-source-guard.mjs --built
      - name: Build and inspect Preview classification (no remote deployment)
        if: steps.plan.outputs.build != 'false'
        env:
          VERCEL_ENV: preview
        run: |
          rm -rf dist
          npm run build
          node scripts/held-release-boundary.mjs --built preview
          node scripts/score-held-report-source-guard.mjs --built
