name: IndexNow after Production

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/content/**'

permissions:
  contents: read

concurrency:
  group: indexnow-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.USDIMPACT_WATCHDOG_VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.USDIMPACT_WATCHDOG_VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.USDIMPACT_WATCHDOG_VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Wait for exact commit to be live in Vercel Production
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ] || [ -z "${VERCEL_TEAM_ID:-}" ]; then
            echo "Required read-only Vercel watchdog configuration is unavailable."
            exit 1
          fi

          expected="${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            payload="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v13/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=5&teamId=${VERCEL_TEAM_ID}")"

            state="$(printf '%s' "$payload" | node --input-type=module -e '
              let data="";
              for await (const chunk of process.stdin) data += chunk;
              const json=JSON.parse(data);
              const deployment=(json.deployments || []).find((item) =>
                (item?.meta?.githubCommitSha || item?.gitSource?.sha) === process.env.EXPECTED
              );
              process.stdout.write(deployment?.state || deployment?.readyState || "");
            ' EXPECTED="$expected")"

            if [ "$state" = "READY" ] || [ "$state" = "ready" ]; then
              echo "Exact commit is READY in Production."
              exit 0
            fi

            sleep 10
          done

          echo "Exact commit did not become READY in Production within the bounded verification window."
          exit 1

      - name: Resolve changed content files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}" -- 'apps/web/src/content/**' > /tmp/indexnow-files.txt
          {
            echo 'files<<EOF'
            cat /tmp/indexnow-files.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Notify IndexNow for live changed URLs
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/indexnow-files.txt
          node scripts/submit-indexnow-after-production.mjs "${files[@]}"
