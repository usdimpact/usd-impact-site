name: IndexNow after Production

on:
  repository_dispatch:
    types:
      - vercel.deployment.success

permissions:
  contents: read

concurrency:
  group: indexnow-production-${{ github.event.client_payload.git.sha }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.git.ref == 'main' &&
      github.event.client_payload.project.id == 'prj_ZoLLM35ksI6wk17PcfS2xYknaVl7' &&
      github.event.client_payload.git.sha != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DEPLOY_SHA: ${{ github.event.client_payload.git.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.client_payload.git.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact deployed commit
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPLOY_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "Invalid deployment SHA."; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Resolve changed content files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$DEPLOY_SHA^" "$DEPLOY_SHA" -- \
            'apps/web/src/content/news/**' \
            'apps/web/src/content/catalyst-briefs/**' \
            'apps/web/src/content/weekly-reports/**' \
            'apps/web/src/content/monthly-reports/**' > /tmp/indexnow-files.txt
          {
            echo 'files<<EOF'
            cat /tmp/indexnow-files.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Notify IndexNow for live changed URLs
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < /tmp/indexnow-files.txt
          node scripts/submit-indexnow-after-production.mjs "${files[@]}"
