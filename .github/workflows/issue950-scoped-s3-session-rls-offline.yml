name: Issue950 scoped JWT S3 restore policies - isolated RLS

on:
  pull_request:
    paths:
      - 'docs/operations/candidates/issue950-s3-jwt-session-*.review.sql'
      - 'docs/operations/candidates/issue950-pdf-only-*.review.sql'
      - 'docs/operations/candidates/issue950-pdf-only-offline-source-preflight.review.ps1'
      - 'docs/operations/candidates/issue950-pdf-only-rest-envelope-preflight.review.ps1'
      - 'docs/operations/issue950-pdf-only-restore-upsert-pilot-review-2026-10-30.md'
      - 'docs/operations/issue950-owner-operated-single-pdf-go-no-go-2026-10-30.md'
      - 'apps/web/scripts/test-issue950-scoped-s3-jwt-rls-pglite.mjs'
      - 'apps/web/scripts/test-account-deletion-review-only-activation.mjs'
      - '.github/workflows/issue950-scoped-s3-session-rls-offline.yml'

permissions:
  contents: read

jobs:
  synthetic-source-restore-privilege-separation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout without saved GitHub credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24 locked
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Require no provider, Auth, email, Storage or S3 credentials
        run: |
          test -z "${SUPABASE_SECRET_KEY:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${AWS_SESSION_TOKEN:-}"
          test -z "${RESEND_API_KEY:-}"
          test -z "${CRON_SECRET:-}"
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: RLS and immutable manifest positive/negative tests
        run: |
          node --check scripts/test-issue950-scoped-s3-jwt-rls-pglite.mjs
          node scripts/test-issue950-scoped-s3-jwt-rls-pglite.mjs
          node scripts/test-account-deletion-review-only-activation.mjs
      - name: Offline owner PDF preflight must fail closed without original file
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'issue950-fixture-not-real.pdf'
          $script = Join-Path $env:GITHUB_WORKSPACE 'docs/operations/candidates/issue950-pdf-only-offline-source-preflight.review.ps1'
          Set-Content -LiteralPath $probe -Value '%PDF-1.4 disposable fake content' -Encoding ascii
          function MustStop([string] $source, [string] $project, [string] $expect) {
            $actual = $null
            try {
              & $script -SourcePdf $source -DestinationProjectRef $project | Out-Null
            } catch {
              $actual = $_.Exception.Message
            }
            if ($actual -cne $expect) {
              throw 'Offline preflight did not stop at the expected validation gate'
            }
          }
          MustStop $probe 'gjzetjugmnwanvjkchux' 'STOP: destination project ref is not the isolated restore'
          MustStop ($probe + '.missing') 'movnekagnxgcyenczfoc' 'STOP: local PDF source file is missing'
          MustStop $probe 'movnekagnxgcyenczfoc' 'STOP: PDF size mismatch'
          Remove-Item -LiteralPath $probe
          Write-Output 'Issue950 PowerShell wrong-project/missing-source/wrong-byte negative fixtures PASS; zero network calls.'
      - name: REST client request-envelope cannot run on wrong target or broad credentials
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'docs/operations/candidates/issue950-pdf-only-rest-envelope-preflight.review.ps1'
          $source = Get-Content -LiteralPath $script -Raw
          if ($source -match 'Invoke-WebRequest|Invoke-RestMethod|SendAsync|GetAsync|PostAsync|Start-Process|WebClient|WebRequest.Create') {
            throw 'Review-only REST envelope must contain no network transport execution'
          }
          if ($source -notmatch 'HttpClientHandler' -or $source -notmatch 'AllowAutoRedirect') {
            throw 'REST envelope must explicitly require redirect refusal'
          }
          $probe = Join-Path $env:RUNNER_TEMP 'issue950-offline-envelope-not-real.pdf'
          Set-Content -LiteralPath $probe -Value '%PDF-1.4 fake offline fixture' -Encoding ascii
          function MustStop([string] $sourceFile, [string] $project, [string] $expected) {
            $actual = $null
            try {
              & $script -SourcePdf $sourceFile -DestinationProjectRef $project | Out-Null
            } catch {
              $actual = $_.Exception.Message
            }
            if ($actual -cne $expected) {
              throw 'REST envelope unexpectedly accepted a prohibited fixture'
            }
          }
          MustStop $probe 'gjzetjugmnwanvjkchux' 'STOP: non-restore project'
          MustStop ($probe + '.missing') 'movnekagnxgcyenczfoc' 'STOP: original PDF unavailable'
          MustStop $probe 'movnekagnxgcyenczfoc' 'STOP: original PDF byte length mismatch'
          $env:SUPABASE_SERVICE_ROLE_KEY = 'offline-fixture-placeholder-not-a-key'
          try {
            MustStop $probe 'movnekagnxgcyenczfoc' 'STOP: broad credential environment variable is present'
          } finally {
            Remove-Item Env:SUPABASE_SERVICE_ROLE_KEY
          }
          Remove-Item -LiteralPath $probe
          Write-Output 'Issue950 REST client envelope negative fixtures PASS; no network, JWT, PDF upload, or secrets.'
