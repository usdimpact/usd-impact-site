name: Newsletter Preview readiness

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/newsletter-preview-readiness.js'
      - 'apps/web/src/lib/newsletter-preview-readiness-handler.js'
      - 'apps/web/scripts/test-newsletter-preview-readiness.mjs'
      - 'apps/web/scripts/test-newsletter-preview-readiness-handler.mjs'
      - 'apps/web/src/lib/marketing-opt-in-handler.js'
      - 'apps/web/src/lib/weekly-newsletter-qa-batch.js'
      - 'apps/web/src/lib/progress-email-qa-batch.js'
      - 'apps/web/scripts/test-marketing-opt-in-handler.mjs'
      - 'apps/web/scripts/test-weekly-newsletter-qa-batch.mjs'
      - 'apps/web/scripts/test-progress-email-qa-batch.mjs'
      - '.github/workflows/newsletter-preview-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newsletter-preview-readiness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Syntax checks
        run: |
          node --check src/lib/newsletter-preview-readiness.js
          node --check src/lib/newsletter-preview-readiness-handler.js
          node --check scripts/test-newsletter-preview-readiness.mjs
          node --check scripts/test-newsletter-preview-readiness-handler.mjs

      - name: Preview readiness contract
        run: node scripts/test-newsletter-preview-readiness.mjs

      - name: Protected readiness handler contract
        run: node scripts/test-newsletter-preview-readiness-handler.mjs

      - name: Opt-in handler regression
        run: node scripts/test-marketing-opt-in-handler.mjs

      - name: Weekly QA regression
        run: node scripts/test-weekly-newsletter-qa-batch.mjs

      - name: Progress QA regression
        run: node scripts/test-progress-email-qa-batch.mjs

      - name: Production build
        run: npm run build
