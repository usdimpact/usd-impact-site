name: October Monthly compiled keyboard focus QA (Draft, loopback only)

on:
  pull_request:
    paths:
      - '.github/workflows/october-monthly-compiled-keyboard-qa.yml'
      - 'apps/web/scripts/test-october-monthly-compiled-keyboard-focus.py'

permissions:
  contents: read

concurrency:
  group: october-monthly-compiled-focus-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  monthly-focus:
    if: ${{ github.event.pull_request.draft == true && github.head_ref == 'agent/october-monthly-natural-textspacing-qa-20261105' }}
    name: Actual compiled October Monthly skip/main/footer focus in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read-only source checkout, no persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use pinned project Node.js major version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact-lock dependencies
        working-directory: apps/web
        run: npm ci --strict-allow-scripts --no-audit --no-fund
      - name: Build generated Preview-only October Monthly HTML and CSS
        working-directory: apps/web
        env:
          VERCEL_ENV: preview
          PUBLIC_GA4_MEASUREMENT_ID: G-TEST1234
          CI: 'true'
        run: |
          set -euo pipefail
          npm run prepare:fonts
          npm run generate:quizzes
          npx --no-install astro build
          node scripts/test-independent-macro-monthly-preview.mjs --built
      - name: Install isolated Playwright driver, no browser download
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/october-monthly-focus-venv"
          "$RUNNER_TEMP/october-monthly-focus-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir playwright==1.57.0
          command -v google-chrome || command -v chromium
      - name: Verify native keyboard main and footer focus at 320, 390, 768, 1440
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/october-monthly-focus-venv/bin/python" apps/web/scripts/test-october-monthly-compiled-keyboard-focus.py
      - name: Upload short-lived sanitized keyboard screenshots and JSON
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: october-monthly-focus-compiled-draft
          path: apps/web/october-monthly-focus-evidence/
          if-no-files-found: warn
          retention-days: 14

  current-main-integration-smoke:
    if: ${{ github.event.pull_request.draft == true && github.head_ref == 'agent/october-monthly-natural-textspacing-qa-20261105' }}
    name: Ephemeral current-main + F1d Monthly build, 4 widths, Production absent
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Read-only checkout of QA script at this exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read-only checkout of protected main snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 91ebcb7e8fce2bc52514a3df3132f7ff805f7a6f
          path: integration/main
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only checkout of held F1d child of Monthly #1088
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 454bcdee6bc61aa9749f1efb879f2b58c6f22513
          path: integration/f1d
          fetch-depth: 0
          persist-credentials: false
      - name: Simulate merge only inside ephemeral runner, verify exact approved article
        shell: bash
        run: |
          set -euo pipefail
          main='91ebcb7e8fce2bc52514a3df3132f7ff805f7a6f'
          held='454bcdee6bc61aa9749f1efb879f2b58c6f22513'
          article='apps/web/src/pages/macro-reviews/monthly/[period]/index.astro'
          test "$(git -C integration/main rev-parse HEAD)" = "$main"
          test "$(git -C integration/f1d rev-parse HEAD)" = "$held"
          test "$(git -C integration/f1d rev-parse "HEAD:$article")" = '35afff7c29034678b0040259639930aa7a4136be'
          git -C integration/main -c protocol.file.allow=always fetch --no-tags "$GITHUB_WORKSPACE/integration/f1d" HEAD
          git -C integration/main -c user.name='Ephemeral CI' -c user.email='ci@example.invalid' merge --no-commit --no-ff FETCH_HEAD
          test "$(git -C integration/main rev-parse HEAD)" = "$main"
          test "$(git -C integration/main rev-parse --verify MERGE_HEAD)" = "$held"
          test "$(git -C integration/main hash-object "$article")" = '35afff7c29034678b0040259639930aa7a4136be'
          echo 'EPHEMERAL_MERGE_PASS base=91ebcb7e f1d=454bcdee article=35afff7c no_push=true'
      - name: Guard unchanged existing Daily and free Weekly source across simulated merge
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            'apps/web/src/pages/news/index.astro' \
            'apps/web/src/pages/news/[date].astro' \
            'apps/web/src/content/news/2026-11-03.md' \
            'apps/web/src/content/news/2026-11-04.md' \
            'apps/web/src/pages/macro-reviews/weekly/2026-10-30/index.astro' \
            'apps/web/src/pages/news/feed.xml.js' \
            'apps/web/src/pages/news/latest.json.js'; do
            expected_blob="$(git -C integration/main rev-parse "HEAD:$path")"
            merged_blob="$(git -C integration/main hash-object "$path")"
            test "$expected_blob" = "$merged_blob" || {
              echo "ERROR: existing published source changed during held merge: $path" >&2
              exit 1
            }
          done
          echo 'EPHEMERAL_DAILY_WEEKLY_SOURCE_PARITY_PASS paths=7'
      - name: Use pinned project Node.js major version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: integration/main/apps/web/package-lock.json
      - name: Install exact-lock dependencies on ephemeral combined tree
        working-directory: integration/main/apps/web
        run: npm ci --strict-allow-scripts --no-audit --no-fund
      - name: Verify combined source guard and Preview-only compiled Monthly
        working-directory: integration/main/apps/web
        env:
          VERCEL_ENV: preview
          PUBLIC_GA4_MEASUREMENT_ID: G-TEST1234
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-independent-macro-monthly-preview.mjs
          node scripts/test-held-release-boundary.mjs
          npm run prepare:fonts
          npm run generate:quizzes
          npx --no-install astro build
          node scripts/test-independent-macro-monthly-preview.mjs --built
      - name: Confirm existing public Daily and Weekly pages render in combined Preview
        working-directory: integration/main/apps/web
        shell: bash
        run: |
          set -euo pipefail
          for page in \
            news/index.html \
            news/2026-11-03/index.html \
            news/2026-11-04/index.html \
            macro-reviews/weekly/2026-10-30/index.html; do
            test -f "dist/$page" || {
              echo "ERROR: expected existing public page missing in Preview: $page" >&2
              exit 1
            }
          done
          grep -Fq 'Read the market through the dollar.' dist/news/index.html
          grep -Fq 'Daily USD Impact' dist/news/2026-11-03/index.html
          grep -Fq 'Daily USD Impact' dist/news/2026-11-04/index.html
          grep -Fq 'USD Impact Macro Weekly Review' dist/macro-reviews/weekly/2026-10-30/index.html
          echo 'EPHEMERAL_PREVIEW_DAILY_WEEKLY_RENDER_PASS pages=4'
      - name: Install isolated Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/monthly-merge-focus-venv"
          "$RUNNER_TEMP/monthly-merge-focus-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir playwright==1.57.0
          command -v google-chrome || command -v chromium
      - name: Run actual keyboard and focus in combined compiled page at four widths
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cp apps/web/scripts/test-october-monthly-compiled-keyboard-focus.py integration/main/apps/web/scripts/test-october-monthly-compiled-keyboard-focus.py
          "$RUNNER_TEMP/monthly-merge-focus-venv/bin/python" integration/main/apps/web/scripts/test-october-monthly-compiled-keyboard-focus.py
      - name: Verify combined Production build omits October Monthly
        working-directory: integration/main/apps/web
        env:
          VERCEL_ENV: production
          PUBLIC_GA4_MEASUREMENT_ID: G-TEST1234
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install astro build
          node scripts/test-independent-macro-monthly-preview.mjs --built
          test ! -e dist/macro-reviews/monthly/2026-10/index.html
          test ! -e dist/macro-reviews/monthly/2026-11/index.html
          echo 'EPHEMERAL_PRODUCTION_EXCLUSION_PASS'
      - name: Confirm existing public Daily and Weekly pages render in combined Production
        working-directory: integration/main/apps/web
        shell: bash
        run: |
          set -euo pipefail
          for page in \
            news/index.html \
            news/2026-11-03/index.html \
            news/2026-11-04/index.html \
            macro-reviews/weekly/2026-10-30/index.html; do
            test -f "dist/$page" || {
              echo "ERROR: expected existing public page missing in Production: $page" >&2
              exit 1
            }
          done
          grep -Fq 'Read the market through the dollar.' dist/news/index.html
          grep -Fq 'Daily USD Impact' dist/news/2026-11-03/index.html
          grep -Fq 'Daily USD Impact' dist/news/2026-11-04/index.html
          grep -Fq 'USD Impact Macro Weekly Review' dist/macro-reviews/weekly/2026-10-30/index.html
          test ! -e dist/macro-reviews/monthly/2026-10/index.html
          echo 'EPHEMERAL_PRODUCTION_DAILY_WEEKLY_RENDER_PASS pages=4 monthly_absent=true'
      - name: Preserve sanitized compiled merged-view screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: october-monthly-current-main-merge-qa-only
          path: integration/main/apps/web/october-monthly-focus-evidence/
          if-no-files-found: warn
          retention-days: 14
