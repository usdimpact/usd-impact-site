name: Opt-in delivery and unsubscribe opaque-key contracts

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/marketing-opt-in-delivery.js'
      - 'apps/web/src/lib/waitlist-unsubscribe.js'
      - 'apps/web/scripts/test-marketing-opt-in-delivery.mjs'
      - 'apps/web/scripts/test-waitlist-unsubscribe.mjs'
      - '.github/workflows/optin-unsubscribe-rest-opaque-headers.yml'

permissions:
  contents: read

jobs:
  offline-optin-and-unsubscribe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout reviewed source without Git credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Syntax and offline double-opt-in/withdrawal contracts
        run: |
          node --check src/lib/marketing-opt-in-delivery.js
          node --check src/lib/waitlist-unsubscribe.js
          node --check scripts/test-marketing-opt-in-delivery.mjs
          node --check scripts/test-waitlist-unsubscribe.mjs
          node scripts/test-marketing-opt-in-delivery.mjs
          node scripts/test-waitlist-unsubscribe.mjs
          node scripts/test-waitlist-unsubscribe-email-integration.mjs
