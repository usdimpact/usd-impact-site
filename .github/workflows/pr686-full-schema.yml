name: PR686 full-table-contract storage suite
on:
  push:
    branches: [agent/pr686-isolated-runner-20260922]
    paths: [.github/workflows/pr686-full-schema.yml]
permissions: {}
concurrency:
  group: pr686-full-schema-storage
  cancel-in-progress: false
jobs:
  full-schema:
    if: github.repository == 'usdimpact/usd-impact-site' && github.ref == 'refs/heads/agent/pr686-isolated-runner-20260922' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Prepare pinned pilot extension without application changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,urllib.request
          P=pathlib.Path
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          repo='https://raw.githubusercontent.com/usdimpact/usd-impact-site/'
          def get(url):
              with opener.open(url,timeout=30) as r:
                  b=r.read(1024*1024+1)
              if not b or len(b)>1024*1024:raise RuntimeError('INPUT_BYTE_LIMIT')
              return b
          original=get(repo+'5cbf5c53cae88b6b091921ac03b112329e77c4fe/.github/workflows/pr686-storage-pilot.yml')
          blob=hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()
          if blob!='60abe0999c1e921d9f4ba8d9f5076d8c0f7fbea1':raise RuntimeError('PINNED_WORKFLOW_MISMATCH')
          P('evidence/pinned-pilot-workflow.yml').write_bytes(original)
          lines=original.decode().splitlines();blocks=[];i=0
          while i<len(lines):
              if lines[i]=='        run: |':
                  i+=1;body=[]
                  while i<len(lines) and (not lines[i].strip() or lines[i].startswith('          ')):
                      body.append(lines[i][10:] if lines[i].startswith('          ') else '')
                      i+=1
                  blocks.append('\n'.join(body)+'\n')
              else:i+=1
          if len(blocks)!=3:raise RuntimeError('PINNED_WORKFLOW_BLOCK_COUNT')
          if blocks[2].count('REDUCED_SCHEMA_PILOT_PASS')!=1:raise RuntimeError('PINNED_COMPLETION_MARKER')
          # Reuse the exact inspected online-build/offline-container/cleanup path.
          # Only its expected completion marker changes for the expanded suite.
          blocks[2]=blocks[2].replace('REDUCED_SCHEMA_PILOT_PASS','FULL_SCHEMA_BOUNDED_SUITE_PASS')
          for n,b in enumerate(blocks):P('evidence/execution-stage-'+str(n)+'.sh').write_text(b)
          P('evidence/execution-stage-manifest.json').write_text(json.dumps({'sourceCommit':'5cbf5c53cae88b6b091921ac03b112329e77c4fe','sourceGitBlob':blob,'stageSha256':[hashlib.sha256(b.encode()).hexdigest() for b in blocks],'onlyContainerStageChange':'expected completion marker','productionMutation':False},indent=2))
          subprocess.run(['/bin/bash','-euo','pipefail','evidence/execution-stage-0.sh'],check=True,timeout=180)
          files={'upgrade_full_schema.py':('upgrade_full_schema.py','ca296ae5d7f615fe7e00fcef1088444e26ab594e7800f109090f0c01c69ac6d2'),'full-schema-input.json':('packet/full-schema-input.json','267f079643e4aa0f459f239dec3f09671ee36a1052819c0871a8198450181212'),'fix_schema_loader.py':('fix_schema_loader.py','c7170cd36e430df4137ee028998c35ee5ff82259c26ea1c175c9357433a936d9')}
          for name,(target,digest) in files.items():
              b=get(repo+os.environ['GITHUB_SHA']+'/scripts/pr686-runner/'+name)
              if hashlib.sha256(b).hexdigest()!=digest:raise RuntimeError('EXTENSION_SOURCE_MISMATCH:'+name)
              P(target).write_bytes(b)
          subprocess.run(['/usr/bin/python3','-I','-S','upgrade_full_schema.py'],check=True,timeout=10)
          subprocess.run(['/usr/bin/python3','-I','-S','fix_schema_loader.py'],check=True,timeout=10)
          subprocess.run(['/usr/bin/python3','-I','-S','-m','py_compile','packet/pilot.py'],check=True,timeout=10)
          P('evidence/executed-test-pilot.py').write_bytes(P('packet/pilot.py').read_bytes())
          P('evidence/executed-test-worker.mjs').write_bytes(P('packet/worker.mjs').read_bytes())
          P('evidence/full-schema-input.json').write_bytes(P('packet/full-schema-input.json').read_bytes())
          PY
      - name: Build and measure pinned runtime using verified pilot path
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail evidence/execution-stage-1.sh
      - name: Execute isolated full-table-contract suite and verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          bash -euo pipefail evidence/execution-stage-2.sh
      - name: Preserve actual bounded evidence without credentials or database files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr686-full-schema-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 3
