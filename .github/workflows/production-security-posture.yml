name: Production security posture

on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-security-posture.yml'
      - 'apps/web/scripts/check-production-security-posture.mjs'

permissions:
  contents: read

concurrency:
  group: production-security-posture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify live Production security posture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Verify public Production boundaries
        working-directory: apps/web
        run: node scripts/check-production-security-posture.mjs
