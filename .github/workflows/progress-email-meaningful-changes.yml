name: Progress email meaningful changes

on:
  pull_request:
    paths:
      - 'apps/web/src/data/progress-email-meaningful-changes.js'
      - 'apps/web/src/lib/progress-email-meaningful-changes.js'
      - 'apps/web/src/lib/progress-email-governed-candidate.js'
      - 'apps/web/src/content/weekly-reports/*.md'
      - 'apps/web/scripts/test-progress-email-meaningful-changes.mjs'
      - 'apps/web/scripts/test-progress-email-readiness.mjs'
      - '.github/workflows/progress-email-meaningful-changes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meaningful-changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Syntax checks
        run: |
          node --check src/data/progress-email-meaningful-changes.js
          node --check src/lib/progress-email-meaningful-changes.js
          node --check src/lib/progress-email-governed-candidate.js
          node --check scripts/test-progress-email-meaningful-changes.mjs

      - name: Governed meaningful-change registry contract
        run: node scripts/test-progress-email-meaningful-changes.mjs

      - name: Send-time readiness regression
        run: node scripts/test-progress-email-readiness.mjs

      - name: Production build
        run: npm run build
