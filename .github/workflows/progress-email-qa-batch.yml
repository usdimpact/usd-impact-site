name: Progress email QA batch

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/progress-email-qa-batch.js'
      - 'apps/web/src/lib/progress-email-qa-handler.js'
      - 'apps/web/src/lib/progress-email-dispatch.js'
      - 'apps/web/src/lib/progress-email-readiness.js'
      - 'apps/web/src/lib/progress-email-governed-candidate.js'
      - 'apps/web/scripts/test-progress-email-qa-batch.mjs'
      - 'apps/web/scripts/test-progress-email-qa-handler.mjs'
      - 'apps/web/scripts/test-progress-email-dispatch.mjs'
      - '.github/workflows/progress-email-qa-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progress-email-qa-batch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Syntax checks
        run: |
          node --check src/lib/progress-email-qa-batch.js
          node --check src/lib/progress-email-qa-handler.js
          node --check scripts/test-progress-email-qa-batch.mjs
          node --check scripts/test-progress-email-qa-handler.mjs

      - name: QA recipient selection and orchestration contract
        run: node scripts/test-progress-email-qa-batch.mjs

      - name: Scheduler-authorized handler contract
        run: node scripts/test-progress-email-qa-handler.mjs

      - name: Dispatch regression
        run: node scripts/test-progress-email-dispatch.mjs

      - name: Production build
        run: npm run build
