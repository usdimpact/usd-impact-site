name: Publication calendar PR freshness

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: publication-calendar-pr-freshness
  cancel-in-progress: false

jobs:
  enforce:
    if: >-
      github.repository == 'usdimpact/usd-impact-site' &&
      github.repository_id == '1265351071'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Staggered schedule and manual dispatch execute the workflow definition from the protected
      # default branch. PR-head content is fetched later as inert data and never executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Enforce publication calendar freshness
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GUARD_WINDOW_MINUTES: '60'
          GUARD_STATUS_CONTEXT: publication-calendar-freshness
          AUTOMATION_BRANCH_PREFIX: automation/catalyst-brief-
        run: node scripts/enforce-publication-calendar-prs.mjs
