name: PWA contract

on:
  pull_request:
    paths:
      - 'apps/web/public/manifest.webmanifest'
      - 'apps/web/public/sw.js'
      - 'apps/web/src/components/PwaClient.astro'
      - 'apps/web/src/layouts/BaseLayout.astro'
      - 'apps/web/scripts/test-pwa-contract.mjs'
      - '.github/workflows/pwa-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/public/manifest.webmanifest'
      - 'apps/web/public/sw.js'
      - 'apps/web/src/components/PwaClient.astro'
      - 'apps/web/src/layouts/BaseLayout.astro'
      - 'apps/web/scripts/test-pwa-contract.mjs'
      - '.github/workflows/pwa-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Verify installability and protected-content cache policy
        run: node scripts/test-pwa-contract.mjs
