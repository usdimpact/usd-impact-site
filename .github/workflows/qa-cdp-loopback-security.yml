name: Chromium QA loopback security
on:
  pull_request:
    paths:
      - 'apps/web/scripts/qa-october-monthly-responsive.mjs'
      - 'apps/web/scripts/qa-spanish-preview-responsive.mjs'
      - 'apps/web/scripts/qa-chrome-debug-endpoint.mjs'
      - 'apps/web/scripts/test-qa-chrome-debug-endpoint.mjs'
      - '.github/workflows/qa-cdp-loopback-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-loopback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Validate Chrome QA sources and malicious endpoint fixtures
        run: |
          node --check apps/web/scripts/qa-october-monthly-responsive.mjs
          node --check apps/web/scripts/qa-spanish-preview-responsive.mjs
          node --check apps/web/scripts/qa-chrome-debug-endpoint.mjs
          node apps/web/scripts/test-qa-chrome-debug-endpoint.mjs

  browser-regression:
    # Exact-head Chromium validation for the original redirect-hardening Draft
    # and ONE isolated main-target security compatibility Draft. Never run
    # the expensive browser grid on unrelated pull requests.
    if: >-
      github.base_ref == 'agent/held-release-mandatory-check-design-20261103' ||
      (github.base_ref == 'main' && github.head_ref == 'agent/held-security-main-integration-20261103')
    needs: validate-loopback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install existing locked site dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Build only local Preview artifacts
        env:
          VERCEL_ENV: preview
        run: npm run build
      - name: Exercise actual Chrome DevTools loopback and 20 viewport cases
        run: |
          command -v google-chrome-stable || command -v google-chrome || command -v chromium
          node scripts/qa-october-monthly-responsive.mjs
          node scripts/qa-spanish-preview-responsive.mjs
