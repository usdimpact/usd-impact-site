name: Web quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate GitHub Action runtimes
        run: node scripts/test-github-action-runtimes.mjs
      - name: Validate AI control center
        run: |
          node --check ../../scripts/control-center.mjs
          node --check ../../scripts/control-center-policy.mjs
          node ../../scripts/test-control-center-policy.mjs
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/INVENTORY.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/PROJECT_STATE.json', 'utf8'))"
      - name: Validate content
        run: npm run validate:content
      - name: Validate reports
        run: npm run validate:reports
      - name: Validate compliance
        run: npm run validate:compliance
      - name: Validate internal links
        run: npm run validate:links
      - name: Validate publishing
        run: npm run validate:publishing
      - name: Validate automation health checks
        run: npm run validate:automation-health
      - name: Validate Vercel functions
        run: npm run validate:functions
      - name: Validate Supabase contracts
        run: npm run validate:supabase
      - name: Build production site
        run: npm run build
