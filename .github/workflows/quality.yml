name: Web quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate GitHub Action runtimes
        run: node scripts/test-github-action-runtimes.mjs
      - name: Validate release gatekeeper policy
        run: node scripts/test-release-gatekeeper-policy.mjs
      - name: Validate release gatekeeper evidence
        run: node scripts/test-release-gatekeeper-evidence.mjs
      - name: Validate trusted release evidence producers
        run: node scripts/test-release-gatekeeper-producers.mjs
      - name: Validate authenticated release audit adapters
        run: node scripts/test-release-gatekeeper-audit-adapters.mjs
      - name: Validate Vercel release audit collector
        run: node scripts/test-collect-vercel-release-audit.mjs
      - name: Validate release evidence assembler
        run: node scripts/test-assemble-release-evidence.mjs
      - name: Validate Production data-plane evidence producer
        run: node scripts/test-produce-production-data-plane-evidence.mjs
      - name: Validate content
        run: npm run validate:content
      - name: Validate reports
        run: npm run validate:reports
      - name: Validate compliance
        run: npm run validate:compliance
      - name: Validate internal links
        run: npm run validate:links
      - name: Validate publishing
        run: npm run validate:publishing
      - name: Validate automation health checks
        run: npm run validate:automation-health
      - name: Validate Vercel functions
        run: npm run validate:functions
      - name: Validate Supabase contracts
        run: npm run validate:supabase
      - name: Build production site
        run: npm run build
