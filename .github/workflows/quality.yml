name: Web quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Temporary isolated database test snapshot for calendar 558
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559 && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p "$RUNNER_TEMP/calendar558-db-inputs"
          git -C ../.. archive --format=zip HEAD > "$RUNNER_TEMP/calendar558-db-inputs/source.zip"
          git -C ../.. ls-tree -r HEAD > "$RUNNER_TEMP/calendar558-db-inputs/blobs.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/calendar558-db-inputs/revision.txt"
          tar -czf "$RUNNER_TEMP/calendar558-db-inputs/pglite.tar.gz" node_modules/@electric-sql/pglite
          sha256sum "$RUNNER_TEMP/calendar558-db-inputs/"* > "$RUNNER_TEMP/calendar558-db-inputs/SHA256SUMS"
      - name: Temporary database test input artifact for calendar 558
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: calendar558-db-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/calendar558-db-inputs/
          retention-days: 1
          if-no-files-found: error
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate GitHub Action runtimes
        run: node scripts/test-github-action-runtimes.mjs
      - name: Validate AI control center
        run: |
          node --check ../../scripts/control-center.mjs
          node --check ../../scripts/control-center-policy.mjs
          node ../../scripts/test-control-center-policy.mjs
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/INVENTORY.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/PROJECT_STATE.json', 'utf8'))"
      - name: Validate content
        run: npm run validate:content
      - name: Validate reports
        run: npm run validate:reports
      - name: Validate compliance
        run: npm run validate:compliance
      - name: Validate internal links
        run: npm run validate:links
      - name: Validate publishing
        run: npm run validate:publishing
      - name: Validate automation health checks
        run: npm run validate:automation-health
      - name: Validate Vercel functions
        run: npm run validate:functions
      - name: Validate paid access and protected audiobook
        run: npm run validate:paid-access
      - name: Validate quiz entitlement and mastery contracts
        run: npm run validate:quizzes
      - name: Validate protected video library
        run: npm run validate:video-library
      - name: Validate Supabase contracts
        run: npm run validate:supabase
      - name: Validate knowledge retrieval
        run: |
          node --check src/lib/knowledge-retrieval.js
          node --check src/lib/knowledge-search-handler.js
          node --check scripts/sync-knowledge-corpus-production.mjs
          node scripts/test-knowledge-retrieval.mjs
          node scripts/test-knowledge-search-handler.mjs
          node scripts/test-knowledge-corpus-production-sync.mjs
          node scripts/sync-knowledge-corpus-production.mjs
      - name: Validate Daily Cards
        run: npm run validate:daily-cards
      - name: Build production site
        run: npm run build