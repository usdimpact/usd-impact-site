name: Web quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate GitHub Action runtimes
        run: node scripts/test-github-action-runtimes.mjs
      - name: Validate AI control center
        run: |
          node --check ../../scripts/control-center.mjs
          node --check ../../scripts/control-center-policy.mjs
          node ../../scripts/test-control-center-policy.mjs
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/INVENTORY.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/PROJECT_STATE.json', 'utf8'))"
      - name: Validate content
        run: npm run validate:content
      - name: Validate reports
        run: npm run validate:reports
      - name: Validate compliance
        run: npm run validate:compliance
      - name: Validate internal links
        run: npm run validate:links
      - name: Validate publishing
        run: npm run validate:publishing
      - name: Validate automation health checks
        run: npm run validate:automation-health
      - name: Validate Vercel functions
        run: npm run validate:functions
      - name: Validate paid access and protected audiobook
        run: npm run validate:paid-access
      - name: Validate quiz entitlement and mastery contracts
        run: npm run validate:quizzes
      - name: Validate protected video library
        run: npm run validate:video-library
      - name: Validate Supabase contracts
        run: npm run validate:supabase
      - name: Validate knowledge retrieval
        run: |
          node --check src/lib/knowledge-retrieval.js
          node --check src/lib/knowledge-search-handler.js
          node --check scripts/sync-knowledge-corpus-production.mjs
          node scripts/test-knowledge-retrieval.mjs
          node scripts/test-knowledge-search-handler.mjs
          node scripts/test-knowledge-corpus-production-sync.mjs
          node scripts/sync-knowledge-corpus-production.mjs
      - name: Validate Daily Cards
        run: npm run validate:daily-cards
      - name: Build production site
        run: npm run build
      - name: Temporary isolated PostgreSQL 17.6 test-engine build for 558
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559 && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 12
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          work="$RUNNER_TEMP/calendar558-native-engine"
          mkdir -p "$work/source" "$work/artifact"
          cd "$work/source"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 10 --max-time 90 https://ftp.postgresql.org/pub/source/v17.6/postgresql-17.6.tar.bz2 -o postgresql-17.6.tar.bz2
          printf '%s  %s\n' e0630a3600aea27511715563259ec2111cd5f4353a4b040e0be827f94cd7a8b0 postgresql-17.6.tar.bz2 | sha256sum --check --strict
          tar -xjf postgresql-17.6.tar.bz2
          cd postgresql-17.6
          ./configure --prefix="$work/pgsql" --without-readline --without-zlib --without-icu > "$work/artifact/configure.log" 2>&1
          make -s -j2 > "$work/artifact/build.log" 2>&1
          make -s install > "$work/artifact/install.log" 2>&1
          "$work/pgsql/bin/postgres" --version | tee "$work/artifact/version.txt"
          test "$("$work/pgsql/bin/postgres" --version)" = 'postgres (PostgreSQL) 17.6'
          tar -czf "$work/artifact/postgresql-17.6-linux-x64.tar.gz" -C "$work" pgsql
          printf '%s\n' e0630a3600aea27511715563259ec2111cd5f4353a4b040e0be827f94cd7a8b0 > "$work/artifact/source-sha256.txt"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > "$work/artifact/source-revision.txt"
          cd "$work/artifact"
          sha256sum postgresql-17.6-linux-x64.tar.gz configure.log build.log install.log version.txt source-sha256.txt source-revision.txt > SHA256SUMS
      - name: Temporary PostgreSQL test-engine artifact for 558
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: calendar558-native-engine-${{ github.run_id }}
          path: ${{ runner.temp }}/calendar558-native-engine/artifact/
          retention-days: 1
          if-no-files-found: error
