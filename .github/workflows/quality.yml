name: Web quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Temporary bounded public BLS fixture capture for issue 558
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          import { setTimeout as sleep } from 'node:timers/promises';
          import { BLS_CPI_SCHEDULE, BLS_CPI_RELEASE, readOfficialBlsHtml } from './src/lib/bls-cpi-calendar.js';
          const directory = join(process.env.RUNNER_TEMP, 'calendar-558-public-source');
          await mkdir(directory, { recursive: true });
          const report = { purpose: 'public-source-parser-fixtures-only', revision: process.env.GITHUB_SHA,
            sources: [], publicationAttempted: false, publicationAuthorized: false };
          for (const [file, url] of [['schedule.html', BLS_CPI_SCHEDULE],
            ['monthly.html', 'https://www.bls.gov/schedule/2026/09_sched_list.htm'], ['release.html', BLS_CPI_RELEASE]]) {
            try {
              if (report.sources.length) await sleep(1000);
              const source = await readOfficialBlsHtml(url);
              await writeFile(join(directory, file), source.html, 'utf8');
              report.sources.push({ file, ...source.evidence, diagnostic: source.diagnostic });
            } catch (error) {
              report.hold = error?.name === 'CalendarHold' ? error.code : 'HOLD_INTERNAL_ERROR';
              report.sourceDiagnostic = error?.name === 'CalendarHold' ? error.sourceDiagnostic ?? null : null;
              process.exitCode = 2;
              break;
            }
          }
          await writeFile(join(directory, 'manifest.json'), JSON.stringify(report, null, 2) + '\n', 'utf8');
          console.log(JSON.stringify(report));
          NODE
      - name: Upload temporary public BLS parser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calendar-558-public-source-${{ github.run_id }}
          path: ${{ runner.temp }}/calendar-558-public-source/
          retention-days: 3
          if-no-files-found: error
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate GitHub Action runtimes
        run: node scripts/test-github-action-runtimes.mjs
      - name: Validate AI control center
        run: |
          node --check ../../scripts/control-center.mjs
          node --check ../../scripts/control-center-policy.mjs
          node ../../scripts/test-control-center-policy.mjs
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/INVENTORY.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('../../docs/operations/ai-control-center/PROJECT_STATE.json', 'utf8'))"
      - name: Validate content
        run: npm run validate:content
      - name: Validate reports
        run: npm run validate:reports
      - name: Validate compliance
        run: npm run validate:compliance
      - name: Validate internal links
        run: npm run validate:links
      - name: Validate publishing
        run: npm run validate:publishing
      - name: Validate automation health checks
        run: npm run validate:automation-health
      - name: Validate Vercel functions
        run: npm run validate:functions
      - name: Validate paid access and protected audiobook
        run: npm run validate:paid-access
      - name: Validate quiz entitlement and mastery contracts
        run: npm run validate:quizzes
      - name: Validate protected video library
        run: npm run validate:video-library
      - name: Validate Supabase contracts
        run: npm run validate:supabase
      - name: Validate knowledge retrieval
        run: |
          node --check src/lib/knowledge-retrieval.js
          node --check src/lib/knowledge-search-handler.js
          node --check scripts/sync-knowledge-corpus-production.mjs
          node scripts/test-knowledge-retrieval.mjs
          node scripts/test-knowledge-search-handler.mjs
          node scripts/test-knowledge-corpus-production-sync.mjs
          node scripts/sync-knowledge-corpus-production.mjs
      - name: Validate Daily Cards
        run: npm run validate:daily-cards
      - name: Build production site
        run: npm run build