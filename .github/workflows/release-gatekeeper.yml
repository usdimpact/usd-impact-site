name: Release gatekeeper

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        default: '140'
      expected_head:
        description: Exact 40-character release SHA to approve
        required: true
      mode:
        description: Approval boundary
        required: true
        type: choice
        options:
          - production-promotion
          - checkout-enable
      vercel_production_environment:
        description: Fresh Vercel Production env evidence verified
        required: true
        type: choice
        options: [unverified, verified]
      paddle_live:
        description: Fresh Paddle Live readiness evidence verified
        required: true
        type: choice
        options: [unverified, verified]
      production_data_plane:
        description: Production Supabase/content/audio data plane verified
        required: true
        type: choice
        options: [unverified, verified]
      checkout_closed:
        description: Checkout is confirmed CLOSED at evaluation time
        required: true
        type: choice
        options: [unverified, verified]
      protected_production:
        description: Protected Production verification complete (required for checkout-enable)
        required: true
        type: choice
        options: [unverified, verified]
      evidence_refs:
        description: Non-secret evidence refs (PR comment IDs, run IDs, dashboard audit refs)
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: release-gatekeeper-${{ inputs.pr_number }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  decide:
    name: Fail-closed release decision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Evaluate release gates
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATEKEEPER_PR_NUMBER: ${{ inputs.pr_number }}
          GATEKEEPER_EXPECTED_HEAD: ${{ inputs.expected_head }}
          GATEKEEPER_MODE: ${{ inputs.mode }}
          GATEKEEPER_VERCEL_PRODUCTION_ENV: ${{ inputs.vercel_production_environment }}
          GATEKEEPER_PADDLE_LIVE: ${{ inputs.paddle_live }}
          GATEKEEPER_PRODUCTION_DATA_PLANE: ${{ inputs.production_data_plane }}
          GATEKEEPER_CHECKOUT_CLOSED: ${{ inputs.checkout_closed }}
          GATEKEEPER_PROTECTED_PRODUCTION: ${{ inputs.protected_production }}
          GATEKEEPER_EVIDENCE_REFS: ${{ inputs.evidence_refs }}
        run: node scripts/release-gatekeeper.mjs
