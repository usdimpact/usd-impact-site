name: Release gatekeeper

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        default: '140'
      expected_head:
        description: Exact 40-character release SHA to approve
        required: true
      mode:
        description: Approval boundary
        required: true
        type: choice
        options:
          - production-promotion
          - checkout-enable
      evidence_json:
        description: Structured non-secret usd-impact.release-gate-evidence.v1 JSON envelope
        required: true

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: release-gatekeeper-${{ inputs.pr_number }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  decide:
    name: Fail-closed release decision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Evaluate release gates
        working-directory: apps/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATEKEEPER_PR_NUMBER: ${{ inputs.pr_number }}
          GATEKEEPER_EXPECTED_HEAD: ${{ inputs.expected_head }}
          GATEKEEPER_MODE: ${{ inputs.mode }}
          GATEKEEPER_EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: node scripts/release-gatekeeper.mjs
