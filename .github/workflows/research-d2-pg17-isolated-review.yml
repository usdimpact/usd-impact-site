# D2-A review only. Disposable PostgreSQL 17.6 in GitHub Actions, synthetic roles/rows.
# No Supabase or merchant secrets, no migrations against connected projects.
name: Research D2 PG17 isolated permission and rollback review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/1103-b5-rpc-sql-isolated-d1-20261104]
    paths:
      - '.github/workflows/research-d2-pg17-isolated-review.yml'
      - 'docs/operations/research-d2-pg17-review-fixtures.tar.xz.b64'
permissions:
  contents: read
concurrency:
  group: research-d2-pg17-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-pg17:
    if: github.head_ref == 'agent/1103-d2-a-pg17-disposable-review-20261104' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [S1a, S1b, S1c, S2]
    env:
      CI: 'true'
      PGHOST: '127.0.0.1'
      PGPORT: '5432'
      PGDATABASE: ci_review
      PGUSER: ci_research
      PGPASSWORD: ci_fixture_only_password
      D2_SCENARIO: ${{ matrix.scenario }}
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: ci_review
          POSTGRES_USER: ci_research
          POSTGRES_PASSWORD: ci_fixture_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U ci_research -d ci_review'
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Checkout isolated review source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Enforce single disposable destination and unpack pinned review fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 5432
          test "$PGDATABASE" = ci_review
          test "$PGUSER" = ci_research
          test -z "${SUPABASE_URL:-}"
          test -z "${DATABASE_URL:-}"
          test -z "${VERCEL_ENV:-}"
          mkdir -p "$RUNNER_TEMP/d2-fixture"
          base64 --decode docs/operations/research-d2-pg17-review-fixtures.tar.xz.b64 | tar -xJ -C "$RUNNER_TEMP/d2-fixture"
          python3 -m py_compile "$RUNNER_TEMP/d2-fixture/run_pg17_review.py"
          echo 'D2 no Supabase project, no provider webhook, no paid customer data'
      - name: Install pinned isolated PostgreSQL client in ephemeral venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/d2-venv"
          "$RUNNER_TEMP/d2-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.10'
      - name: Exercise non-superuser installer, controlled ACL faults, M2 and R1
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/d2-venv/bin/python" "$RUNNER_TEMP/d2-fixture/run_pg17_review.py"
      - name: Record strict no-release scope
        if: always()
        shell: bash
        run: |
          {
            echo '### Research D2-A isolated PG17 review'
            echo "Scenario: $D2_SCENARIO; only synthetic PostgreSQL 17.6 service in GitHub Actions."
            echo 'No Supabase connection, no Production/Development DDL, no Lemon Squeezy or paid entitlements.'
            echo 'A46 corrected installer and D2-04 supplement remain review-only; D2-B/C and D4/D6/D7 NO-GO.'
          } >> "$GITHUB_STEP_SUMMARY"
