name: Research O1 O4 Stage B disposable PostgreSQL ordering review (HOLD)
on:
  pull_request:
    paths:
      - '.github/workflows/research-ordering-stage-b-review.yml'
      - 'docs/operations/research-ordering-stage-b/**'
      - 'apps/web/src/lib/research-membership-ordering-review.js'
      - 'apps/web/scripts/test-research-membership-ordering-review.mjs'
permissions:
  contents: read
concurrency:
  group: research-stage-b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  disposable-pg17-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: ci_review
          POSTGRES_PASSWORD: local-review-only
          POSTGRES_DB: ci_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_review -d ci_review"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check inert Stage A classification contract
        run: node apps/web/scripts/test-research-membership-ordering-review.mjs
      - name: Run synthetic two-connection PostgreSQL 17.6 ordering oracle
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: ci_review
          PGUSER: ci_review
          PGPASSWORD: local-review-only
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}" && test -z "${SUPABASE_URL:-}"
          python3 -m venv "$RUNNER_TEMP/ordering-venv"
          "$RUNNER_TEMP/ordering-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.10'
          "$RUNNER_TEMP/ordering-venv/bin/python" docs/operations/research-ordering-stage-b/test_ordering_stage_b.py
