name: Research O1 O4 Stage G offline provider paid-evidence contract (HOLD)
on:
  pull_request:
    paths:
      - '.github/workflows/research-ordering-stage-g-review.yml'
      - 'docs/operations/research-ordering-stage-g/**'
permissions:
  contents: read
concurrency:
  group: research-stage-g-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-provider-evidence-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject live credentials and run synthetic raw-signature/invoice subscription tests
        env:
          STAGE_G_OFFLINE_ONLY: 'true'
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}" && test -z "${SUPABASE_URL:-}" && test -z "${SUPABASE_DB_URL:-}"
          test -z "${LEMON_SQUEEZY_API_KEY:-}" && test -z "${LEMON_SQUEEZY_WEBHOOK_SECRET:-}"
          node --version
          node --check docs/operations/research-ordering-stage-g/provider_paid_evidence_review.mjs
          node --check docs/operations/research-ordering-stage-g/test_provider_paid_evidence.mjs
          node docs/operations/research-ordering-stage-g/test_provider_paid_evidence.mjs
