name: Research Stage P consumed checkout and canonical handoff PG17 (DRAFT HOLD)
on:
  pull_request:
    paths:
      - '.github/workflows/research-ordering-stage-p-review.yml'
      - 'docs/operations/research-ordering-stage-o/**'
      - 'docs/operations/research-ordering-stage-p/**'
      - 'docs/operations/research-ordering-stage-n/**'
      - 'docs/operations/research-ordering-stage-m/**'
      - 'docs/operations/research-ordering-stage-l/**'
      - 'docs/operations/research-ordering-stage-k/**'
      - 'docs/operations/research-ordering-stage-j/**'
      - 'docs/operations/research-ordering-stage-i/**'
      - 'docs/operations/research-ordering-stage-h/**'
      - 'docs/operations/research-ordering-stage-g/**'
      - 'docs/operations/research-ordering-stage-f/**'
      - 'docs/operations/research-ordering-stage-e/**'
      - 'docs/operations/research-ordering-stage-c/**'
      - 'supabase/migrations/20260729203000_paid_access_foundation.sql'
      - 'supabase/migrations/20260905201000_research_membership_recurring_foundation.sql'
      - 'supabase/migrations/20260906004500_research_membership_transition_persistence.sql'
      - 'supabase/migrations/20260906104500_research_membership_performance_hardening.sql'
      - 'supabase/migrations/20260906180500_research_membership_service_role_grants.sql'
      - 'supabase/migrations/20260907154500_research_membership_first_purchase_binding.sql'
permissions:
  contents: read
concurrency:
  group: research-stage-p-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-provider-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run historic provider screens and R1/R2 fail-closed checks
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}" && test -z "${SUPABASE_URL:-}" && test -z "${SUPABASE_DB_URL:-}"
          test -z "${LEMON_SQUEEZY_API_KEY:-}" && test -z "${LEMON_SQUEEZY_WEBHOOK_SECRET:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          node docs/operations/research-ordering-stage-g/test_provider_paid_evidence.mjs
          node docs/operations/research-ordering-stage-h/test_provider_window_review.mjs
          node docs/operations/research-ordering-stage-j/test_invoice_custody_review.mjs
          node docs/operations/research-ordering-stage-m/test_canonical_contract.mjs
          node docs/operations/research-ordering-stage-o/test_r1_r2_release_gate.mjs
  disposable-pg17-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        script:
          - docs/operations/research-ordering-stage-i/test_journal_hardening.py
          - docs/operations/research-ordering-stage-j/test_invoice_journal.py
          - docs/operations/research-ordering-stage-k/test_conflict_observation.py
          - docs/operations/research-ordering-stage-l/test_first_activation.py
          - docs/operations/research-ordering-stage-m/test_canonical_bridge.py
          - docs/operations/research-ordering-stage-n/test_locked_first_purchase.py
          - docs/operations/research-ordering-stage-o/test_driver_deadline.py
          - docs/operations/research-ordering-stage-o/test_guard_first_b5_bind.py
          - docs/operations/research-ordering-stage-p/test_strict_evidence.py
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: ci_research
          POSTGRES_PASSWORD: synthetic-stage-c-review-only
          POSTGRES_DB: ci_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_research -d ci_review"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay six migrations in I–N and run Stage O/P isolated checks; NO connected DB
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: ci_review
          PGUSER: ci_research
          PGPASSWORD: synthetic-stage-c-review-only
          TEST_SCRIPT: ${{ matrix.script }}
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}" && test -z "${SUPABASE_URL:-}" && test -z "${SUPABASE_DB_URL:-}"
          test -z "${LEMON_SQUEEZY_API_KEY:-}" && test -z "${LEMON_SQUEEZY_WEBHOOK_SECRET:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          python3 -m venv "$RUNNER_TEMP/research-stage-p-venv"
          "$RUNNER_TEMP/research-stage-p-venv/bin/python" -m pip install --disable-pip-version-check --no-input 'psycopg[binary]==3.2.10'
          "$RUNNER_TEMP/research-stage-p-venv/bin/python" -m py_compile "$TEST_SCRIPT"
          "$RUNNER_TEMP/research-stage-p-venv/bin/python" "$TEST_SCRIPT"
