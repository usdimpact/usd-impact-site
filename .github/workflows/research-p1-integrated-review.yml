name: Research P1 integrated security candidate (disposable PG17, synthetic data)

on:
  # PR merge refs may not exist while the Draft conflicts with main. Run this
  # disposable, secret-free test workflow on ONLY this exact Draft branch.
  # Do not broaden this to main/Production or add connected Supabase credentials.
  push:
    branches:
      - 'agent/research-live-p1-integrated-rc-20261105'
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/research-p1/**'
      - 'docs/operations/research-p1-two-phase/**'
      - 'apps/web/src/lib/**'
      - 'apps/web/api/commerce.js'
      - 'apps/web/scripts/test-research-membership-webhook-replay.mjs'
      - 'apps/web/scripts/test-research-bound-invoice-after-auth-intent.mjs'
      - 'apps/web/scripts/test-lemon-squeezy-research-membership-adapter.mjs'
      - 'apps/web/src/lib/research-membership-first-purchase.js'
      - 'apps/web/src/lib/account-deletion-finalizer.js'
      - 'apps/web/src/lib/account-deletion-two-phase-review.js'
      - 'apps/web/src/lib/account-deletion-two-phase-preflight.js'
      - 'apps/web/src/lib/account-deletion-two-phase-worker-review.js'
      - 'apps/web/api/account.js'
      - 'apps/web/scripts/test-account-deletion-two-phase-preflight.mjs'
      - 'apps/web/scripts/test-account-deletion-two-phase-worker-review.mjs'
      - 'apps/web/scripts/test-account-deletion-a-strict-route-hold.mjs'
      - 'apps/web/src/lib/account-deletion-a-strict-review.js'
      - 'apps/web/scripts/test-account-deletion-a-strict-review.mjs'
      - 'apps/web/scripts/test-account-deletion-two-phase-review.mjs'
      - 'apps/web/scripts/test-research-p1-billing-safe-deletion.mjs'
      - '.github/workflows/research-p1-integrated-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-p1:
    name: Research P1 lifecycle regressions (no connected database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pg:
        # Disposable job-local database only. No secrets, no connected project.
        image: postgres:17.6
        env:
          POSTGRES_USER: ci_research
          POSTGRES_PASSWORD: synthetic-stage-c-review-only
          POSTGRES_DB: ci_review
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_research -d ci_review"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGUSER: ci_research
      PGPASSWORD: synthetic-stage-c-review-only
      PGDATABASE: ci_review
    steps:
      - name: Checkout exact proposed source without saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select reviewed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - name: Offline web regressions (checkout custody, quarantine, pre-Auth hold)
        working-directory: apps/web
        run: |
          node --check src/lib/research-membership-first-purchase.js
          node --check src/lib/account-deletion-finalizer.js
          node scripts/test-research-membership-first-purchase.mjs
          node scripts/test-research-membership-persistence.mjs
          node scripts/test-lemon-squeezy-research-membership-adapter.mjs
          node scripts/test-research-membership-webhook-replay.mjs
          node scripts/test-account-deletion-finalizer.mjs
          node --check src/lib/account-deletion-two-phase-review.js
          node scripts/test-account-deletion-two-phase-review.mjs
          node scripts/test-account-deletion-two-phase-financial-hold.mjs
          node scripts/test-research-preview-route.mjs
          node scripts/test-account-deletion-interim-mode.mjs
          node --check src/lib/account-deletion-two-phase-preflight.js
          node --check api/account.js
          node scripts/test-account-deletion-two-phase-preflight.mjs
          node --check src/lib/account-deletion-two-phase-worker-review.js
          node scripts/test-account-deletion-two-phase-worker-review.mjs
          node scripts/test-account-deletion-a-strict-route-hold.mjs
          node --check src/lib/account-deletion-a-strict-review.js
          node scripts/test-account-deletion-a-strict-review.mjs
          node scripts/test-research-p1-billing-safe-deletion.mjs
      - name: Replay every migration as non-superuser owner, then run the PG17 lifecycle matrix
        run: |
          python3 -m pip install --break-system-packages "psycopg[binary]==3.2.10"
          python3 supabase/tests/research-p1/owner_model_replay.py "$GITHUB_WORKSPACE"
          python3 supabase/tests/research-p1/test_research_p1_lifecycle.py CI
          python3 supabase/tests/research-p1/test_research_p1_two_phase.py
          python3 supabase/tests/research-p1/test_research_p1_auth_split_fence.py
          python3 supabase/tests/research-p1/test_research_p1_interim_deletion.py "$GITHUB_WORKSPACE"
          python3 supabase/tests/research-p1/test_research_p1_d3_legacy_claim.py
          # Uninstalled A-strict review overlay: only isolated job-local PG17,
          # after baseline tests so old candidate expectations remain separate.
          python3 - <<'PY'
          from pathlib import Path
          import psycopg
          with psycopg.connect(dbname='ci_review',autocommit=True) as c:
              c.execute('SET ROLE postgres')
              c.execute(Path('supabase/tests/research-p1/a-strict-overlay-review.sql').read_text())
              print('A-STRICT disposable SQL overlay parsed and installed (job-local only)')
          PY
          python3 supabase/tests/research-p1/test_a_strict_review.py
          python3 supabase/tests/research-p1/test_a_strict_outbox_immutability.py
          # P1-A/B owner recovery is another UNINSTALLED review overlay.
          # Only this disposable PostgreSQL service, no hosted project.
          python3 - <<'PY'
          from pathlib import Path
          import psycopg
          with psycopg.connect(dbname='ci_review',autocommit=True) as c:
              c.execute('SET ROLE postgres')
              c.execute(Path('supabase/tests/research-p1/a-strict-owner-recovery-review.sql').read_text())
              print('A-STRICT owner recovery review overlay applied to disposable PG17 only')
          PY
          python3 supabase/tests/research-p1/test_a_strict_owner_recovery.py
          # Real signed webhook handler -> disposable service-role SQL RPC,
          # after durable A-strict Auth intent. No outside network is opened.
          node apps/web/scripts/test-research-bound-invoice-after-auth-intent.mjs

  ui02-ui03-a-strict-recovery-combined:
    name: UI02/UI03 plus Research A-strict/Recovery, all synthetic PG17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      pg:
        image: postgres:17.6
        env:
          POSTGRES_USER: ci_research
          POSTGRES_PASSWORD: synthetic-stage-c-review-only
          POSTGRES_DB: ci_review
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci_research -d ci_review"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGUSER: ci_research
      PGPASSWORD: synthetic-stage-c-review-only
      PGDATABASE: ci_review
    steps:
      - name: Checkout exact stacked Draft source without saved credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout immutable UI02/UI03 reference sources (never deploy)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: usdimpact/usd-impact-site
          ref: '7005aa0585301892c96490d341c3c5645a616890'
          path: ui02_ui03_original_source
          sparse-checkout: |
            supabase/migrations
          persist-credentials: false
      - name: Select reviewed Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
      - name: Replay pinned UI source plus Research P1 against separate synthetic PG17
        run: |
          python3 -m pip install --break-system-packages "psycopg[binary]==3.2.10"
          python3 supabase/tests/research-p1/owner_model_replay_f3_review.py "$GITHUB_WORKSPACE" "--ui-source=$GITHUB_WORKSPACE/ui02_ui03_original_source"
          python3 supabase/tests/research-p1/test_f3_catalog_query_pack.py
          python3 supabase/tests/research-p1/test_research_p1_lifecycle.py CI
          python3 supabase/tests/research-p1/test_research_p1_two_phase.py
          python3 supabase/tests/research-p1/test_research_p1_auth_split_fence.py
          # Exercise real UI02/UI03 RLS, account_export, outbox denial,
          # two-user negative cases and Phase A deletion on pinned migrations.
          python3 supabase/tests/research-p1/test_research_p1_ui_locale_combined.py
          python3 supabase/tests/research-p1/test_research_p1_interim_deletion.py "$GITHUB_WORKSPACE" "--ui-source=$GITHUB_WORKSPACE/ui02_ui03_original_source"
          python3 supabase/tests/research-p1/test_research_p1_d3_legacy_claim.py
          # Only AFTER original UI02/UI03 + parent P1 tests, overlay A-strict.
          # Source-only review SQL; not normal migrations nor hosted Supabase.
          python3 - <<'PY'
          from pathlib import Path
          import psycopg
          with psycopg.connect(dbname='ci_review',autocommit=True) as c:
              c.execute('SET ROLE postgres')
              for name in (
                'a-strict-overlay-review.sql',
                'a-strict-owner-recovery-review.sql',
              ):
                  c.execute(Path('supabase/tests/research-p1',name).read_text())
                  print('F3-STACK isolated disposable PG17 installed '+name)
          PY
          python3 supabase/tests/research-p1/test_a_strict_review.py
          python3 supabase/tests/research-p1/test_a_strict_outbox_immutability.py
          python3 supabase/tests/research-p1/test_a_strict_owner_recovery.py
          # Real signed webhook handler -> disposable service-role SQL RPC,
          # after durable A-strict Auth intent. No outside network is opened.
          node apps/web/scripts/test-research-bound-invoice-after-auth-intent.mjs
      - name: Verify copied #1189 invoice webhook regression under UI02/UI03 combined job (offline Node)
        working-directory: apps/web
        run: |
          node --check src/lib/research-membership-webhook-handler.js
          node scripts/test-research-membership-webhook-replay.mjs
          node scripts/test-lemon-squeezy-research-membership-adapter.mjs

