name: Supabase migration filename rehearsal

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/supabase-migration-filename-rehearsal.yml

permissions:
  contents: read

jobs:
  generate-filename:
    if: github.event.pull_request.number == 559 && github.head_ref == 'publishing/558-calendar-validation'
    runs-on: ubuntu-latest
    steps:
      - name: Install exact Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.117.0
      - name: Generate migration filename with official CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.117.0"
          work="$(mktemp -d)"
          cd "$work"
          mkdir -p supabase/migrations
          supabase migration new publication_production_reader_revision_558
          file="$(find supabase/migrations -maxdepth 1 -type f -name '*_publication_production_reader_revision_558.sql' -printf '%f\n')"
          test -n "$file"
          test "$(printf '%s\n' "$file" | wc -l)" -eq 1
          printf 'MIGRATION_FILENAME=%s\n' "$file"
