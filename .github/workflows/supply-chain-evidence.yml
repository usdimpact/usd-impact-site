name: Supply chain evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/vendor/http-cache-semantics/**'
      - 'apps/web/scripts/test-http-cache-semantics-security.mjs'
      - 'apps/web/scripts/prepare-registry-signature-audit.mjs'
      - '.github/dependabot.yml'
      - '.github/workflows/supply-chain-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/web/vendor/http-cache-semantics/**'
      - 'apps/web/scripts/test-http-cache-semantics-security.mjs'
      - 'apps/web/scripts/prepare-registry-signature-audit.mjs'
      - '.github/dependabot.yml'
      - '.github/workflows/supply-chain-evidence.yml'
  schedule:
    - cron: '41 5 * * 6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate vendored supply-chain security patch
        run: npm run validate:supply-chain-security
      - name: Verify registry signatures and provenance attestations
        run: |
          set -euo pipefail
          registry_audit_root=".registry-signature-audit"
          rm -rf "$registry_audit_root"
          node scripts/prepare-registry-signature-audit.mjs
          (
            cd "$registry_audit_root"
            npm ci --no-audit --no-fund --strict-allow-scripts
            npm audit signatures
          )
          rm -rf "$registry_audit_root"
      - name: Generate CycloneDX SBOM
        run: |
          npm sbom --sbom-format cyclonedx --sbom-type application > "$RUNNER_TEMP/usd-impact-web-sbom.cdx.json"
          node -e "const fs=require('fs'); const bom=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/usd-impact-web-sbom.cdx.json','utf8')); if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components)) throw new Error('Invalid CycloneDX SBOM'); console.log('SBOM components:', bom.components.length);"
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usd-impact-web-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/usd-impact-web-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
