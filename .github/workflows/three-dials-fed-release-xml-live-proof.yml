name: Three Dials Fed release XML live adapter proof

on:
  pull_request:
    branches:
      - review/three-dials-fed-release-xml-20261028
    paths:
      - '.github/workflows/three-dials-fed-release-xml-live-proof.yml'
      - 'apps/web/scripts/probe-three-dials-fed-release-xml-live.mjs'
      - 'apps/web/src/lib/three-dials-board-release-xml.js'

permissions:
  contents: read

concurrency:
  group: three-dials-fed-release-xml-live-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove-live-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
      - name: Exercise exact release XML adapter against public Fed ZIPs
        run: node apps/web/scripts/probe-three-dials-fed-release-xml-live.mjs
