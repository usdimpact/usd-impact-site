name: Three Dials snapshot publication

on:
  schedule:
    - cron: '45 22 * * 1,2'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/three-dials-snapshot.yml'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: three-dials-snapshot
  cancel-in-progress: false

jobs:
  generate-and-open-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Generate source-bound snapshot
        run: node scripts/generate-three-dials-snapshot.mjs

      - name: Guard generated paths
        run: |
          changed_paths="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          if [ -z "$changed_paths" ]; then
            echo "No Three-Dials snapshot changes were generated."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              apps/web/src/data/three-dials-latest.json|apps/web/public/data/three-dials/latest.json|apps/web/public/data/three-dials/archive/*.json|src/data/three-dials-latest.json|public/data/three-dials/latest.json|public/data/three-dials/archive/*.json)
                ;;
              *)
                echo "::error::Three-Dials generator changed an unauthorized path: $path"
                exit 1
                ;;
            esac
          done <<EOF
          $changed_paths
          EOF

      - name: Validate and build
        run: |
          npm run validate
          npm run build

      - name: Create generated-data branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- src/data/three-dials-latest.json public/data/three-dials)" ]; then
            echo "No snapshot publication branch is needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          week="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('src/data/three-dials-latest.json','utf8')); process.stdout.write(value.week_ending || 'unknown');")"
          if ! printf '%s' "$week" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Generated snapshot does not contain a valid week_ending."
            exit 1
          fi

          branch="automation/three-dials-${week}-${GITHUB_RUN_ID}"
          git config user.name "usd-impact-three-dials-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/three-dials-latest.json public/data/three-dials
          git commit -m "Publish Three Dials snapshot for ${week}"
          git push --set-upstream origin "$branch"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch protected checks on generated commit
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          workflows='quality.yml codeql.yml generated-data-dependency-review.yml'
          for workflow in $workflows; do
            echo "Dispatching $workflow on $GENERATED_BRANCH"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$GENERATED_BRANCH"
          done

      - name: Require dispatched checks to pass
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.branch.outputs.branch }}
          GENERATED_HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          workflows='quality.yml codeql.yml generated-data-dependency-review.yml'

          for workflow in $workflows; do
            run_id=''
            attempt=1
            while [ "$attempt" -le 30 ]; do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$GENERATED_BRANCH" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$GENERATED_HEAD_SHA\") | .databaseId" \
                | head -n 1)"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
              attempt=$((attempt + 1))
            done

            if [ -z "$run_id" ]; then
              echo "::error::Could not resolve dispatched run for $workflow on $GENERATED_HEAD_SHA."
              exit 1
            fi

            echo "Waiting for $workflow run $run_id"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5
          done

      - name: Open guarded publication pull request for review
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.branch.outputs.branch }}
          GENERATED_WEEK: ${{ steps.branch.outputs.week }}
          GENERATED_HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          cat > "$RUNNER_TEMP/three-dials-pr.md" <<EOF
          ## Automated Three-Dials snapshot publication

          This pull request contains the dated **${GENERATED_WEEK}** completed-week snapshot at exact generated head **${GENERATED_HEAD_SHA}**.

          Publication is fail-closed. The generator requires bounded source hosts, per-series freshness checks, an exact-week USD Impact Score bridge, an immutable dated archive, and the full site validation/build before opening this pull request.

          Before this PR was opened, the exact generated commit independently passed the repository's dispatchable **Web quality**, **CodeQL security analysis**, and bounded **Dependency review** checks. The normal PR-triggered copies of those workflows ignore Three-Dials generated-data-only diffs, preventing GitHub's approval-required runs for PRs created with the repository GITHUB_TOKEN while preserving the required checks on the same commit.

          The snapshot separates **Fact**, **Interpretation**, and **Model output**. It does not change USD Impact Score v2 and does not create a forecast or trading signal.

          **Protected publication boundary:** This workflow does not merge this pull request. Protected human review and separate explicit owner approval are required before merge.
          EOF

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GENERATED_BRANCH" \
            --title "Publish Three Dials Snapshot — ${GENERATED_WEEK}" \
            --body-file "$RUNNER_TEMP/three-dials-pr.md")"

          echo "Generated Three-Dials snapshot PR opened for protected human review: $pr_url"
          echo "No automatic merge was attempted. Publication remains pending separate explicit owner approval."

      - name: Report bounded failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_title='P1 — Three Dials snapshot automation requires attention'
          printf '%s\n\n%s\n%s\n%s\n%s\n' \
            '## Three-Dials snapshot automation failure' \
            "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- Commit: \`${GITHUB_SHA}\`" \
            "- Trigger: \`${GITHUB_EVENT_NAME}\`" \
            'The workflow remained fail-closed. No generated snapshot was merged by this failed run.' \
            > "$RUNNER_TEMP/three-dials-failure.md"

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$issue_title in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/three-dials-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body-file "$RUNNER_TEMP/three-dials-failure.md"
          fi
