name: Three Dials snapshot publication

on:
  schedule:
    - cron: '45 22 * * 1,2'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/three-dials-snapshot.yml'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: three-dials-snapshot
  cancel-in-progress: false

jobs:
  generate-and-open-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Generate source-bound snapshot
        run: node scripts/generate-three-dials-snapshot.mjs

      - name: Guard generated paths
        run: |
          changed_paths="$(git status --porcelain --untracked-files=all | sed -E 's/^.. //')"
          if [ -z "$changed_paths" ]; then
            echo "No Three-Dials snapshot changes were generated."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              apps/web/src/data/three-dials-latest.json|apps/web/public/data/three-dials/latest.json|apps/web/public/data/three-dials/archive/*.json|src/data/three-dials-latest.json|public/data/three-dials/latest.json|public/data/three-dials/archive/*.json)
                ;;
              *)
                echo "::error::Three-Dials generator changed an unauthorized path: $path"
                exit 1
                ;;
            esac
          done <<EOF
          $changed_paths
          EOF

      - name: Validate and build
        run: |
          npm run validate
          npm run build

      - name: Create generated-data branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- src/data/three-dials-latest.json public/data/three-dials)" ]; then
            echo "No snapshot publication branch is needed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          week="$(node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('src/data/three-dials-latest.json','utf8')); process.stdout.write(value.week_ending || 'unknown');")"
          if ! printf '%s' "$week" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Generated snapshot does not contain a valid week_ending."
            exit 1
          fi

          branch="automation/three-dials-${week}-${GITHUB_RUN_ID}"
          git config user.name "usd-impact-three-dials-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/three-dials-latest.json public/data/three-dials
          git commit -m "Publish Three Dials snapshot for ${week}"
          git push --set-upstream origin "$branch"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch protected checks on generated commit
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          workflows='quality.yml codeql.yml generated-data-dependency-review.yml'
          for workflow in $workflows; do
            echo "Dispatching $workflow on $GENERATED_BRANCH"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$GENERATED_BRANCH"
          done

      - name: Require dispatched checks to pass
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.branch.outputs.branch }}
          GENERATED_HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          workflows='quality.yml codeql.yml generated-data-dependency-review.yml'

          for workflow in $workflows; do
            run_id=''
            attempt=1
            while [ "$attempt" -le 30 ]; do
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$GENERATED_BRANCH" \
                --event workflow_dispatch \
                --limit 10 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"$GENERATED_HEAD_SHA\") | .databaseId" \
                | head -n 1)"
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 2
              attempt=$((attempt + 1))
            done

            if [ -z "$run_id" ]; then
              echo "::error::Could not resolve dispatched run for $workflow on $GENERATED_HEAD_SHA."
              exit 1
            fi

            echo "Waiting for $workflow run $run_id"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5
          done

      - name: Open guarded publication pull request for review
        if: steps.branch.outputs.changed == 'true'
        id: publication_pr
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.branch.outputs.branch }}
          GENERATED_WEEK: ${{ steps.branch.outputs.week }}
          GENERATED_HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
        run: |
          cat > "$RUNNER_TEMP/three-dials-pr.md" <<EOF
          ## Automated Three-Dials snapshot publication

          This pull request contains the dated **${GENERATED_WEEK}** completed-week snapshot at exact generated head **${GENERATED_HEAD_SHA}**.

          Publication is fail-closed. The generator requires bounded source hosts, per-series freshness checks, an exact-week USD Impact Score bridge, an immutable dated archive, and the full site validation/build before opening this pull request.

          Before this PR was opened, the exact generated commit independently passed the repository's dispatchable **Web quality**, **CodeQL security analysis**, and bounded **Dependency review** checks.

          GitHub must also register native `pull_request` runs for the required **validate-and-build** and **Dependency review** contexts. Because this pull request is created with the repository `GITHUB_TOKEN`, those native runs may require a human with write access to choose **Approve workflows to run**. Once approved, GitHub executes them in the protected PR merge context (`refs/pull/<PR_NUMBER>/merge`), so branch protection evaluates the current merge result instead of a manually pinned synthetic merge SHA.

          The snapshot separates **Fact**, **Interpretation**, and **Model output**. It does not change USD Impact Score v2 and does not create a forecast or trading signal.

          **Protected publication boundary:** This workflow does not merge this pull request. Protected human review and separate explicit owner approval are required before merge.
          EOF

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GENERATED_BRANCH" \
            --title "Publish Three Dials Snapshot — ${GENERATED_WEEK}" \
            --body-file "$RUNNER_TEMP/three-dials-pr.md")"
          pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Generated Three-Dials snapshot PR opened for protected human review: $pr_url"
          echo "No automatic merge was attempted. Publication remains pending native required checks and separate explicit owner approval."

      - name: Require native protected pull-request checks to exist
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_BRANCH: ${{ steps.branch.outputs.branch }}
          GENERATED_HEAD_SHA: ${{ steps.branch.outputs.head_sha }}
          PR_NUMBER: ${{ steps.publication_pr.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Publication PR number was not resolved."
            exit 1
          fi

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from $GITHUB_SHA to $current_main before protected PR checks were registered."
            exit 1
          fi

          pr_base="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.base.sha')"
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$pr_base" != "$GITHUB_SHA" ] || [ "$pr_head" != "$GENERATED_HEAD_SHA" ]; then
            echo "::error::Publication PR drifted before protected PR checks were registered: base=$pr_base head=$pr_head."
            exit 1
          fi

          workflows='quality.yml dependency-review.yml'
          for workflow in $workflows; do
            record=''
            attempt=1
            while [ "$attempt" -le 30 ]; do
              record="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --branch "$GENERATED_BRANCH" \
                --event pull_request \
                --limit 20 \
                --json databaseId,headSha,status,conclusion,url \
                --jq ".[] | select(.headSha == \"$GENERATED_HEAD_SHA\") | [.databaseId, .status, (.conclusion // \"\"), .url] | @tsv" \
                | head -n 1)"
              if [ -n "$record" ]; then
                break
              fi
              sleep 2
              attempt=$((attempt + 1))
            done

            if [ -z "$record" ]; then
              echo "::error::GitHub did not register native pull_request run for $workflow on generated head $GENERATED_HEAD_SHA."
              exit 1
            fi

            IFS=$'\t' read -r run_id run_status run_conclusion run_url <<EOF
          $record
          EOF

            case "$run_conclusion" in
              action_required|success)
                ;;
              '')
                case "$run_status" in
                  queued|in_progress|requested|waiting|pending)
                    ;;
                  *)
                    echo "::error::$workflow native pull_request run $run_id has unexpected status=$run_status conclusion=$run_conclusion."
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "::error::$workflow native pull_request run $run_id concluded $run_conclusion."
                exit 1
                ;;
            esac

            echo "Native protected pull_request run registered: workflow=$workflow run=$run_id status=$run_status conclusion=${run_conclusion:-pending} url=$run_url"
          done

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          pr_base="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.base.sha')"
          pr_head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current_main" != "$GITHUB_SHA" ] || [ "$pr_base" != "$GITHUB_SHA" ] || [ "$pr_head" != "$GENERATED_HEAD_SHA" ]; then
            echo "::error::main or publication PR drifted while native protected checks were being registered."
            exit 1
          fi

          echo "Native protected pull_request checks are registered for PR #$PR_NUMBER. Branch protection remains authoritative for the current PR merge context."

      - name: Report bounded failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_title='P1 — Three Dials snapshot automation requires attention'
          printf '%s\n\n%s\n%s\n%s\n%s\n' \
            '## Three-Dials snapshot automation failure' \
            "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "- Commit: \`${GITHUB_SHA}\`" \
            "- Trigger: \`${GITHUB_EVENT_NAME}\`" \
            'The workflow remained fail-closed. No generated snapshot was merged by this failed run.' \
            > "$RUNNER_TEMP/three-dials-failure.md"

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$issue_title in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/three-dials-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body-file "$RUNNER_TEMP/three-dials-failure.md"
          fi
