name: USD Impact Claude WIF pilot (manual authentication only)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate GitHub OIDC claims; optionally exchange with Anthropic (no model requests)'
        required: true
        default: claims_only
        type: choice
        options:
          - claims_only
          - exchange_only
          - queue_fixture
      model_call_confirmation:
        description: 'For queue_fixture only: type I_APPROVE_ONE_HAIKU_CALL. Requires billing and a separate owner GO.'
        required: false
        default: ''
        type: string

# This workflow is intentionally not an autonomous Claude task dispatcher.
# The optional queue_fixture makes exactly one bounded Haiku call under strict manual, one-run gates.
# No push/PR/schedule trigger, checkout, customer data, repo writes, or deployment.
permissions: {}

concurrency:
  group: usd-impact-claude-wif-pilot
  cancel-in-progress: false

jobs:
  verify-identity:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'usdimpact/usd-impact-site'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      WIF_MODE: ${{ inputs.mode }}
      WIF_MODEL_CONFIRMATION: ${{ inputs.model_call_confirmation }}
      WIF_RULE_ID: ${{ vars.USD_IMPACT_ANTHROPIC_RULE_ID }}
      WIF_ORGANIZATION_ID: ${{ vars.USD_IMPACT_ANTHROPIC_ORGANIZATION_ID }}
      WIF_SERVICE_ACCOUNT_ID: ${{ vars.USD_IMPACT_ANTHROPIC_SERVICE_ACCOUNT_ID }}
      WIF_WORKSPACE_ID: ${{ vars.USD_IMPACT_ANTHROPIC_WORKSPACE_ID }}
    steps:
      - name: Verify exact GitHub OIDC claims; optionally exchange token without inference
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const audience = 'https://api.anthropic.com';
          const expected = {
            iss: 'https://token.actions.githubusercontent.com',
            sub: 'repo:usdimpact/usd-impact-site:ref:refs/heads/main',
            aud: audience,
            repository_owner: 'usdimpact',
            repository_owner_id: '275107298',
            repository: 'usdimpact/usd-impact-site',
            repository_id: '1265351071',
            ref: 'refs/heads/main',
            event_name: 'workflow_dispatch',
            workflow_ref: 'usdimpact/usd-impact-site/.github/workflows/usd-impact-claude-pilot.yml@refs/heads/main',
          };
          async function main() {
            const mode = process.env.WIF_MODE;
            if (mode !== 'claims_only' && mode !== 'exchange_only' && mode !== 'queue_fixture') {
              throw Error('Unsupported pilot mode');
            }
            // This is a deliberately one-shot model gate. A rerun or any later run must fail closed.
            if (mode === 'queue_fixture' &&
                (process.env.GITHUB_RUN_NUMBER !== '3' || process.env.GITHUB_RUN_ATTEMPT !== '1' ||
                 process.env.WIF_MODEL_CONFIRMATION !== 'I_APPROVE_ONE_HAIKU_CALL')) {
              throw Error('Paid model fixture is not approved for this exact first attempt');
            }
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!requestUrl || !requestToken) throw Error('GitHub OIDC permission is unavailable');
            const url = new URL(requestUrl);
            if (url.protocol !== 'https:' || !url.hostname.endsWith('.actions.githubusercontent.com')) {
              throw Error('Unexpected GitHub OIDC request endpoint');
            }
            url.searchParams.set('audience', audience);
            const oidcResponse = await fetch(url.toString(), {
              headers: { Authorization: 'Bearer ' + requestToken },
              signal: AbortSignal.timeout(10000),
            });
            if (!oidcResponse.ok) throw Error('OIDC issuance failed with HTTP ' + oidcResponse.status);
            const issued = await oidcResponse.json();
            const jwt = issued.value;
            if (typeof jwt !== 'string' || jwt.split('.').length !== 3) throw Error('Invalid OIDC token format');
            // Decoding checks the claims locally; Anthropic verifies the actual JWT signature on exchange.
            const claims = JSON.parse(Buffer.from(jwt.split('.')[1], 'base64url').toString('utf8'));
            for (const [key, value] of Object.entries(expected)) {
              if (String(claims[key] ?? '') !== value) throw Error('OIDC claim mismatch: ' + key);
            }
            const now = Math.floor(Date.now() / 1000);
            if (!Number.isSafeInteger(claims.iat) || !Number.isSafeInteger(claims.exp) ||
                claims.iat > now + 30 || claims.exp <= now) throw Error('OIDC token time window invalid');
            console.log('PASS: exact GitHub OIDC claims match the single permitted main-branch workflow.');
            if (mode === 'claims_only') {
              console.log('No Anthropic request, no model call, and no repository modification.');
              return;
            }
            const rule = process.env.WIF_RULE_ID || '';
            const organization = process.env.WIF_ORGANIZATION_ID || '';
            const serviceAccount = process.env.WIF_SERVICE_ACCOUNT_ID || '';
            const workspace = process.env.WIF_WORKSPACE_ID || '';
            if (!/^fdrl_[a-zA-Z0-9]+$/.test(rule) ||
                !/^[0-9a-fA-F-]{36}$/.test(organization) ||
                !/^svac_[a-zA-Z0-9]+$/.test(serviceAccount)) {
              throw Error('Exchange disabled: repository WIF ID variables are missing or invalid');
            }
            if (workspace && !/^wrkspc_[a-zA-Z0-9]+$/.test(workspace)) {
              throw Error('Invalid workspace ID');
            }
            const body = {
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion: jwt,
              federation_rule_id: rule,
              organization_id: organization,
              service_account_id: serviceAccount,
              ...(workspace ? { workspace_id: workspace } : {}),
            };
            const exchange = await fetch('https://api.anthropic.com/v1/oauth/token', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body),
              signal: AbortSignal.timeout(15000),
            });
            // Never print tokens, JWT assertions, request bodies, or response bodies to CI logs.
            if (!exchange.ok) throw Error('Anthropic identity exchange failed with HTTP ' + exchange.status);
            const result = await exchange.json();
            if (typeof result.access_token !== 'string' || !result.access_token.startsWith('sk-ant-oat01-') ||
                result.token_type !== 'Bearer' ||
                !Number.isInteger(result.expires_in) || result.expires_in < 60) {
              throw Error('Unexpected Anthropic token-exchange response');
            }
            if (mode === 'exchange_only') {
              console.log('PASS: Anthropic federated identity exchange succeeded; access token discarded in memory.');
              console.log('No Messages API/model request, repository change, or deployment was made.');
              return;
            }
            // No repository checkout, user-controlled prompt, private data, tools, or task execution.
            // All content below is a hard-coded synthetic fixture; at most one Messages API call.
            const fixture = [
              'Classify these purely synthetic USD Impact workflow cases.',
              'A: Draft-only QA with no customer access, approved for isolated testing.',
              'B: Merge Research deletion logic into Production while P1 race remains open.',
              'C: Publish Score data without approved source rights.',
              'Respond with only compact JSON of form',
              '{"ready":"A","hold":["B","C"]}. No Markdown, explanation, or other keys.',
            ].join(' ');
            if (fixture.length > 480) throw Error('Fixture input size exceeded');
            const payload = {
              model: 'claude-haiku-5-5',
              max_tokens: 96,
              output_config: { effort: 'low' },
              thinking: { type: 'disabled' },
              messages: [{ role: 'user', content: fixture }],
            };
            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + result.access_token,
                'anthropic-version': '2023-06-01',
                'content-type': 'application/json',
              },
              body: JSON.stringify(payload),
              signal: AbortSignal.timeout(20000),
            });
            // Never print request headers, OAuth/JWT tokens, or error response bodies.
            if (!response.ok) throw Error('Single Claude API call failed with HTTP ' + response.status);
            const generated = await response.json();
            const blocks = Array.isArray(generated.content) ? generated.content : [];
            const texts = blocks.filter(x => x.type === 'text' && typeof x.text === 'string');
            if (texts.length !== 1) throw Error('Unexpected Claude response shape');
            let decision;
            try { decision = JSON.parse(texts[0].text.trim()); }
            catch { throw Error('Claude did not return compact JSON'); }
            if (decision.ready !== 'A' || !Array.isArray(decision.hold) ||
                decision.hold.length !== 2 || decision.hold[0] !== 'B' || decision.hold[1] !== 'C' ||
                Object.keys(decision).sort().join(',') !== 'hold,ready') {
              throw Error('Claude synthetic classification did not match protected fixture');
            }
            const usage = generated.usage || {};
            if (!Number.isInteger(usage.input_tokens) || !Number.isInteger(usage.output_tokens) ||
                usage.input_tokens < 0 || usage.input_tokens > 400 ||
                usage.output_tokens < 1 || usage.output_tokens > 96) {
              throw Error('Claude token usage exceeded the bounded pilot fixture');
            }
            console.log('PASS: Real Claude Haiku 5.5 classified the synthetic fixture correctly.');
            console.log('SYNTHETIC_RESULT: A=READY; B=HOLD; C=HOLD.');
            console.log('USAGE: input=' + usage.input_tokens + '; output=' + usage.output_tokens + ' tokens.');
            console.log('One paid Messages API call; access token discarded; no repository writes or deployments.');
          }
          main().catch(e => { console.error(String(e.message || 'Authentication preflight failed')); process.exitCode = 1; });
          NODE
