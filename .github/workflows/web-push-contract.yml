name: Web Push contract

on:
  pull_request:
    paths:
      - 'apps/web/api/account.js'
      - 'apps/web/src/lib/push-subscription.js'
      - 'apps/web/src/lib/push-subscription-handler.js'
      - 'apps/web/scripts/test-push-subscription.mjs'
      - 'supabase/migrations/*push_subscriptions*'
      - '.github/workflows/web-push-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/api/account.js'
      - 'apps/web/src/lib/push-subscription.js'
      - 'apps/web/src/lib/push-subscription-handler.js'
      - 'apps/web/scripts/test-push-subscription.mjs'
      - 'supabase/migrations/*push_subscriptions*'
      - '.github/workflows/web-push-contract.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Syntax check Web Push account route
        run: |
          node --check api/account.js
          node --check src/lib/push-subscription.js
          node --check src/lib/push-subscription-handler.js
      - name: Verify server-only subscription storage and account routing
        run: node scripts/test-push-subscription.mjs
      - name: Preserve Vercel Hobby function budget
        run: |
          test ! -f api/push-subscription.js
          test "$(find api -maxdepth 1 -type f -name '*.js' | wc -l | tr -d ' ')" -le 12
