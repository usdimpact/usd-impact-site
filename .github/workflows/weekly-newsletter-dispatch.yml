name: Weekly newsletter dispatch

on:
  pull_request:
    paths:
      - 'apps/web/src/lib/weekly-newsletter-contract.js'
      - 'apps/web/src/lib/weekly-newsletter-candidate.js'
      - 'apps/web/src/lib/weekly-newsletter-edition.js'
      - 'apps/web/src/lib/weekly-newsletter-email.js'
      - 'apps/web/src/lib/weekly-newsletter-outbox.js'
      - 'apps/web/src/lib/weekly-newsletter-resend-adapter.js'
      - 'apps/web/src/lib/weekly-newsletter-dispatch.js'
      - 'apps/web/scripts/test-weekly-newsletter-resend-adapter.mjs'
      - 'apps/web/scripts/test-weekly-newsletter-dispatch.mjs'
      - 'apps/web/scripts/test-weekly-newsletter-static-artifact.mjs'
      - '.github/workflows/weekly-newsletter-dispatch.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/lib/weekly-newsletter-contract.js'
      - 'apps/web/src/lib/weekly-newsletter-candidate.js'
      - 'apps/web/src/lib/weekly-newsletter-edition.js'
      - 'apps/web/src/lib/weekly-newsletter-email.js'
      - 'apps/web/src/lib/weekly-newsletter-outbox.js'
      - 'apps/web/src/lib/weekly-newsletter-resend-adapter.js'
      - 'apps/web/src/lib/weekly-newsletter-dispatch.js'
      - 'apps/web/scripts/test-weekly-newsletter-resend-adapter.mjs'
      - 'apps/web/scripts/test-weekly-newsletter-dispatch.mjs'
      - 'apps/web/scripts/test-weekly-newsletter-static-artifact.mjs'
      - '.github/workflows/weekly-newsletter-dispatch.yml'

permissions:
  contents: read

jobs:
  weekly-newsletter-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --strict-allow-scripts

      - name: Syntax checks
        run: |
          node --check src/lib/weekly-newsletter-resend-adapter.js
          node --check src/lib/weekly-newsletter-dispatch.js

      - name: Guarded Resend adapter contract
        run: node scripts/test-weekly-newsletter-resend-adapter.mjs

      - name: Development dispatch worker contract
        run: node scripts/test-weekly-newsletter-dispatch.mjs

      - name: Production build
        run: npm run build

      - name: Static edition artifact regression
        run: node scripts/test-weekly-newsletter-static-artifact.mjs
