<text x="1195" y="360" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" fill="#071A33">DOLLAR REGIME</text>
<line x1="1070" y1="386" x2="1320" y2="386" stroke="#C9A35B" stroke-width="4"/>
<circle cx="1028" cy="445" r="5" fill="#071A33"/><text x="1052" y="452" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#161A1F">DXY + broad USD</text>
<circle cx="1028" cy="489" r="5" fill="#071A33"/><text x="1052" y="496" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#161A1F">Rates + real rates</text>
<circle cx="1028" cy="533" r="5" fill="#071A33"/><text x="1052" y="540" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#161A1F">Funding conditions</text>
<circle cx="1028" cy="577" r="5" fill="#071A33"/><text x="1052" y="584" font-family="Inter, Arial, Helvetica, sans-serif" font-size="24" fill="#161A1F">Risk appetite + credit</text>
<text x="800" y="725" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#071A33">Framework rule: use DXY as one signal, not the entire dollar regime.</text>
