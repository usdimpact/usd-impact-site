</g><text x="112" y="65" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#071A33">USD IMPACT</text>
<text x="70" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" fill="#071A33">DXY vs. the Dollar Regime</text><line x1="70" y1="154" x2="340" y2="154" stroke="#C9A35B" stroke-width="5"/><text x="70" y="192" font-family="Inter, Arial, Helvetica, sans-serif" font-size="22" fill="#161A1F">DXY is useful, but it is not the whole dollar story.</text>
